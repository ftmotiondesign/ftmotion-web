<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Şifre Yenile | FTMotion</title><style>body{margin:0;background:#090e19;color:#edf6ff;font:15px/1.6 system-ui}main{max-width:460px;margin:10vh auto;padding:25px;background:#152233;border:1px solid #304257;border-radius:18px}input,button{font:inherit;padding:12px;border-radius:10px}input{width:100%;box-sizing:border-box;background:#0b1624;color:white;border:1px solid #435771;margin:10px 0}button{background:#58e0c4;color:#062527;border:0;font-weight:800;cursor:pointer}a{color:#58e0c4}</style></head><body><main><a href="giris.html">← Üye girişine dön</a><h1>Yeni şifre oluştur</h1><p>Güvenli e-posta bağlantınızla geldiyseniz yeni şifrenizi belirleyin.</p><form id="form"><label>Yeni şifre<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">Şifreyi Güncelle</button></form><p id="status" role="status">Bağlantı kontrol ediliyor...</p></main><script type="module">import {client} from './shared/supabase-client.js';const form=document.getElementById('form'),status=document.getElementById('status'),password=document.getElementById('password');let db;try{db=await client();const {data}=await db.auth.getSession();status.textContent=data.session?'Yeni şifrenizi yazabilirsiniz.':'E-posta bağlantısının doğrulanması bekleniyor.';db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')status.textContent='Bağlantı doğrulandı. Yeni şifrenizi yazabilirsiniz.'})}catch(e){status.textContent='Bağlantı hatası: '+e.message;form.hidden=true}form.onsubmit=async e=>{e.preventDefault();if(!db)return;const {error}=await db.auth.updateUser({password:password.value});if(error){status.textContent='Şifre değiştirilemedi: '+error.message;return}status.textContent='Şifreniz güncellendi. Giriş sayfasından oturum açabilirsiniz.';form.hidden=true};</script></body></html>
