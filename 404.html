<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FTMotion QR yönlendiriliyor</title></head><body><p>QR sayfasına yönlendiriliyorsunuz…</p><script>(function(){const path=location.pathname;const ix=path.indexOf('/qr/');if(ix<0){document.body.textContent='Sayfa bulunamadı.';return}const prefix=path.slice(0,ix);const parts=path.slice(ix+4).split('/').filter(Boolean);if(parts.length<1){document.body.textContent='İşletme QR adresi eksik.';return}const target=prefix+'/qr/?slug='+encodeURIComponent(parts[0])+(parts[1]?'&page='+encodeURIComponent(parts[1]):'');location.replace(target);})();</script></body></html>
