<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMotion QR Yönlendirme</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22%3E%3C/svg%3E"></head><body><p>QR kartı açılıyor…</p><script>(function(){const ix=location.pathname.indexOf('/qr/');if(ix<0){document.body.textContent='Sayfa bulunamadı.';return}const prefix=location.pathname.slice(0,ix);const parts=location.pathname.slice(ix+4).split('/').filter(Boolean);if(!parts.length||parts.length>2){document.body.textContent='QR bağlantısı geçersiz.';return}const valid=p=>/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(p);if(!parts.every(valid)){document.body.textContent='QR bağlantısı geçersiz.';return}const target=new URL(prefix+'/qr/',location.origin);target.searchParams.set('short',parts[0]);if(parts[1])target.searchParams.set('page',parts[1]);target.searchParams.set('cleanpath',parts.join('/'));const preview=new URLSearchParams(location.search).get('template_preview');if(['classic','light','premium','vitrine'].includes(preview))target.searchParams.set('template_preview',preview);location.replace(target.href);})();</script></body></html>
