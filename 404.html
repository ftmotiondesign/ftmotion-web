<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMotion · Bağlantı</title>
<style>body{margin:0;background:#0b0b0d;color:#fafafa;font:16px/1.6 system-ui,sans-serif}body>p{display:none}.notice{max-width:470px;margin:15vh auto;padding:30px}h1{font-size:28px;line-height:1.2}p{color:#bbb}a,button{display:inline-block;margin:10px 10px 0 0;border:1px solid #666;border-radius:9px;padding:12px 18px;background:#fff;color:#111;text-decoration:none;font:inherit;cursor:pointer}</style><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22%3E%3C/svg%3E"></head>
<body><p>Bağlantı açılıyor…</p><script>
(function(){
 function notice(title,text){document.title=title+' · FTMotion';document.body.innerHTML='<main class="notice"><h1>'+title+'</h1><p>'+text+'</p><button onclick="location.reload()">Tekrar dene</button><a href="/">Ana sayfa</a></main>';}
 const education=location.pathname.match(/^\/([a-z0-9]+(?:-[a-z0-9]+)*)\/?$/);
 if(education){
  const entry=education[1]==='egitim-uygulama';
  notice('Eğitim bağlantısı açılıyor.','Lütfen kısa bir süre bekleyin.');
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);
  const resolve=entry?Promise.resolve():fetch('https://trchdzdvacalsyrsllar.supabase.co/functions/v1/education-api/resolve?slug='+encodeURIComponent(education[1]),{cache:'no-store',signal:controller.signal}).then(r=>{if(!r.ok)throw Error('not-found')});
  resolve.then(()=>fetch('/egitim-uygulama/index.html',{cache:'no-store',signal:controller.signal})).then(r=>{if(!r.ok)throw Error('not-published');return r.text()}).then(html=>{clearTimeout(timeout);document.open();document.write(html);document.close()}).catch(()=>{clearTimeout(timeout);notice('Eğitim bağlantısı şu anda açılamıyor.','Yayın henüz tamamlanmamış olabilir veya bağlantıda sorun yaşanıyor. Bir süre sonra tekrar deneyebilirsiniz.');});return;
 }
 const k=location.pathname.match(/^\/k\/([a-z0-9-]{2,40})\/?$/i);if(k){location.replace('/k/?code='+encodeURIComponent(k[1].toUpperCase()));return;}
 const ix=location.pathname.indexOf('/qr/');if(ix<0){notice('Sayfa bulunamadı.','Bağlantıyı kontrol edin veya ana sayfadan devam edin.');return;}
 const prefix=location.pathname.slice(0,ix),parts=location.pathname.slice(ix+4).split('/').filter(Boolean);
 if(!parts.length||parts.length>2){notice('QR bağlantısı geçersiz.','Kart bağlantısını kontrol edin.');return;}
 const valid=p=>/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(p);if(!parts.every(valid)){notice('QR bağlantısı geçersiz.','Kart bağlantısını kontrol edin.');return;}
 const target=new URL(prefix+'/qr/',location.origin);target.searchParams.set('short',parts[0]);if(parts[1])target.searchParams.set('page',parts[1]);target.searchParams.set('cleanpath',parts.join('/'));const preview=new URLSearchParams(location.search).get('template_preview');if(['classic','light','premium','vitrine'].includes(preview))target.searchParams.set('template_preview',preview);location.replace(target.href);
})();
</script></body></html>
