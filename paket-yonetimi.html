<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paket Yönetimi | FTMotion</title><style>
:root{--bg:#090e19;--panel:#162437;--border:#32465c;--ink:#eef6ff;--dim:#aac0d3;--a:#58dfc5}
*{box-sizing:border-box}body{background:radial-gradient(circle at 90% 0%,#102d37,var(--bg) 50%);color:var(--ink);font:15px/1.55 system-ui;margin:0}
header{background:#0c1724;border-bottom:1px solid var(--border);padding:19px max(20px,calc((100vw - 1160px)/2))}
a{color:var(--a);text-decoration:none}.wrap{max-width:1160px;margin:auto;padding:38px 20px}
h1{font-size:clamp(30px,4vw,48px);margin:0 0 10px}h2{margin:0 0 8px}p{color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:22px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
button,.btn{font:inherit;border:0;border-radius:10px;background:var(--a);color:#03272b;padding:11px 17px;font-weight:750;cursor:pointer}
.ghost{background:transparent;border:1px solid #55718c;color:var(--ink)}
input,textarea,select{background:#0a1726;color:var(--ink);border:1px solid #50657b;border-radius:9px;padding:11px;width:100%;font:inherit}
input[type=checkbox]{width:auto;accent-color:#58dfc5}label{display:block;margin:10px 0;color:var(--dim)}
.price{font-size:28px;font-weight:900;color:var(--a)}.muted{color:var(--dim)}.pill{border:1px solid #45677a;border-radius:30px;padding:5px 10px;font-size:12px;display:inline-block;color:var(--a)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.hidden{display:none}.error{color:#ffbb91}
@media(max-width:820px){.grid,.cols{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="shared/admin-sidebar.css"></head><body><header><a href="yonetim.html">← Merkezi yönetime dön</a></header><main class="wrap"><h1>Kampanya & Paket Yönetimi</h1><p>Sektöre göre paket oluştur, hizmetleri seç, indirim belirle, aktif/pasif yap. Menü her pakette zorunlu değildir.</p><div id="status" class="muted">Yetki kontrol ediliyor...</div><div id="protected" hidden><div class="cols"><section class="card"><h2 id="formtitle">Yeni paket oluştur</h2><form id="form"><label>Paket adı<input id="name" required maxlength="100" placeholder="Esnaf Dijital Tanıtım"></label><label>Sektör<select id="sector"><option>Genel</option><option>Esnaf / Mağaza</option><option>Restoran / Kafe</option><option>Eğitim</option><option>Emlak / Oto</option><option>Diğer</option></select></label><label>Açıklama<textarea id="description" rows="3"></textarea></label><h3>Paketteki hizmetler</h3><div id="checks"></div><div class="cols"><label>İndirim oranı (%)<input id="discount" type="number" min="0" max="90" step="0.5" value="15"></label><label>Sabit paket fiyatı (opsiyonel)<input id="fixed" type="number" min="0" step="0.01" placeholder="Boşsa yüzde kullanılır"></label></div><div class="cols"><label>Sıra<input id="order" type="number" value="0"></label><div><label><input id="active" type="checkbox" checked> Yayında</label><label><input id="featured" type="checkbox"> Öne çıkar</label></div></div><p class="muted" id="preview"></p><div class="actions"><button type="submit">Paketi kaydet</button><button type="button" class="ghost" id="reset">Yeni paket</button></div></form></section><section class="card"><h2>Mevcut paketler</h2><div id="rows"></div></section></div></div></main><script type="module">
import {client,currentUser} from './shared/supabase-client.js';
const $=x=>document.getElementById(x),fmt=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(n);
let db,services=[],packages=[],editing=null;
function notify(t,error=false){$('status').textContent=t;$('status').className=error?'error':'muted'}
function chosen(){return [...document.querySelectorAll('[data-service]:checked')].map(x=>x.value)}
function calculate(){const ss=services.filter(s=>chosen().includes(s.id)),total=ss.reduce((a,s)=>a+Number(s.price),0);let v=$('fixed').value.trim()!==''?Number($('fixed').value):Math.round(total*(1-Number($('discount').value||0)/100));$('preview').textContent='Normal toplam: '+fmt(total)+' · Kampanyalı: '+fmt(v)+' · Avantaj: '+fmt(total-v)}
function reset(){editing=null;$('form').reset();$('formtitle').textContent='Yeni paket oluştur';$('active').checked=true;$('discount').value=15;document.querySelectorAll('[data-service]').forEach(x=>x.checked=false);calculate()}
function render(){ $('checks').replaceChildren();for(const s of services){const l=document.createElement('label');const c=document.createElement('input');c.type='checkbox';c.dataset.service='1';c.value=s.id;c.onchange=calculate;l.append(c,document.createTextNode(' '+s.title+' ('+fmt(s.price)+')'));$('checks').append(l)}$('rows').replaceChildren();for(const p of packages){let card=document.createElement('div');card.className='card';const title=document.createElement('h3');title.textContent=p.name+' · '+p.sector;card.append(title);const info=document.createElement('p');info.textContent=(p.active?'Aktif':'Pasif')+' · '+p.service_ids.length+' hizmet';card.append(info);let btn=document.createElement('button');btn.textContent='Düzenle';btn.onclick=()=>{editing=p.id;$('formtitle').textContent='Paket düzenle';$('name').value=p.name;$('sector').value=p.sector;$('description').value=p.description;$('discount').value=p.discount_percent;$('fixed').value=p.fixed_price??'';$('order').value=p.sort_order;$('active').checked=p.active;$('featured').checked=p.featured;document.querySelectorAll('[data-service]').forEach(c=>c.checked=p.service_ids.includes(c.value));calculate();window.scrollTo({top:0,behavior:'smooth'})};card.append(btn);let del=document.createElement('button');del.textContent='Sil';del.className='ghost';del.style.marginLeft='8px';del.onclick=async()=>{if(!confirm(p.name+' paketi kalıcı olarak silinsin mi?'))return;const {error}=await db.from('service_packages').delete().eq('id',p.id);if(error)return notify(error.message,true);await reload();notify('Paket silindi')};card.append(del);$('rows').append(card)}}
async function reload(){const [a,b]=await Promise.all([db.from('services').select('id,title,price').eq('active',true).order('sort_order'),db.from('service_packages').select('*').order('sort_order')]);if(a.error)throw a.error;if(b.error)throw b.error;services=a.data||[];packages=b.data||[];render();reset()}
$('reset').onclick=reset;
$('fixed').oninput=calculate;$('discount').oninput=calculate;
$('form').onsubmit=async e=>{e.preventDefault();const ids=chosen();if(!ids.length)return notify('En az bir hizmet seçmelisin.',true);let total=services.filter(s=>ids.includes(s.id)).reduce((v,s)=>v+Number(s.price),0);let fixed=$('fixed').value.trim()===''?null:Number($('fixed').value);if(fixed!==null&&fixed>total)return notify('Sabit kampanya fiyatı normal toplamdan yüksek olamaz.',true);const payload={name:$('name').value.trim(),sector:$('sector').value,description:$('description').value,discount_percent:Number($('discount').value),fixed_price:fixed,service_ids:ids,sort_order:Number($('order').value||0),active:$('active').checked,featured:$('featured').checked};notify('Kaydediliyor...');const q=editing?db.from('service_packages').update(payload).eq('id',editing):db.from('service_packages').insert(payload);const {error}=await q;if(error)return notify('Kayıt hatası: '+error.message,true);await reload();notify('Paket başarıyla kaydedildi.')};
try{db=await client();const u=await currentUser(db);if(!u){location.href='giris.html';throw Error('Giriş yapmalısın')}const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();if(error)throw error;if(!data)throw Error('Bu hesabın yönetici yetkisi bulunmuyor');$('protected').hidden=false;await reload();notify('Yönetici: '+u.email)}catch(e){notify(e.message,true)}
</script><script type="module" src="shared/admin-sidebar.js"></script></body></html>
