<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMotion · Merkezi Yönetim</title><style>*{box-sizing:border-box}body{background:#090e19;color:#eef5ff;font:15px/1.5 system-ui;margin:0}header{background:#111e2d;padding:20px max(16px,calc((100vw - 1150px)/2));border-bottom:1px solid #304257}a{color:#58e0c4}main{max-width:1150px;margin:auto;padding:30px 16px}.panel{background:#172436;border:1px solid #33485c;padding:22px;border-radius:16px;margin:18px 0}h1{font-size:clamp(30px,4vw,44px)}h2{font-size:21px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}label{display:block;color:#afc1d1}input{width:100%;background:#0c1726;border:1px solid #45586b;color:white;padding:12px;border-radius:9px;font:inherit;margin:5px 0 14px}button{background:#58e0c4;color:#09222a;border:0;border-radius:10px;padding:12px 20px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#status{color:#ffdb8a;white-space:pre-wrap}.muted{color:#afc1d1}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><a href="/index.html">← FTMotion Ana Sayfa</a> · <a href="/panel.html">İşletme Paneli</a></header><main><h1>Merkezi yönetim</h1><p class="muted">Fiyatlar ve tanıtım içerikleri tüm ziyaretçilere Supabase üzerinden sunulur. Değişiklik yalnızca yetkili yöneticiler tarafından yapılabilir.</p><p id="status">Giriş kontrol ediliyor...</p><section id="editor" hidden><div class="panel"><h2>Hizmet fiyatları (TL)</h2><div id="prices" class="grid"></div><label>6'lı kampanya fiyatı<input id="bundle" type="number" min="0"></label><label>WhatsApp / iletişim numarası<input id="phone" placeholder="905xxxxxxxxx"></label><label>Ana sayfa tanıtım videosu (HTTPS MP4 bağlantısı)<input id="hero_video" placeholder="https://.../tanitim.mp4"></label><button id="save">Değişiklikleri yayınla</button></div><div class="panel"><h2>İşletmeler</h2><div id="businessList" class="muted">Yükleniyor...</div></div></section></main><script type="module">import {client,currentUser} from './shared/supabase-client.js';const labels={video:'Görselden Video',drone:'Sanal Drone',tour:'360° Mekân',qr:'QR/NFC Kart',menu:'Dijital Menü',web:'Web Sitesi'};const defaults={video:1500,drone:2000,tour:3500,qr:1500,menu:2500,web:4500};let db,settings;const status=document.getElementById('status');try{db=await client();let user=await currentUser(db);if(!user){location.replace('giris.html?next=yonetim.html');throw Error('Oturum açılmalı')}const {data:admin,error:err}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(err)throw err;if(!admin)throw Error('Bu hesap yönetici olarak yetkilendirilmemiş.');const {data,error}=await db.from('site_settings').select('*').eq('id',1).single();if(error)throw error;settings=data;status.textContent='Yetkili yönetici: '+user.email;editor.hidden=false;prices.innerHTML=Object.entries(labels).map(([id,label])=>`<label>${label}<input type="number" min="0" step="1" data-price="${id}" value="${Number(settings.prices?.[id]??defaults[id])}"></label>`).join('');bundle.value=settings.bundle;phone.value=settings.phone||'';hero_video.value=settings.hero_video||'';save.onclick=async()=>{save.disabled=true;status.textContent='Kaydediliyor...';const newPrices={};document.querySelectorAll('[data-price]').forEach(el=>newPrices[el.dataset.price]=Number(el.value));const next={prices:newPrices,bundle:Number(bundle.value),phone:phone.value.trim(),hero_video:hero_video.value.trim(),updated_at:new Date().toISOString()};if(next.hero_video&&!/^https:\/\//.test(next.hero_video)){status.textContent='Video adresi HTTPS ile başlamalı';save.disabled=false;return}const {error}=await db.from('site_settings').update(next).eq('id',1);status.textContent=error?'Hata: '+error.message:'Fiyatlar ve ayarlar merkezi olarak yayınlandı.';save.disabled=false};const {data:businesses,error:be}=await db.from('businesses').select('id,name,slug,active').order('created_at',{ascending:false}).limit(100);businessList.textContent=be?'İşletme bilgileri alınamadı: '+be.message:businesses?.length?businesses.map(x=>`${x.name} · ${x.slug||'adres bekleniyor'} · ${x.active?'Aktif':'Pasif'}`).join(' | '):'Henüz işletme kaydı yok.';}catch(e){status.textContent=e.message||String(e)}</script></body></html>
