<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dijitvizit Giriş | FTMotion</title><style>:root{--bg:#090e19;--panel:#152233;--line:#304257;--txt:#edf6ff;--accent:#58e0c4}*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);font:15px/1.65 system-ui;margin:0}header{padding:18px max(22px,calc((100vw - 1150px)/2));border-bottom:1px solid var(--line);background:#0e1825}a{color:var(--accent);text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:38px 22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:24px;margin:16px 0}.muted{color:#aabfd2}h1{font-size:clamp(30px,4vw,51px);line-height:1.13}h2{font-size:24px}button,.btn{background:var(--accent);color:#062527;border:0;border-radius:11px;padding:12px 20px;display:inline-block;font-weight:800;cursor:pointer;text-decoration:none}input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #435771;background:#0b1624;color:white;font:inherit;margin:5px 0 15px}label{display:block}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.media{width:100%;max-height:430px;object-fit:contain;border-radius:12px;background:#0a1420}.empty{min-height:210px;background:radial-gradient(circle,#234b56,#0d1b2a);border-radius:15px;display:grid;place-items:center;font-size:64px}.pill{color:var(--accent);font-weight:800;letter-spacing:1px;font-size:12px}.price{font-size:30px;font-weight:900}.small{font-size:12px}.line{border-top:1px solid #324658;padding:13px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}@media(max-width:740px){.cols{grid-template-columns:1fr}.wrap{padding:22px 16px}}</style><link rel="stylesheet" href="/shared/ftmotion-turuncu.css?v=2"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#ff7900"><link rel="icon" href="/pwa-icon.svg" type="image/svg+xml"><script defer src="/pwa.js"></script><style id="dijitvizit-login-style">:root{--bg:#f4f5f7;--panel:#fff;--line:#e0e3e8;--txt:#242a32;--accent:#ff7900}body{background:#f4f5f7;color:#242a32}header{background:#fff;border-color:#e0e3e8}header a{color:#a94b00}.card{background:#fff;border-color:#e0e3e8;box-shadow:0 9px 28px #1a243012}.muted{color:#606b78}h1{font-size:clamp(28px,5vw,38px)}input{background:#fff!important;color:#242a32!important;border-color:#cbd2db!important}label{color:#343b44}.pill{color:#ba5500}#togglePassword{background:#eef0f3!important;color:#333!important}#message{min-height:22px}</style><style id="dijitvizit-login-light-v2">html,body{background:#f1f3f5!important;color:#222831!important;color-scheme:light!important}header{background:#fff!important;border-bottom:1px solid #dfe3e8!important}header a{color:#a84d00!important}.wrap{background:transparent!important}.card{background:#fff!important;border:1px solid #dde2e8!important;color:#222831!important;box-shadow:0 8px 26px #17202b12!important}.card label,.card h1{color:#252b33!important}.muted,.card .muted{color:#596575!important}input{background:#fff!important;color:#222831!important;border:1px solid #c9d1da!important}input::placeholder{color:#778391!important}#message{color:#3b4653!important}#googleSignIn{background:#fff!important;color:#24292f!important;border:1px solid #cbd2da!important}#togglePassword{background:#edf0f3!important;color:#333!important}button:not(#googleSignIn):not(#togglePassword){background:#ff7900;color:#fff}button[onclick*="resetPassword"]{background:#eef0f3!important;color:#303944!important}</style><style id="dijitvizit-contrast-fix">html body,body .wrap,body .card{color:#202630!important}body .card *,body .wrap h1,body .wrap h2,body .wrap label{color:#26313e}body .wrap .muted,body .wrap .small,body #setup,body #message{color:#526071!important}body .wrap .pill{color:#b54e00!important}body .card input{color:#202630!important;background:#fff!important;-webkit-text-fill-color:#202630!important}body .card input::placeholder{color:#677483!important;-webkit-text-fill-color:#677483!important}body .card input:-webkit-autofill{-webkit-text-fill-color:#202630!important;box-shadow:0 0 0 1000px #fff inset!important}body .card button{color:#fff!important;background:#e96e00!important}body .card #googleSignIn{background:#fff!important;color:#24292f!important;-webkit-text-fill-color:#24292f!important;border:1px solid #bfc7d0!important}body .card #togglePassword,body .card button[onclick*="resetPassword"]{background:#e9edf1!important;color:#26313e!important}body .card a,body header a{color:#a64b00!important}body .card button:disabled{opacity:.55}body .card button:focus-visible,body .card input:focus-visible{outline:3px solid #ff7900;outline-offset:2px}</style></head><body><header><a href="index.html">← <b>FTMotion</b> · Ana sayfa</a></header><main class="wrap" style="max-width:600px"><div class="pill">FTMOTION · DİJİTVİZİT</div><h1>Hesabına giriş yap</h1><p class="muted">İşletme profilini kolayca yönet.</p><div class="card"><div id="setup" class="muted small" hidden></div><button id="googleSignIn" type="button" style="width:100%;background:#fff;color:#202124;border:1px solid #ddd;margin-bottom:14px">Google ile Devam Et</button><a href="telefonla-giris.html" style="display:block;text-align:center;background:#252b32;color:white;border-radius:10px;padding:12px;margin-bottom:12px;font-weight:700">📱 Telefon Numarası ile Devam Et</a><p class="muted" style="text-align:center">— veya e-posta ile —</p><form id="authform" onsubmit="event.preventDefault();auth('signin')"><label>E-posta<input type="email" id="email" required autocomplete="email"></label><label>Şifre<input type="password" id="password" minlength="6" required autocomplete="current-password"></label><button id="togglePassword" type="button" style="background:#25394d;color:#eef7ff;margin:0 0 16px;padding:8px 13px" aria-pressed="false">Şifreyi Göster</button><div class="actions"><button type="button" onclick="auth('signin')">Giriş Yap</button><button type="button" onclick="auth('signup')">Kayıt Ol</button><button type="button" onclick="resetPassword()" style="background:#25394d;color:#eef7ff">Şifremi Unuttum</button></div></form><p id="message" class="muted"></p></div></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';let cfg;try{cfg=await (await fetch('supabase-config.json',{cache:'no-store'})).json()}catch{}let client;if(cfg?.url?.startsWith('https://')&&cfg?.anonKey){client=createClient(cfg.url,cfg.anonKey);setup.textContent=''}else{authform.querySelectorAll('button').forEach(b=>b.disabled=true);setup.hidden=false;setup.textContent='Giriş sistemi şu anda kullanılamıyor.';document.getElementById('googleSignIn').disabled=true}document.getElementById('googleSignIn').onclick=async()=>{if(!client)return;const btn=document.getElementById('googleSignIn');btn.disabled=true;message.textContent='Google girişine yönlendiriliyorsunuz...';try{const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:new URL('giris.html',location.href).href}});if(error)throw error}catch(e){message.textContent='Google girişi başlatılamadı: '+(e.message||e);btn.disabled=false}};document.getElementById('togglePassword').onclick=()=>{const field=document.getElementById('password');const visible=field.type==='password';field.type=visible?'text':'password';togglePassword.textContent=visible?'Şifreyi Gizle':'Şifreyi Göster';togglePassword.setAttribute('aria-pressed',String(visible))};let routing=false;async function routeMember(){if(routing)return;try{const {data,error}=await client.auth.getSession();if(error)throw error;if(!data?.session){const qp=new URLSearchParams(location.search),hp=new URLSearchParams(location.hash.slice(1));const err=qp.get('error_description')||hp.get('error_description')||qp.get('error')||hp.get('error');if(err){message.textContent='Google oturum hatası: '+err}else if(qp.has('code')||hp.has('access_token')){message.textContent='Google dönüşü alındı ancak oturum kurulamadı. Chrome tarayıcısında yeniden deneyin.'}return;} routing=true;message.textContent='Google girişi başarılı. Paneliniz açılıyor...';let admin=false;try{const role=await client.rpc('is_ftm_admin');if(!role.error)admin=!!role.data}catch(e){console.warn('Rol kontrolü:',e?.message)}location.replace(admin?'panel.html':'kartim.html')}catch(e){routing=false;message.textContent='Giriş kontrolü: '+(e?.message||e)}}if(client){client.auth.onAuthStateChange((event,session)=>{if(session&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'))setTimeout(routeMember,0)});routeMember();if(location.hash.includes('error=')||new URLSearchParams(location.search).has('error')){const p=new URLSearchParams(location.hash.slice(1));message.textContent='Google giriş hatası: '+(p.get('error_description')||new URLSearchParams(location.search).get('error_description')||'Yeniden deneyin.')}}window.auth=async mode=>{if(!client)return;message.textContent='İşleniyor...';try{const result=mode==='signup'?await client.auth.signUp({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value}):await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(result.error)throw result.error;if(mode==='signup'&&!result.data?.session){message.textContent='Kaydınız oluşturuldu. E-posta doğrulama bağlantısını kontrol edin.';return;}const {data:sessionData}=await client.auth.getSession();if(!sessionData?.session){message.textContent='Oturum henüz açılmadı. Birkaç saniye sonra tekrar deneyin.';return;}document.getElementById('message').textContent='Giriş başarılı. Yönlendiriliyorsunuz...';let isAdmin=false;try{const role=await client.rpc('is_ftm_admin');if(!role.error)isAdmin=!!role.data;}catch(e){console.warn('Rol denetimi:',e?.message)}location.replace(isAdmin?'panel.html':'kartim.html');}catch(error){const reason=error?.message||String(error);message.textContent=/auth session missing|session missing/i.test(reason)?'Oturum bulunamadı. Lütfen e-posta ve şifrenizle tekrar giriş yapın.':reason;}};window.resetPassword=async()=>{if(!client)return;const address=document.getElementById('email').value.trim();if(!address){message.textContent='Önce e-posta adresinizi yazın.';return}const {error}=await client.auth.resetPasswordForEmail(address,{redirectTo:new URL('sifre-yenile.html',location.href).href});message.textContent=error?'İşlem tamamlanamadı: '+error.message:'Bu e-posta için hesap varsa şifre yenileme bağlantısı gönderildi.'};</script></body></html>
