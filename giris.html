<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İşletme Girişi | FTMotion</title><style>:root{--bg:#090e19;--panel:#152233;--line:#304257;--txt:#edf6ff;--accent:#58e0c4}*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);font:15px/1.65 system-ui;margin:0}header{padding:18px max(22px,calc((100vw - 1150px)/2));border-bottom:1px solid var(--line);background:#0e1825}a{color:var(--accent);text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:38px 22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:24px;margin:16px 0}.muted{color:#aabfd2}h1{font-size:clamp(30px,4vw,51px);line-height:1.13}h2{font-size:24px}button,.btn{background:var(--accent);color:#062527;border:0;border-radius:11px;padding:12px 20px;display:inline-block;font-weight:800;cursor:pointer;text-decoration:none}input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #435771;background:#0b1624;color:white;font:inherit;margin:5px 0 15px}label{display:block}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.media{width:100%;max-height:430px;object-fit:contain;border-radius:12px;background:#0a1420}.empty{min-height:210px;background:radial-gradient(circle,#234b56,#0d1b2a);border-radius:15px;display:grid;place-items:center;font-size:64px}.pill{color:var(--accent);font-weight:800;letter-spacing:1px;font-size:12px}.price{font-size:30px;font-weight:900}.small{font-size:12px}.line{border-top:1px solid #324658;padding:13px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}@media(max-width:740px){.cols{grid-template-columns:1fr}.wrap{padding:22px 16px}}</style><link rel="stylesheet" href="/shared/ftmotion-turuncu.css?v=2"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#ff7900"><link rel="icon" href="/pwa-icon.svg" type="image/svg+xml"><script defer src="/pwa.js"></script></head><body><header><a href="index.html">← <b>FTMotion</b> · Ana sayfa</a></header><main class="wrap" style="max-width:600px"><div class="pill">İŞLETME PANELİ</div><h1>Giriş yap / Üye ol</h1><div class="card"><div id="setup" class="muted small">Gerçek hesap sistemi için Supabase proje bağlantısı kurulması gerekiyor. Demo panelleri hesap gerektirmeden aşağıdan açabilirsiniz.</div><form id="authform"><label>E-posta<input type="email" id="email" required autocomplete="email"></label><label>Şifre<input type="password" id="password" minlength="6" required autocomplete="current-password"></label><button id="togglePassword" type="button" style="background:#25394d;color:#eef7ff;margin:0 0 16px;padding:8px 13px" aria-pressed="false">Şifreyi Göster</button><div class="actions"><button type="button" onclick="auth('signin')">Giriş Yap</button><button type="button" onclick="auth('signup')">Kayıt Ol</button><button type="button" onclick="resetPassword()" style="background:#25394d;color:#eef7ff">Şifremi Unuttum</button></div></form><p id="message" class="muted"></p><hr style="border-color:#304257"><div class="actions"><a href="qr/index.html">QR Demo ↗</a><a href="menu/index.html">Menü Demo ↗</a></div></div></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';let cfg;try{cfg=await (await fetch('supabase-config.json',{cache:'no-store'})).json()}catch{}let client;if(cfg?.url?.startsWith('https://')&&cfg?.anonKey){client=createClient(cfg.url,cfg.anonKey);setup.textContent='Supabase bağlantısı tanımlı. Hesabınızla giriş yapabilirsiniz.'}else{authform.querySelectorAll('button').forEach(b=>b.disabled=true);setup.textContent='Gerçek üyelik henüz kurulmadı. Supabase yapılandırması eksik. Demo panelleri kullanılabilir.'}document.getElementById('togglePassword').onclick=()=>{const field=document.getElementById('password');const visible=field.type==='password';field.type=visible?'text':'password';togglePassword.textContent=visible?'Şifreyi Gizle':'Şifreyi Göster';togglePassword.setAttribute('aria-pressed',String(visible))};async function redirectSignedIn(){try{const {data,error}=await client.auth.getSession();if(error||!data?.session)return;const {data:isAdmin,error:roleError}=await client.rpc('is_ftm_admin');if(roleError)return;location.replace(isAdmin?'panel.html':'kartim.html');}catch(e){console.warn('Oturum kontrolü:',e?.message)}};if(client)redirectSignedIn();window.auth=async mode=>{if(!client)return;message.textContent='İşleniyor...';try{const result=mode==='signup'?await client.auth.signUp({email:email.value.trim(),password:password.value}):await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(result.error)throw result.error;if(mode==='signup'&&!result.data?.session){message.textContent='Kaydınız oluşturuldu. E-posta doğrulama bağlantısını kontrol edin.';return;}const {data:sessionData}=await client.auth.getSession();if(!sessionData?.session){message.textContent='Oturum henüz açılmadı. Birkaç saniye sonra tekrar deneyin.';return;}message.textContent='Giriş başarılı. Yönlendiriliyorsunuz...';let isAdmin=false;try{const role=await client.rpc('is_ftm_admin');if(!role.error)isAdmin=!!role.data;}catch(e){console.warn('Rol denetimi:',e?.message)}location.replace(isAdmin?'panel.html':'kartim.html');}catch(error){const reason=error?.message||String(error);message.textContent=/auth session missing|session missing/i.test(reason)?'Oturum bulunamadı. Lütfen e-posta ve şifrenizle tekrar giriş yapın.':reason;}};window.resetPassword=async()=>{if(!client)return;const address=email.value.trim();if(!address){message.textContent='Önce e-posta adresinizi yazın.';return}const {error}=await client.auth.resetPasswordForEmail(address,{redirectTo:new URL('sifre-yenile.html',location.href).href});message.textContent=error?'İşlem tamamlanamadı: '+error.message:'Bu e-posta için hesap varsa şifre yenileme bağlantısı gönderildi.'};</script></body></html>
