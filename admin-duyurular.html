<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duyuru Yönetimi | FTMotion</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090f1b;color:#f0f6ff;font:15px/1.55 system-ui,Segoe UI,sans-serif}main{max-width:950px;padding:28px 17px 80px;margin:auto}a{color:#58dfc5}h1{font-size:30px}.card{background:#142235;border:1px solid #2d4155;padding:22px;border-radius:17px;margin:18px 0}label{display:grid;gap:6px;margin:12px 0}input,textarea{font:inherit;background:#0c1829;color:#fff;border:1px solid #426078;border-radius:10px;padding:12px;width:100%}textarea{min-height:125px;resize:vertical}button{font:inherit;border:0;padding:11px 16px;border-radius:10px;font-weight:700;background:#58dfc5;color:#092f2e;cursor:pointer}button.secondary{background:#254155;color:#eff9ff}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.entry{border-top:1px solid #2d4155;padding:15px 0}.entry p{white-space:pre-wrap}.muted{color:#a9bbcf}#status{margin:12px 0;color:#9bf6de}.error{color:#ffb9bd!important}[hidden]{display:none!important}</style></head><body><main><div class="row"><h1>📢 Genel Duyurular</h1><a href="panel.html">← İşletme Paneli</a></div><p class="muted">Burada yayınladığınız aktif duyurular, giriş yapan tüm işletme hesaplarının panelinde görünür.</p><div id="status">Yönetici yetkisi kontrol ediliyor...</div><div id="content" hidden><form id="form" class="card"><h2 id="formTitle">Yeni duyuru oluştur</h2><label>Başlık<input id="title" maxlength="150" required placeholder="Örn. Yeni QR kart özellikleri"></label><label>Duyuru metni<textarea id="body" required maxlength="10000" placeholder="Tüm üyelere gönderilecek duyuru"></textarea></label><label style="display:flex;align-items:center"><input id="active" type="checkbox" checked style="width:auto"> Yayında (tüm işletmeler görsün)</label><div class="row"><button type="submit" id="save">Duyuruyu Kaydet</button><button type="button" class="secondary" id="clear">Yeni Duyuru</button></div></form><div class="card"><div class="row"><h2>Yayınlanan ve taslak duyurular</h2><button class="secondary" id="refresh">Yenile</button></div><div id="list"></div></div></div></main><script type="module">
import {client,currentUser} from './shared/supabase-client.js';
const $=id=>document.getElementById(id);let db,editId=null;
function msg(t,err=false){$('status').textContent=t;$('status').className=err?'error':''}
function clear(){editId=null;$('form').reset();$('active').checked=true;$('formTitle').textContent='Yeni duyuru oluştur'}
async function load(){const {data,error}=await db.from('announcements').select('id,title,body,active,created_at').order('created_at',{ascending:false}).limit(100);if(error){msg('Duyurular okunamadı: '+error.message,true);return}const host=$('list');host.replaceChildren();if(!data.length){host.textContent='Henüz duyuru yok.';return}for(const r of data){const div=document.createElement('div');div.className='entry';const title=document.createElement('strong');title.textContent=r.title+' · '+(r.active?'Yayında':'Pasif');const t=document.createElement('div');t.className='muted';t.textContent=new Date(r.created_at).toLocaleString('tr-TR');const p=document.createElement('p');p.textContent=r.body;const edits=document.createElement('div');edits.className='row';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Düzenle';edit.onclick=()=>{editId=r.id;$('title').value=r.title;$('body').value=r.body;$('active').checked=r.active;$('formTitle').textContent='Duyuruyu düzenle';window.scrollTo({top:0,behavior:'smooth'})};const toggle=document.createElement('button');toggle.className='secondary';toggle.textContent=r.active?'Pasif Yap':'Yayınla';toggle.onclick=async()=>{toggle.disabled=true;const result=await db.from('announcements').update({active:!r.active}).eq('id',r.id);if(result.error)msg(result.error.message,true);else{msg('Durum güncellendi.');await load()}toggle.disabled=false};edits.append(edit,toggle);div.append(title,t,p,edits);host.append(div)}}
$('form').onsubmit=async(e)=>{e.preventDefault();const btn=$('save');btn.disabled=true;try{const payload={title:$('title').value.trim(),body:$('body').value.trim(),active:$('active').checked};if(!payload.title||!payload.body)throw Error('Başlık ve metni doldurun.');const q=editId?db.from('announcements').update(payload).eq('id',editId):db.from('announcements').insert(payload);const {error}=await q;if(error)throw error;msg('Duyuru kaydedildi.');clear();await load()}catch(ex){msg('Kaydedilemedi: '+ex.message,true)}finally{btn.disabled=false}};
$('clear').onclick=clear;$('refresh').onclick=load;
try{db=await client();const user=await currentUser(db);if(!user){location.replace('giris.html');throw Error('Oturum açılmadı')}const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data)throw Error('Bu sayfaya yalnızca ana yönetici erişebilir.');$('content').hidden=false;msg('Yönetici oturumu doğrulandı.');await load()}catch(ex){msg(ex.message,true)}
</script></body></html>
