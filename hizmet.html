ead><body><header><a href="index.html">← <b>FTMotion</b> · Ana sayfa</a></header><main class="wrap"><div class="pill">HİZMET TANITIMI</div><h1 id="title"></h1><p id="intro" class="muted"></p><div class="cols"><div class="card"><h2>Örnek görsel</h2><div id="imageSlot" class="empty">🎬</div></div><div class="card"><h2>Örnek video</h2><div id="videoSlot" class="empty">▶</div></div></div><div class="card"><h2>Hizmet kapsamı</h2><p id="scope"></p><p class="price" id="price"></p><p class="muted small">Başlangıç fiyatıdır. Hizmet kapsamı ve süre siparişte netleştirilir.</p><div class="actions"><a id="order" class="btn" href="siparis.html">Sipariş / Teklif Ver →</a><a href="kampanya.html" class="btn" style="background:#2b4556;color:#fff">6'lı kampanya</a></div></div></main><script>const services=[["video", "🎬", "Görselden Video Oluşturma", "Görsellerinizi sosyal medya için kısa tanıtım videolarına dönüştürün."], ["drone", "🌍", "Sanal Drone Konum Videosu", "Harita üzerinden işletmenize sinematik ulaşım ve konum anlatımı."], ["tour", "🏛️", "360° Mekân Çekimi", "Ziyaretçiler işletmenizi sanal tur ile gezsin."], ["qr", "📱", "QR / NFC Kart Çözümleri", "Kalıcı QR ve NFC ile işletme iletişim bilgileri."], ["menu", "🍽️", "QR Menü Uygulaması", "Fotoğraflı, kategorili ürün menüsü ve düzenleme paneli."], ["web", "💻", "Web Sitesi Hazırlama", "Mobil uyumlu profesyonel işletme tanıtım sitesi."]];const id=new URLSearchParams(location.search).get('id')||'video',row=services.find(s=>s[0]===id)||services[0];let cfg;try{cfg=JSON.parse(localStorage.getItem('ftmotion_prices'))||{}}catch{cfg={}}let media=cfg.media?.[id]||{};title.textContent=row[2];document.title=row[2]+" | FTMotion";intro.textContent=row[3];scope.textContent=row[3]+' Üretim süreci, teslim kapsamı ve revizyon sayısı sipariş esnasında belirlenir.';price.textContent=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(cfg.prices?.[id]??({video:1500,drone:2000,tour:3500,qr:1500,menu:2500,web:4500}[id]));order.href='siparis.html?hizmet='+encodeURIComponent(id);if(/^https:\/\//.test(media.image||'')){let i=document.createElement('img');i.src=media.image;i.alt=row[2];i.className='media';imageSlot.replaceWith(i)}else imageSlot.textContent=row[1];if(/^https:\/\//.test(media.video||'')){let v=document.createElement('video');v.src=media.video;v.controls=true;v.playsInline=true;v.className='media';videoSlot.replaceWith(v)}</script><script type="module">

 document.getElementById('title').textContent=data.title;document.title=data.title+' | FTMotion';document.getElementById('intro').textContent=data.description||'';document.getElementById('scope').textContent=(data.detail||data.description||'')+' '+(Array.isArray(data.features)?data.features.join(' • '):'');document.getElementById('price').textContent=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(data.price);document.getElementById('order').href='siparis.html?hizmet='+encodeURIComponent(data.id);
