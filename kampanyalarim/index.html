<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kampanyalarım | FTMotion</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font:15px system-ui}main{max-width:650px;margin:auto;padding:20px 15px 80px}h1{font-size:26px}h2{font-size:19px}.card{background:#1b1b20;border:1px solid #36363d;border-radius:17px;padding:17px;margin:16px 0}label{display:block;font-size:13px;margin:12px 0}input,textarea,select{display:block;width:100%;padding:12px;border:1px solid #555;background:#0d0d10;color:#fff;border-radius:10px;margin-top:6px;font:inherit}button,.btn{border:0;border-radius:10px;background:#ff7900;color:#111;padding:12px 15px;font:700 14px system-ui;cursor:pointer}button.secondary,.btn.secondary{background:#38383e;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:#bdbdc5;font-size:13px}a{color:#ffac61}img.preview{max-width:100%;max-height:200px;border-radius:12px;object-fit:contain}#status{padding:10px;color:#ffc68d}</style></head><body><main><a href="/kartim.html">← Üye Paneline Dön</a><h1>🎁 Kampanya Yönetimi</h1><p class="muted">Kampanyaların, seni kaydeden müşterilerin FTMotion Cebimde sayfasında görünecek.</p><div id="status">Bağlanıyor...</div><section id="workspace" hidden><div class="card"><h2 id="formTitle">Yeni Kampanya</h2><label>Kampanya Başlığı<input id="title" maxlength="120" required placeholder="Örn. Ekim ayına özel indirim"></label><label>Açıklama<textarea id="description" rows="3" maxlength="1000"></textarea></label><label>Görsel bağlantısı (HTTPS)<input id="image_url" placeholder="https://.../gorsel.jpg"></label><img id="preview" class="preview" hidden alt="Kampanya görseli"><div class="actions"><label style="flex:1">Başlangıç<input id="starts_on" type="date"></label><label style="flex:1">Bitiş<input id="ends_on" type="date"></label></div><label>Buton Metni<select id="cta_label"><option>Hemen Katıl</option><option>Sipariş Ver</option><option>Teklif İste</option><option>Randevu Al</option><option>Bilgi Al</option></select></label><label>Buton bağlantısı (HTTPS)<input id="cta_url" placeholder="https://wa.me/905..."></label><label><input type="checkbox" id="active" checked style="width:auto;display:inline"> Kampanya yayında</label><div class="actions"><button id="save">Kampanyayı Kaydet</button><button id="clear" class="secondary">Yeni Form</button></div></div><h2>Kampanyalarım</h2><div id="items"></div></section><p class="muted">Görseller için şimdilik mevcut HTTPS görsel bağlantısı kullanılır. Doğrudan dosya yükleme sonraki aşamadır.</p></main><script type="module">import{client}from'../shared/supabase-client.js';const $=id=>document.getElementById(id);let db,business,editing=null,rows=[];function status(s){$('status').textContent=s}function text(tag,t){const e=document.createElement(tag);e.textContent=t;return e}function reset(){editing=null;for(const k of ['title','description','image_url','starts_on','ends_on','cta_url'])$(k).value='';$('cta_label').value='Hemen Katıl';$('active').checked=true;$('formTitle').textContent='Yeni Kampanya';$('preview').hidden=true}function safe(u){if(!u)return true;try{return new URL(u).protocol==='https:'}catch{return false}}function showPreview(){let u=$('image_url').value.trim();$('preview').hidden=!safe(u)||!u;if(!$('preview').hidden)$('preview').src=u}$('image_url').addEventListener('change',showPreview);$('clear').onclick=reset;async function refresh(){const r=await db.from('business_campaigns').select('*').eq('business_id',business.id).order('sort_order').order('created_at',{ascending:false});if(r.error){status('Kampanya tablosu henüz kurulmamış olabilir: '+r.error.message);return}rows=r.data||[];const list=$('items');list.replaceChildren();if(!rows.length)list.append(text('p','Henüz kampanya oluşturmadın.'));for(const x of rows){const card=document.createElement('div');card.className='card';card.append(text('h2',x.title),text('p',x.description||''),text('p',(x.active?'Aktif':'Pasif')+' · '+(x.starts_on||'Başlangıç belirtilmedi')+' – '+(x.ends_on||'Bitiş belirtilmedi')));if(x.image_url){const im=document.createElement('img');im.className='preview';im.src=x.image_url;im.alt=x.title;card.append(im)}const a=document.createElement('div');a.className='actions';const edit=document.createElement('button');edit.textContent='Düzenle';edit.onclick=()=>{editing=x.id;for(const k of ['title','description','image_url','starts_on','ends_on','cta_label','cta_url'])$(k).value=x[k]||'';$('active').checked=x.active;$('formTitle').textContent='Kampanyayı Düzenle';showPreview();window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.textContent='Sil';del.className='secondary';del.onclick=async()=>{if(!confirm('Kampanya silinsin mi?'))return;const r=await db.from('business_campaigns').delete().eq('id',x.id).eq('business_id',business.id);if(r.error)status(r.error.message);else{status('Kampanya silindi');refresh()}};a.append(edit,del);card.append(a);list.append(card)}status(rows.length+' kampanya bulundu.')} $('save').onclick=async()=>{const title=$('title').value.trim(),start=$('starts_on').value,end=$('ends_on').value,image=$('image_url').value.trim(),link=$('cta_url').value.trim();if(!title)return status('Başlık gerekli.');if(start&&end&&start>end)return status('Tarihleri kontrol edin.');if(!safe(image)||!safe(link))return status('Bağlantılar HTTPS olmalı.');const payload={business_id:business.id,title,description:$('description').value.trim(),image_url:image||null,starts_on:start||null,ends_on:end||null,cta_label:$('cta_label').value,cta_url:link||null,active:$('active').checked};const r=editing?await db.from('business_campaigns').update(payload).eq('id',editing).eq('business_id',business.id):await db.from('business_campaigns').insert(payload);if(r.error)return status('Kaydedilemedi: '+r.error.message);reset();await refresh();status('✓ Kampanya kaydedildi')};try{db=await client();const auth=await db.auth.getUser();if(!auth.data.user)throw Error('Önce üye girişi yapmalısın.');const r=await db.from('businesses').select('id,name').eq('owner_id',auth.data.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('Hesabına bağlı işletme bulunamadı.');business=r.data;$('workspace').hidden=false;await refresh()}catch(e){status(e.message)}</script></body></html>
