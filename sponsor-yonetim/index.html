<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sponsor Yönetimi | FTMotion</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font:15px system-ui}main{max-width:700px;margin:auto;padding:22px 15px 80px}.card{background:#1b1b20;border:1px solid #36363d;border-radius:17px;padding:18px;margin:14px 0}h1{font-size:25px}label{display:block;margin:12px 0}input,select{width:100%;padding:12px;background:#101015;color:#fff;border:1px solid #555;border-radius:10px;margin-top:6px}button{border:0;border-radius:10px;background:#ff7900;color:#111;padding:12px 15px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#38383e;color:white}.muted{color:#bdbdc5;font-size:13px}a{color:#ffae6d}.actions{display:flex;flex-wrap:wrap;gap:8px}#status{color:#ffbc80;padding:8px 0}.preview{width:100%;max-height:230px;object-fit:contain;background:#101015;border-radius:13px;display:block;margin:12px 0;cursor:zoom-in}.detail{border:1px solid #44444e;background:#121217;border-radius:13px;padding:14px;margin:12px 0}.detail h3{margin:0 0 12px;font-size:17px}.detail p{margin:8px 0;line-height:1.5;overflow-wrap:anywhere}.detail strong{color:#e9e9ef}.detail .muted{font-size:12px}.toggle{background:#303038;color:#fff;margin:8px 0}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:12px}.lightbox img{max-width:100%;max-height:82vh;object-fit:contain}.lightbox button{align-self:flex-end}.flag{display:inline-block;border-radius:30px;background:#3a2b1f;color:#ffb879;padding:5px 10px;font-size:12px}.flag.live{background:#163d2a;color:#adf2c3}a.link{display:inline-block;margin-top:8px;overflow-wrap:anywhere}.card h2{font-size:20px;line-height:1.3}@media(max-width:440px){.card{padding:15px}.actions button{flex:1 1 45%}}</style></head><body><main><a href="/yonetim.html">← Yönetim Paneline Dön</a><h1>⭐ Sponsor Yönetimi</h1><p class="muted">Ödemeyi doğrula, başvuruyu onayla ve seçilen süreyle yayını başlat. Süre sonunda reklam otomatik gizlenir.</p><p id="status">Yetki kontrol ediliyor...</p><section id="items"></section></main><script type="module">import{client}from'../shared/supabase-client.js';const $=id=>document.getElementById(id);let db;function msg(t){$('status').textContent=t}function element(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e}function line(parent,label,value){const p=element('p','');p.append(element('strong','',label+': '),document.createTextNode(value||'Belirtilmemiş'));parent.append(p)}function showImage(url){const bg=element('div','lightbox'),close=action('✕ Kapat',()=>bg.remove(),'secondary'),img=document.createElement('img');img.src=url;img.alt='Kampanya görseli';bg.append(close,img);bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.body.append(bg)}function action(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}async function update(id,patch){if(!confirm('Bu işlem kaydedilsin mi?'))return;const r=await db.from('sponsor_requests').update(patch).eq('id',id);if(r.error)msg('İşlem başarısız: '+r.error.message);else await load()}async function load(){const r=await db.from('sponsor_requests').select('*').order('created_at',{ascending:false}).limit(200);if(r.error)return msg('Yetki veya tablo hatası: '+r.error.message);const a=$('items');a.replaceChildren();if(!r.data.length)a.textContent='Başvuru bulunamadı.';const ids=[...new Set(r.data.map(x=>x.business_id))],cids=[...new Set(r.data.map(x=>x.campaign_id))];const [bs,cs]=await Promise.all([db.from('businesses').select('id,name,slug,address').in('id',ids.length?ids:['00000000-0000-0000-0000-000000000000']),db.from('business_campaigns').select('id,title,description,image_url,cta_label,cta_url,active,starts_on,ends_on').in('id',cids.length?cids:['00000000-0000-0000-0000-000000000000'])]);for(const x of r.data){const card=document.createElement('div');card.className='card';const name=bs.data?.find(b=>b.id===x.business_id)?.name||'İşletme';const title=cs.data?.find(c=>c.id===x.campaign_id)?.title||'Kampanya';const active=x.status==='approved'&&x.payment_status==='confirmed'&&x.ends_at&&new Date(x.ends_at)>new Date()&&new Date(x.starts_at)<=new Date();const h=document.createElement('h2');h.textContent=name+' · '+title;card.append(h);const p=document.createElement('p');p.className='muted';p.textContent=(x.placement==='discover'?'Keşfet':'Fırsatlar')+' · '+(x.scope==='country'?'Türkiye':x.city+(x.scope==='district'?' / '+x.district:''))+' · '+x.duration_days+' gün · '+(active?'Yayında':x.status)+' · Ödeme: '+x.payment_status+(x.ends_at?' · Bitiş: '+new Date(x.ends_at).toLocaleDateString('tr-TR'):'');card.append(p);const campaign=cs.data?.find(c=>c.id===x.campaign_id);const details=element('div','detail');details.hidden=true;details.append(element('h3','','Reklam Önizlemesi ve Başvuru Detayları'));if(campaign?.image_url){const img=document.createElement('img');img.src=campaign.image_url;img.alt=title+' kampanya görseli';img.className='preview';img.loading='lazy';img.onerror=()=>{img.replaceWith(element('p','muted','Kampanya görseli yüklenemedi.'))};img.onclick=()=>showImage(campaign.image_url);details.append(img)}else details.append(element('p','muted','Bu kampanyaya görsel eklenmemiş.'));line(details,'İşletme',name);line(details,'Başlık',title);line(details,'Açıklama',campaign?.description);line(details,'Reklam alanı',x.placement==='discover'?'Keşfet → Sponsorlu İşletmeler':'Fırsatlar → Sponsorlu Fırsatlar');line(details,'Hedef bölge',x.scope==='country'?'Türkiye geneli':x.city+(x.scope==='district'?' / '+x.district:' (il geneli)'));line(details,'Yayın süresi',x.duration_days+' gün');line(details,'Kampanya durumu',campaign?.active?'Aktif':'Pasif');line(details,'Kampanya tarihi',[campaign?.starts_on,campaign?.ends_on].filter(Boolean).join(' – ')||'Süre belirtilmemiş');line(details,'İşlem butonu',campaign?.cta_label||'Varsayılan');line(details,'Başvuru tarihi',new Date(x.created_at).toLocaleDateString('tr-TR'));if(campaign?.cta_url){const link=element('a','link','↗ Reklam bağlantısını test et');link.href=campaign.cta_url;link.target='_blank';link.rel='noopener noreferrer';details.append(link)}const owner=bs.data?.find(b=>b.id===x.business_id);if(owner?.slug){const link=element('a','link','↗ İşletmenin QR profilini aç');link.href='/qr/'+encodeURIComponent(owner.slug);link.target='_blank';link.rel='noopener noreferrer';details.append(element('div',''),link)}const toggle=action('👁 Görseli ve Detayları İncele',()=>{details.hidden=!details.hidden;toggle.textContent=details.hidden?'👁 Görseli ve Detayları İncele':'⌃ Detayları Kapat'},'toggle');card.append(toggle,details);const actions=document.createElement('div');actions.className='actions';if(x.payment_status!=='confirmed')actions.append(action('✓ Ödemeyi Onayla',()=>update(x.id,{payment_status:'confirmed'})));if(x.status!=='rejected')actions.append(action('Reddet',()=>update(x.id,{status:'rejected',starts_at:null,ends_at:null}),'secondary'));if(x.status!=='approved'||!x.starts_at){const b=action('▶ '+x.duration_days+' Gün Yayınla',()=>{if(x.payment_status!=='confirmed')return msg('Önce ödeme onaylanmalı.');const start=new Date(),end=new Date(start.getTime()+x.duration_days*86400000);update(x.id,{status:'approved',starts_at:start.toISOString(),ends_at:end.toISOString()})});b.disabled=x.payment_status!=='confirmed';actions.append(b)}card.append(actions);a.append(card)}msg(r.data.length+' sponsor başvurusu.')}try{db=await client();const u=await db.auth.getUser();if(!u.data.user)throw Error('Giriş gerekli.');const admin=await db.rpc('is_ftm_admin');if(admin.error||admin.data!==true)throw Error('Bu sayfa yalnızca merkezi yöneticiye açıktır.');await load()}catch(e){msg(e.message)}</script></body></html>
