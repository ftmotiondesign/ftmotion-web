<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sponsor Yönetimi | FTMotion</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font:15px system-ui}main{max-width:700px;margin:auto;padding:22px 15px 80px}.card{background:#1b1b20;border:1px solid #36363d;border-radius:17px;padding:18px;margin:14px 0}h1{font-size:25px}label{display:block;margin:12px 0}input,select{width:100%;padding:12px;background:#101015;color:#fff;border:1px solid #555;border-radius:10px;margin-top:6px}button{border:0;border-radius:10px;background:#ff7900;color:#111;padding:12px 15px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#38383e;color:white}.muted{color:#bdbdc5;font-size:13px}a{color:#ffae6d}.actions{display:flex;flex-wrap:wrap;gap:8px}#status{color:#ffbc80;padding:8px 0}</style></head><body><main><a href="/kartim.html">← Panele Dön</a><h1>⭐ Sponsor Yönetimi</h1><p class="muted">Ödemeyi doğrula, başvuruyu onayla ve 30 günlük yayını başlat. Süre sonunda reklam otomatik gizlenir.</p><p id="status">Yetki kontrol ediliyor...</p><section id="items"></section></main><script type="module">import{client}from'../shared/supabase-client.js';const $=id=>document.getElementById(id);let db;function msg(t){$('status').textContent=t}function action(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}async function update(id,patch){if(!confirm('Bu işlem kaydedilsin mi?'))return;const r=await db.from('sponsor_requests').update(patch).eq('id',id);if(r.error)msg('İşlem başarısız: '+r.error.message);else await load()}async function load(){const r=await db.from('sponsor_requests').select('*').order('created_at',{ascending:false}).limit(200);if(r.error)return msg('Yetki veya tablo hatası: '+r.error.message);const a=$('items');a.replaceChildren();if(!r.data.length)a.textContent='Başvuru bulunamadı.';const ids=[...new Set(r.data.map(x=>x.business_id))],cids=[...new Set(r.data.map(x=>x.campaign_id))];const [bs,cs]=await Promise.all([db.from('businesses').select('id,name').in('id',ids.length?ids:['00000000-0000-0000-0000-000000000000']),db.from('business_campaigns').select('id,title').in('id',cids.length?cids:['00000000-0000-0000-0000-000000000000'])]);for(const x of r.data){const card=document.createElement('div');card.className='card';const name=bs.data?.find(b=>b.id===x.business_id)?.name||'İşletme';const title=cs.data?.find(c=>c.id===x.campaign_id)?.title||'Kampanya';const active=x.status==='approved'&&x.payment_status==='confirmed'&&x.ends_at&&new Date(x.ends_at)>new Date()&&new Date(x.starts_at)<=new Date();const h=document.createElement('h2');h.textContent=name+' · '+title;card.append(h);const p=document.createElement('p');p.className='muted';p.textContent='Fırsatlar · Çanakkale · 30 gün · '+(active?'Yayında':x.status)+' · Ödeme: '+x.payment_status+(x.ends_at?' · Bitiş: '+new Date(x.ends_at).toLocaleDateString('tr-TR'):'');card.append(p);const actions=document.createElement('div');actions.className='actions';if(x.payment_status!=='confirmed')actions.append(action('✓ Ödemeyi Onayla',()=>update(x.id,{payment_status:'confirmed'})));if(x.status!=='rejected')actions.append(action('Reddet',()=>update(x.id,{status:'rejected',starts_at:null,ends_at:null}),'secondary'));if(x.status!=='approved'||!x.starts_at){const b=action('▶ 30 Gün Yayınla',()=>{if(x.payment_status!=='confirmed')return msg('Önce ödeme onaylanmalı.');const start=new Date(),end=new Date(start.getTime()+30*86400000);update(x.id,{status:'approved',starts_at:start.toISOString(),ends_at:end.toISOString()})});b.disabled=x.payment_status!=='confirmed';actions.append(b)}card.append(actions);a.append(card)}msg(r.data.length+' sponsor başvurusu.')}try{db=await client();const u=await db.auth.getUser();if(!u.data.user)throw Error('Giriş gerekli.');const admin=await db.rpc('is_ftm_admin');if(admin.error||admin.data!==true)throw Error('Bu sayfa yalnızca merkezi yöneticiye açıktır.');await load()}catch(e){msg(e.message)}</script></body></html>
