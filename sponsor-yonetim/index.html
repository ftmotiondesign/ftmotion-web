<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sponsor Yönetimi | FTMotion</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font:15px system-ui}main{max-width:700px;margin:auto;padding:22px 15px 80px}.card{background:#1b1b20;border:1px solid #36363d;border-radius:17px;padding:18px;margin:14px 0}h1{font-size:25px}label{display:block;margin:12px 0}input,select{width:100%;padding:12px;background:#101015;color:#fff;border:1px solid #555;border-radius:10px;margin-top:6px}button{border:0;border-radius:10px;background:#ff7900;color:#111;padding:12px 15px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#38383e;color:white}.muted{color:#bdbdc5;font-size:13px}a{color:#ffae6d}.actions{display:flex;flex-wrap:wrap;gap:8px}#status{color:#ffbc80;padding:8px 0}.preview{width:100%;max-height:230px;object-fit:contain;background:#101015;border-radius:13px;display:block;margin:12px 0;cursor:zoom-in}.detail{border:1px solid #44444e;background:#121217;border-radius:13px;padding:14px;margin:12px 0}.detail h3{margin:0 0 12px;font-size:17px}.detail p{margin:8px 0;line-height:1.5;overflow-wrap:anywhere}.detail strong{color:#e9e9ef}.detail .muted{font-size:12px}.toggle{background:#303038;color:#fff;margin:8px 0}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:12px}.lightbox img{max-width:100%;max-height:82vh;object-fit:contain}.lightbox button{align-self:flex-end}.flag{display:inline-block;border-radius:30px;background:#3a2b1f;color:#ffb879;padding:5px 10px;font-size:12px}.flag.live{background:#163d2a;color:#adf2c3}a.link{display:inline-block;margin-top:8px;overflow-wrap:anywhere}.card h2{font-size:20px;line-height:1.3}@media(max-width:440px){.card{padding:15px}.actions button{flex:1 1 45%}}.videoBox{border:1px solid #664321;border-radius:13px;padding:13px;margin:13px 0;background:#251c16}.videoBox p{overflow-wrap:anywhere}.videoBox select,.videoBox input{width:100%;margin:7px 0}.videoBox label{display:block;margin-top:9px;font-size:12px;color:#d6c4b4}.creative{border:1px solid #554b42;border-radius:14px;background:#19191e;padding:14px;margin:14px 0}.creative h3{margin:0 0 6px}.creative small{color:#bbb}.creative video,.creative img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#08080b;border-radius:12px;margin:10px 0}.creative .buttons{display:flex;gap:8px;flex-wrap:wrap}.creative .buttons button{flex:1}.creative input[type=file]{font-size:13px}.creative .note{font-size:12px;color:#c7bdaf}</style></head><body><main><a href="/yonetim.html">← Yönetim Paneline Dön</a><h1>⭐ Sponsor Yönetimi</h1><p class="muted">Ödemeyi doğrula, başvuruyu onayla ve seçilen süreyle yayını başlat. Süre sonunda reklam otomatik gizlenir.</p><p id="status">Yetki kontrol ediliyor...</p><section id="items"></section></main><script type="module">import{client}from'../shared/supabase-client.js';const $=id=>document.getElementById(id);let db;function msg(t){$('status').textContent=t}function element(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e}function line(parent,label,value){const p=element('p','');p.append(element('strong','',label+': '),document.createTextNode(value||'Belirtilmemiş'));parent.append(p)}function showImage(url){const bg=element('div','lightbox'),close=action('✕ Kapat',()=>bg.remove(),'secondary'),img=document.createElement('img');img.src=url;img.alt='Kampanya görseli';bg.append(close,img);bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.body.append(bg)}function action(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}async function update(id,patch){if(!confirm('Bu işlem kaydedilsin mi?'))return;const r=await db.from('sponsor_requests').update(patch).eq('id',id);if(r.error)msg('İşlem başarısız: '+r.error.message);else await load()}function creativeEditor(campaign,video){
 const box=element('section','creative');box.append(element('h3','','🖼️ Sponsor Görsel / Video Ayarları'));
 box.append(element('p','muted','16:9 reklam önizlemesi · Yazı ve logo bindirilmez · Gelecekte müşteri panelinden de yönetilebilir.'));
 const kind=element('label','','Reklam türü');const type=document.createElement('select');type.add(new Option('Görsel','image'));type.add(new Option('Video','video'));kind.append(type);box.append(kind);
 const imgUrl=element('label','','Görsel bağlantısı');const image=document.createElement('input');image.type='url';image.placeholder='https://.../afis.jpg';image.value=campaign?.image_url||'';imgUrl.append(image);box.append(imgUrl);
 const vidUrl=element('label','','Video bağlantısı (MP4 / WebM)');const videoInput=document.createElement('input');videoInput.type='url';videoInput.placeholder='https://.../reklam.mp4';videoInput.value=campaign?.video_url||video?.video_url||'';vidUrl.append(videoInput);box.append(vidUrl);
 const uploadLabel=element('label','','Dosya seçerek önizle (henüz sunucuya yüklenmez)');const file=document.createElement('input');file.type='file';file.accept='image/jpeg,image/png,image/webp,video/mp4,video/webm';uploadLabel.append(file);box.append(uploadLabel);
 const note=element('p','note','Dosya seçimi yalnızca yerel önizleme içindir. Yayın için kalıcı HTTPS medya bağlantısı gerekir.');box.append(note);
 const preview=element('div');box.append(preview);let objectUrl='';
 function redraw(){preview.replaceChildren();const isVideo=type.value==='video',url=isVideo?videoInput.value.trim():image.value.trim();if(!url)return;const media=document.createElement(isVideo?'video':'img');media.src=url;if(isVideo){media.controls=true;media.playsInline=true;media.preload='metadata'}else media.alt='Sponsor afiş önizlemesi';media.onerror=()=>{preview.textContent='Medya yüklenemedi. Bağlantıyı kontrol edin.'};preview.append(media)}
 type.value=videoInput.value?'video':'image';type.onchange=redraw;image.oninput=()=>{if(type.value==='image')redraw()};videoInput.oninput=()=>{if(type.value==='video')redraw()};
 file.onchange=()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);const f=file.files?.[0];if(!f)return;const isVideo=f.type.startsWith('video/');if(!f.type.startsWith('image/')&&!isVideo)return msg('Yalnızca görsel veya video seçin.');if(f.size>50*1024*1024)return msg('Önizleme için dosya 50 MB altında olmalı.');type.value=isVideo?'video':'image';objectUrl=URL.createObjectURL(f);preview.replaceChildren();const media=document.createElement(isVideo?'video':'img');media.src=objectUrl;if(isVideo)media.controls=true;preview.append(media);note.textContent='Bu dosya yalnızca cihazınızda önizleniyor; sunucuya yüklenmedi.'};
 const buttons=element('div','buttons');const save=action('💾 Bağlantıyı Kaydet',async()=>{
 const value=type.value==='video'?videoInput.value.trim():image.value.trim();if(!/^https:\/\//i.test(value))return msg('Yayın için HTTPS medya bağlantısı girin.');
 if(type.value==='video'&&!/\.(mp4|webm)(?:[?#]|$)/i.test(value))return msg('Video bağlantısı MP4 veya WebM olmalı.');
 save.disabled=true;try{
 let patch=type.value==='video'?{video_url:value}:{image_url:value};
 let result=await db.from('business_campaigns').update(patch).eq('id',campaign.id);
 if(result.error&&type.value==='video'&&/video_url/i.test(result.error.message))return msg('Veritabanında video_url sütunu henüz bulunmuyor. Önce şema eklenmeli.');
 if(result.error)throw result.error;msg('Sponsor medya bağlantısı kaydedildi.');await load()
 }catch(e){msg('Kayıt başarısız: '+e.message)}finally{save.disabled=false}
 });buttons.append(save);buttons.append(action('↻ Önizle',redraw,'secondary'));box.append(buttons);redraw();return box
}
async function load(){const r=await db.from('sponsor_requests').select('*').order('created_at',{ascending:false}).limit(200);if(r.error)return msg('Yetki veya tablo hatası: '+r.error.message);const vr=await db.from('sponsor_video_requests').select('*').order('created_at',{ascending:false});const videos=vr.error?[]:(vr.data||[]);const a=$('items');a.replaceChildren();if(!r.data.length)a.textContent='Başvuru bulunamadı.';const ids=[...new Set(r.data.map(x=>x.business_id))],cids=[...new Set(r.data.map(x=>x.campaign_id))];const [bs,cs]=await Promise.all([db.from('businesses').select('id,name,slug,address').in('id',ids.length?ids:['00000000-0000-0000-0000-000000000000']),db.from('business_campaigns').select('*').in('id',cids.length?cids:['00000000-0000-0000-0000-000000000000'])]);for(const x of r.data){const card=document.createElement('div');card.className='card';const name=bs.data?.find(b=>b.id===x.business_id)?.name||'İşletme';const title=cs.data?.find(c=>c.id===x.campaign_id)?.title||'Kampanya';const active=x.status==='approved'&&x.payment_status==='confirmed'&&x.ends_at&&new Date(x.ends_at)>new Date()&&new Date(x.starts_at)<=new Date();const h=document.createElement('h2');h.textContent=name+' · '+title;card.append(h);const p=document.createElement('p');p.className='muted';p.textContent=(x.placement==='discover'?'Keşfet':'Fırsatlar')+' · '+(x.scope==='country'?'Türkiye':x.city+(x.scope==='district'?' / '+x.district:''))+' · '+x.duration_days+' gün · '+(active?'Yayında':x.status)+' · Ödeme: '+x.payment_status+(x.ends_at?' · Bitiş: '+new Date(x.ends_at).toLocaleDateString('tr-TR'):'');card.append(p);const campaign=cs.data?.find(c=>c.id===x.campaign_id);if(campaign)card.append(creativeEditor(campaign,videos.find(v=>v.sponsor_request_id===x.id)));const details=element('div','detail');details.hidden=true;details.append(element('h3','','Reklam Önizlemesi ve Başvuru Detayları'));if(campaign?.image_url){const img=document.createElement('img');img.src=campaign.image_url;img.alt=title+' kampanya görseli';img.className='preview';img.loading='lazy';img.onerror=()=>{img.replaceWith(element('p','muted','Kampanya görseli yüklenemedi.'))};img.onclick=()=>showImage(campaign.image_url);details.append(img)}else details.append(element('p','muted','Bu kampanyaya görsel eklenmemiş.'));line(details,'İşletme',name);line(details,'Başlık',title);line(details,'Açıklama',campaign?.description);line(details,'Reklam alanı',x.placement==='discover'?'Keşfet → Sponsorlu İşletmeler':'Fırsatlar → Sponsorlu Fırsatlar');line(details,'Hedef bölge',x.scope==='country'?'Türkiye geneli':x.city+(x.scope==='district'?' / '+x.district:' (il geneli)'));line(details,'Yayın süresi',x.duration_days+' gün');line(details,'Kampanya durumu',campaign?.active?'Aktif':'Pasif');line(details,'Kampanya tarihi',[campaign?.starts_on,campaign?.ends_on].filter(Boolean).join(' – ')||'Süre belirtilmemiş');line(details,'İşlem butonu',campaign?.cta_label||'Varsayılan');line(details,'Başvuru tarihi',new Date(x.created_at).toLocaleDateString('tr-TR'));if(campaign?.cta_url){const link=element('a','link','↗ Reklam bağlantısını test et');link.href=campaign.cta_url;link.target='_blank';link.rel='noopener noreferrer';details.append(link)}const owner=bs.data?.find(b=>b.id===x.business_id);if(owner?.slug){const link=element('a','link','↗ İşletmenin QR profilini aç');link.href='/qr/'+encodeURIComponent(owner.slug);link.target='_blank';link.rel='noopener noreferrer';details.append(element('div',''),link)}const toggle=action('👁 Görseli ve Detayları İncele',()=>{details.hidden=!details.hidden;toggle.textContent=details.hidden?'👁 Görseli ve Detayları İncele':'⌃ Detayları Kapat'},'toggle');card.append(toggle,details);const creativeRequests=videos.filter(v=>v.sponsor_request_id===x.id&&String(v.brief||'').startsWith('SPONSOR_REKLAM_ONAYI')).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));for(const request of creativeRequests){const box=element('div','videoBox');box.append(element('h3','','📥 Müşteri Reklam Onayı'));line(box,'Dosya',request.brief);line(box,'Durum',({requested:'İnceleme bekliyor',completed:'Onaylandı',rejected:'Reddedildi'}[request.status]||request.status));const signed=await db.storage.from('sponsor-video-assets').createSignedUrl(request.image_path,3600);if(!signed.error&&signed.data?.signedUrl){const isVideo=/\\.(mp4|webm)$/i.test(request.image_path);const media=document.createElement(isVideo?'video':'img');media.src=signed.data.signedUrl;media.className='preview';if(isVideo){media.controls=true;media.playsInline=true}else{media.alt='Müşteri reklam tasarımı';media.onclick=()=>showImage(media.src)}box.append(media);const link=element('a','link','⬇ Dosyayı aç / indir');link.href=signed.data.signedUrl;link.target='_blank';link.rel='noopener noreferrer';box.append(link)}const urlLabel=element('label','','Kalıcı yayın bağlantısı (HTTPS)');const publishUrl=document.createElement('input');publishUrl.type='url';publishUrl.placeholder='https://...';urlLabel.append(publishUrl);box.append(urlLabel);const actions=element('div','actions');actions.append(action('✓ Reklamı Onayla',async()=>{const url=publishUrl.value.trim(),isVideo=/\\.(mp4|webm)$/i.test(request.image_path);if(!/^https:\/\//i.test(url))return msg('Onay için kalıcı HTTPS yayın bağlantısı gerekli. Geçici önizleme bağlantısı kullanma.');if(isVideo&&!/\\.(mp4|webm)(?:[?#]|$)/i.test(url))return msg('Video MP4 veya WebM bağlantısı olmalı.');if(!confirm('Reklamı onaylayıp kampanya medyasını değiştirmek istiyor musun?'))return;const patch=isVideo?{video_url:url}:{image_url:url};const changed=await db.from('business_campaigns').update(patch).eq('id',x.campaign_id);if(changed.error)return msg('Kampanya güncellenemedi: '+changed.error.message);const done=await db.from('sponsor_video_requests').update({status:'completed',video_url:isVideo?url:null,updated_at:new Date().toISOString()}).eq('id',request.id);if(done.error)return msg('Kampanya kaydedildi ancak onay durumu güncellenemedi: '+done.error.message);await load();msg('Reklam onaylandı. Sponsor yayını, ödeme ve tarih koşullarına bağlıdır.')}));actions.append(action('✕ Reddet',async()=>{if(!confirm('Bu reklam tasarımını reddetmek istiyor musun?'))return;const q=await db.from('sponsor_video_requests').update({status:'rejected',updated_at:new Date().toISOString()}).eq('id',request.id);if(q.error)return msg(q.error.message);await load()},'secondary'));box.append(actions);card.append(box)}const video=videos.find(v=>v.sponsor_request_id===x.id&&!String(v.brief||'').startsWith('SPONSOR_REKLAM_ONAYI'));if(video){const box=element('div','videoBox');box.append(element('h3','','🎬 Ücretsiz Video Talebi'));line(box,'Talep',video.brief);if(video.image_path){const signed=await db.storage.from('sponsor-video-assets').createSignedUrl(video.image_path,3600);if(!signed.error&&signed.data?.signedUrl){const image=document.createElement('img');image.src=signed.data.signedUrl;image.alt='İşletmenin yüklediği hazır tasarım';image.className='preview';image.onclick=()=>showImage(signed.data.signedUrl);box.append(image);const open=element('a','link','↗ Yüklenen görseli aç');open.href=signed.data.signedUrl;open.target='_blank';open.rel='noopener noreferrer';box.append(open);const download=action('⬇ Görseli İndir',async()=>{download.disabled=true;try{const result=await db.storage.from('sponsor-video-assets').download(video.image_path);if(result.error)throw result.error;const blobUrl=URL.createObjectURL(result.data);const a=document.createElement('a');a.href=blobUrl;a.download=(video.image_path.split('/').pop()||'sponsor-gorsel.jpg');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(blobUrl),60000)}catch(err){msg('Görsel indirilemedi: '+err.message)}finally{download.disabled=false}},'secondary');box.append(download)}else box.append(element('p','muted','Yüklenen görsel açılamadı.'))}line(box,'Durum',({requested:'Yeni talep',in_progress:'Hazırlanıyor',completed:'Tamamlandı',rejected:'Uygun bulunmadı'}[video.status]||video.status));if(video.reference_url&&/^https:\/\//i.test(video.reference_url)){const link=element('a','link','↗ Referansı aç');link.href=video.reference_url;link.target='_blank';link.rel='noopener noreferrer';box.append(link)}const label=element('label','','Video üretim durumu');const sel=document.createElement('select');for(const [value,name] of [['requested','Yeni talep'],['in_progress','Hazırlanıyor'],['completed','Tamamlandı'],['rejected','Uygun bulunmadı']]){const o=new Option(name,value);sel.add(o)}sel.value=video.status;label.append(sel);box.append(label);const urlLabel=element('label','','Tamamlanan video bağlantısı');const url=document.createElement('input');url.type='url';url.placeholder='https://...';url.value=video.video_url||'';urlLabel.append(url);box.append(urlLabel);const save=action('Video Durumunu Kaydet',async()=>{if(url.value.trim()&&!/^https:\/\//i.test(url.value.trim()))return msg('Video bağlantısı https:// ile başlamalı.');const q=await db.from('sponsor_video_requests').update({status:sel.value,video_url:url.value.trim()||null,updated_at:new Date().toISOString()}).eq('id',video.id);if(q.error)msg('Video kaydı başarısız: '+q.error.message);else await load()});box.append(save);card.append(box)}const actions=document.createElement('div');actions.className='actions';if(x.payment_status!=='confirmed')actions.append(action('✓ Ödemeyi Onayla',()=>update(x.id,{payment_status:'confirmed'})));if(x.status!=='rejected')actions.append(action('Reddet',()=>update(x.id,{status:'rejected',starts_at:null,ends_at:null}),'secondary'));if(x.status!=='approved'||!x.starts_at){const b=action('▶ '+x.duration_days+' Gün Yayınla',()=>{if(x.payment_status!=='confirmed')return msg('Önce ödeme onaylanmalı.');const start=new Date(),end=new Date(start.getTime()+x.duration_days*86400000);update(x.id,{status:'approved',starts_at:start.toISOString(),ends_at:end.toISOString()})});b.disabled=x.payment_status!=='confirmed';actions.append(b)}card.append(actions);a.append(card)}msg(r.data.length+' sponsor başvurusu.')}try{db=await client();const u=await db.auth.getUser();if(!u.data.user)throw Error('Giriş gerekli.');const admin=await db.rpc('is_ftm_admin');if(admin.error||admin.data!==true)throw Error('Bu sayfa yalnızca merkezi yöneticiye açıktır.');await load()}catch(e){msg(e.message)}</script></body></html>
