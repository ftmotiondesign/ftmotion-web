<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR / NFC Stok | FTMotion</title><style>
*{box-sizing:border-box}body{background:#0b111d;color:#f1f5f9;font:15px system-ui;margin:0}main{max-width:1120px;margin:auto;padding:25px 16px}a{color:#5eead4}h1{font-size:28px}.panel{background:#132135;border:1px solid #34495d;border-radius:14px;padding:18px;margin:18px 0}input,select,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #536477}input,select{background:#0c1829;color:white;min-width:0}button{cursor:pointer;background:#ff8200;color:#141414;font-weight:700}button:disabled{opacity:.5}.fields{display:flex;flex-wrap:wrap;gap:9px;align-items:end}.fields label{display:grid;gap:6px;flex:1 1 160px}#msg{color:#8ef1d4;min-height:22px}.error{color:#ff9d9d!important}.item{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px solid #30485a;padding:14px 0}.item strong{min-width:110px}.item select{flex:1 1 220px}.muted{color:#aab9ca;font-size:13px}.tag{background:#344456;border-radius:20px;padding:4px 9px;font-size:12px}#search{width:100%;margin:10px 0}</style></head><body><main><a href="admin-isletmeler.html">← Merkezi Yönetime Dön</a><h1>QR / NFC Kart Stok ve Atama</h1><p class="muted">Önceden basılmış ürünleri benzersiz stok kodlarıyla takip edin. Atama, basılı QR bağlantısını otomatik değiştirmez.</p><div id="msg">Yönetici oturumu kontrol ediliyor...</div><section class="panel"><h2>Yeni stok kaydı</h2><form id="add" class="fields"><label>Stok kodu<input id="code" required maxlength="40" placeholder="QR-0027" pattern="[A-Za-z0-9-]{2,40}"></label><label>Ürün tipi<select id="type"><option>QR Kart</option><option>NFC Kart</option><option>NFC Etiket</option><option>Masaüstü</option></select></label><label>Not<input id="note" maxlength="500" placeholder="Baskı partisi / not"></label><button>Stoka Ekle</button></form></section><section class="panel"><h2>Stok Listesi</h2><div id="counts" class="muted"></div><input id="search" placeholder="Kod veya işletme ara"><div id="items"></div></section></main><script type="module">
import {client,currentUser} from './shared/supabase-client.js';
const $=id=>document.getElementById(id);let db,items=[],businesses=[];
const say=(s,bad=false)=>{$('msg').textContent=s;$('msg').className=bad?'error':''};
const el=(tag,txt)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;return x};
async function refresh(){const {data,error}=await db.rpc('ft_admin_stock_list');if(error)throw error;items=data||[];render()}
function render(){const q=$('search').value.toLocaleLowerCase('tr').trim();const filtered=items.filter(x=>(x.code+' '+(x.business_name||'')).toLocaleLowerCase('tr').includes(q));$('counts').textContent=items.length+' toplam • '+items.filter(x=>x.business_id).length+' atanmış • '+items.filter(x=>!x.business_id).length+' stokta';const host=$('items');host.replaceChildren();if(!filtered.length){host.append(el('p','Kayıt bulunamadı.'));return}
for(const item of filtered){const row=el('div');row.className='item';const code=el('strong',item.code),kind=el('span',item.product_type),state=el('span',item.business_id?'Atandı':'Stokta');state.className='tag';const sel=el('select');const empty=el('option','— Stokta / atanmamış —');empty.value='';sel.append(empty);for(const b of businesses){const opt=el('option',b.name+' · '+b.slug);opt.value=b.id;sel.append(opt)}sel.value=item.business_id||'';const btn=el('button','Atamayı Kaydet');btn.type='button';btn.onclick=async()=>{if(!confirm(item.code+' ürününün işletme ataması güncellensin mi?'))return;btn.disabled=true;const {error}=await db.rpc('ft_admin_stock_assign',{p_id:item.id,p_business_id:sel.value||null});if(error){say(error.message,true);btn.disabled=false;return}say('Atama kaydedildi.');await refresh()};row.append(code,kind,state,sel,btn);if(item.note)row.append(el('small',item.note));host.append(row)}}
$('search').addEventListener('input',render);
$('add').onsubmit=async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button');btn.disabled=true;const {error}=await db.rpc('ft_admin_stock_add',{p_code:$('code').value.trim().toUpperCase(),p_type:$('type').value,p_note:$('note').value});btn.disabled=false;if(error){say('Eklenemedi: '+error.message,true);return}e.currentTarget.reset();say('Ürün stoka eklendi.');await refresh()};
try{db=await client();let user;try{user=await currentUser(db)}catch(e){if(!/jwt|expired|refresh.token|invalid.claims/i.test(e.message||''))throw e;const refreshed=await db.auth.refreshSession();if(refreshed.error)throw Error('Oturum süresi doldu. Yönetici panelinden yeniden giriş yapın.');user=await currentUser(db)}if(!user)throw Error('Oturum süresi dolmuş olabilir. Yönetici panelinden yeniden giriş yapın.');const {data,error}=await db.rpc('ft_admin_list_businesses');if(error)throw error;businesses=data||[];try{await refresh()}catch(e){if(!/jwt|expired|invalid.claims/i.test(e.message||''))throw e;const refreshed=await db.auth.refreshSession();if(refreshed.error)throw Error('Oturum süresi doldu. Yönetici panelinden yeniden giriş yapın.');await refresh()}say('Stok yönetimi hazır.')}catch(e){say(e.message,true);if(/jwt|expired|oturum|giriş/i.test(e.message||'')){const a=el('a',' Yönetici girişine dön →');a.href='yonetim.html';$('msg').append(a)}}
</script></body></html>
