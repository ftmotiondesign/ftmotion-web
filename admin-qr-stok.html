<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR / NFC Stok | FTMotion</title><style>
*{box-sizing:border-box}body{background:#0b111d;color:#f1f5f9;font:15px system-ui;margin:0}main{max-width:1120px;margin:auto;padding:25px 16px}a{color:#5eead4}h1{font-size:28px}.panel{background:#132135;border:1px solid #34495d;border-radius:14px;padding:18px;margin:18px 0}input,select,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #536477}input,select{background:#0c1829;color:white;min-width:0}button{cursor:pointer;background:#ff8200;color:#141414;font-weight:700}button:disabled{opacity:.5}.fields{display:flex;flex-wrap:wrap;gap:9px;align-items:end}.fields label{display:grid;gap:6px;flex:1 1 160px}#msg{color:#8ef1d4;min-height:22px}.error{color:#ff9d9d!important}.item{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px solid #30485a;padding:14px 0}.item strong{min-width:110px}.item select{flex:1 1 220px}.muted{color:#aab9ca;font-size:13px}.tag{background:#344456;border-radius:20px;padding:4px 9px;font-size:12px}#search{width:100%;margin:10px 0}.stock-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}.stock-tab{background:#0c1829;color:#e2e8f0;border:1px solid #536477;padding:11px 15px}.stock-tab.active{background:#ff8200;color:#141414;border-color:#ff8200}.stock-tab .num{font-size:12px;opacity:.8;margin-left:5px}.qr-actions{display:flex;gap:7px;flex-wrap:wrap;width:100%}.qr-actions button{background:#243a52;color:#fff;border-color:#52667e;font-size:13px;padding:8px 11px}.qr-overlay{position:fixed;inset:0;z-index:9999;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px}.qr-dialog{background:#132135;color:white;border:1px solid #536477;border-radius:16px;padding:20px;max-width:420px;width:100%;text-align:center}.qr-dialog canvas{max-width:100%;height:auto;background:#fff;border:12px solid #fff;border-radius:8px}.qr-dialog p{overflow-wrap:anywhere}.qr-dialog .close{float:right;background:#243a52;color:white}.qr-dialog .dl{margin:5px}@media(max-width:550px){.stock-tab{flex:1 1 auto;padding:10px 8px;font-size:13px}}</style></head><body><main><a href="admin-isletmeler.html">← Merkezi Yönetime Dön</a><h1>QR / NFC Kart Stok ve Atama</h1><p class="muted">Önceden basılmış ürünleri benzersiz stok kodlarıyla takip edin. Atama, basılı QR bağlantısını otomatik değiştirmez.</p><div id="msg">Yönetici oturumu kontrol ediliyor...</div><section class="panel"><h2>Yeni stok kaydı</h2><form id="add" class="fields"><label>Stok kodu<input id="code" required maxlength="40" placeholder="QR-0027" pattern="[A-Za-z0-9-]{2,40}"></label><label>Ürün tipi<select id="type"><option>QR Kart</option><option>NFC Kart</option><option>NFC Etiket</option><option>Masaüstü</option></select></label><label>Not<input id="note" maxlength="500" placeholder="Baskı partisi / not"></label><button>Stoka Ekle</button></form></section><section class="panel"><h2>Stok Listesi</h2><div id="counts" class="muted"></div><div class="stock-tabs" role="group" aria-label="Stok kodu türüne göre filtre"><button type="button" class="stock-tab active" data-target="all" aria-pressed="true">Tümü <span class="num" id="count-all"></span></button><button type="button" class="stock-tab" data-target="digital_contact" aria-pressed="false">Dijital İletişim <span class="num" id="count-digital"></span></button><button type="button" class="stock-tab" data-target="google_review" aria-pressed="false">Google Yorum <span class="num" id="count-google"></span></button></div><input id="search" placeholder="Kod veya işletme ara"><div id="items"></div></section></main><script type="module">
import {client,currentUser} from './shared/supabase-client.js';
const $=id=>document.getElementById(id);let db,items=[],businesses=[],activeTarget='all';
const say=(s,bad=false)=>{$('msg').textContent=s;$('msg').className=bad?'error':''};
const el=(tag,txt)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;return x};

// QR içeriği değişmez: baskıdaki bağlantı /k/STOK-KODU adresidir.
const stockUrl=code=>new URL('/k/'+encodeURIComponent(code),location.origin).href;
const copyText=async value=>{try{await navigator.clipboard.writeText(value);say('QR bağlantısı kopyalandı.')}catch(e){say('Bağlantı kopyalanamadı: '+e.message,true)}};
let qrScriptPromise;
function loadQr(){if(window.qrcode)return Promise.resolve();if(!qrScriptPromise)qrScriptPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';script.onload=()=>typeof window.qrcode==='function'?resolve():reject(Error('QR kütüphanesi yüklenemedi.'));script.onerror=()=>reject(Error('QR kütüphanesine erişilemedi.'));document.head.append(script)}).catch(e=>{qrScriptPromise=null;throw e});return qrScriptPromise}
function qrMatrix(value){const qr=window.qrcode(0,'H');qr.addData(value);qr.make();return qr}
function qrSvg(qr){const n=qr.getModuleCount(),quiet=4,side=n+quiet*2;let rects='<rect width="'+side+'" height="'+side+'" fill="#fff"/>';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))rects+='<rect x="'+(x+quiet)+'" y="'+(y+quiet)+'" width="1" height="1" fill="#000"/>';return '<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 '+side+' '+side+'" shape-rendering="crispEdges">'+rects+'</svg>'}
function qrCanvas(qr){const n=qr.getModuleCount(),quiet=4,step=10,side=(n+2*quiet)*step,canvas=document.createElement('canvas');canvas.width=canvas.height=side;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,side,side);ctx.fillStyle='#000';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))ctx.fillRect((x+quiet)*step,(y+quiet)*step,step,step);return canvas}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function showQr(item){try{await loadQr();const url=stockUrl(item.code),qr=qrMatrix(url),overlay=el('div');overlay.className='qr-overlay';overlay.setAttribute('role','presentation');const dialog=el('div');dialog.className='qr-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label',item.code+' QR önizleme');const close=el('button','Kapat ×');close.type='button';close.className='close';const dismiss=()=>overlay.remove();close.onclick=dismiss;overlay.onclick=e=>{if(e.target===overlay)dismiss()};const onKey=e=>{if(e.key==='Escape'){dismiss();document.removeEventListener('keydown',onKey)}};document.addEventListener('keydown',onKey);dialog.append(close,el('h2',item.code+' QR Kodu'));const canvas=qrCanvas(qr);dialog.append(canvas,el('p',url));const png=el('button','PNG İndir');png.type='button';png.className='dl';png.onclick=()=>canvas.toBlob(blob=>blob?downloadBlob(blob,item.code+'.png'):say('PNG oluşturulamadı.',true),'image/png');const svg=el('button','SVG İndir');svg.type='button';svg.className='dl';svg.onclick=()=>downloadBlob(new Blob([qrSvg(qr)],{type:'image/svg+xml'}),item.code+'.svg');const copy=el('button','Linki Kopyala');copy.type='button';copy.className='dl';copy.onclick=()=>copyText(url);dialog.append(png,svg,copy);overlay.append(dialog);document.body.append(overlay);close.focus()}catch(e){say('QR kodu açılamadı: '+e.message,true)}}
async function refresh(){const {data,error}=await db.rpc('ft_admin_stock_list');if(error)throw error;items=data||[];const targets=await db.rpc('ft_admin_stock_targets');if(targets.error)throw targets.error;const targetById=new Map((targets.data||[]).map(x=>[String(x.id),x.target_type]));items.forEach(x=>x.target_type=targetById.get(String(x.id))||'digital_contact');render()}
function render(){const q=$('search').value.toLocaleLowerCase('tr').trim();const filtered=items.filter(x=>(activeTarget==='all'||x.target_type===activeTarget)&&(x.code+' '+(x.business_name||'')).toLocaleLowerCase('tr').includes(q));$('count-all').textContent='('+items.length+')';$('count-digital').textContent='('+items.filter(x=>x.target_type==='digital_contact').length+')';$('count-google').textContent='('+items.filter(x=>x.target_type==='google_review').length+')';const scoped=items.filter(x=>activeTarget==='all'||x.target_type===activeTarget);$('counts').textContent=scoped.length+' toplam • '+scoped.filter(x=>x.business_id).length+' atanmış • '+scoped.filter(x=>!x.business_id).length+' stokta';const host=$('items');host.replaceChildren();if(!filtered.length){host.append(el('p','Kayıt bulunamadı.'));return}
for(const item of filtered){const row=el('div');row.className='item';const code=el('strong',item.code),kind=el('span',item.target_type==='google_review'?'Google Yorum':'Dijital İletişim'),state=el('span',item.business_id?'Atandı':'Stokta');state.className='tag';const targetSelect=el('select');targetSelect.setAttribute('aria-label',item.code+' QR hedef türü');targetSelect.style.cssText='flex:0 1 175px';for(const [value,label] of [['google_review','Google Yorum'],['digital_contact','Dijital İletişim']]){const opt=el('option',label);opt.value=value;targetSelect.append(opt)}targetSelect.value=item.target_type;const saveTarget=el('button','Türü Kaydet');saveTarget.type='button';saveTarget.onclick=async()=>{const next=targetSelect.value;if(next===item.target_type){say('Hedef türü zaten seçili.');return}if(!confirm(item.code+' kodunun hedef türü '+(next==='google_review'?'Google Yorum':'Dijital İletişim')+' olarak değiştirilecek. Fiziksel kartın üzerinde basılı yazı veya tasarım bu türle uyuşmayabilir. Devam edilsin mi?')){targetSelect.value=item.target_type;return}saveTarget.disabled=true;const {error}=await db.rpc('ft_admin_stock_set_target',{p_id:item.id,p_target_type:next});if(error){say('Hedef türü kaydedilemedi: '+error.message,true);saveTarget.disabled=false;return}await refresh();say(item.code+' hedef türü güncellendi.')};const sel=el('select');const empty=el('option','— Stokta / atanmamış —');empty.value='';sel.append(empty);for(const b of businesses){const opt=el('option',b.name+' · '+b.slug);opt.value=b.id;sel.append(opt)}sel.value=item.business_id||'';const btn=el('button','Atamayı Kaydet');btn.type='button';btn.onclick=async()=>{if(!confirm(item.code+' ürününün işletme ataması güncellensin mi?'))return;btn.disabled=true;const {error}=await db.rpc('ft_admin_stock_assign',{p_id:item.id,p_business_id:sel.value||null});if(error){say(error.message,true);btn.disabled=false;return}say('Atama kaydedildi.');await refresh()};const del=el('button','Sil');del.type='button';del.style.cssText='background:#34232a;color:#ffb6b6;border:1px solid #81505c';del.disabled=!!item.business_id;del.title=item.business_id?'Önce işletme atamasını kaldırın.':'Stok kaydını sil';del.onclick=async()=>{if(!confirm(item.code+' stok kaydı kalıcı olarak silinsin mi? Bu işlem geri alınamaz.'))return;del.disabled=true;const {error}=await db.rpc('ft_admin_stock_delete',{p_id:item.id});if(error){say('Silinemedi: '+error.message,true);del.disabled=false;return}say(item.code+' stoktan silindi.');await refresh()};const sale=el('button','Aktivasyon Kodu Oluştur');sale.type='button';sale.disabled=!!item.business_id;sale.onclick=async()=>{if(!confirm(item.code+' için yeni bir aktivasyon kodu oluşturulsun mu? Önceki kod varsa geçersiz olacaktır.'))return;sale.disabled=true;const {data,error}=await db.rpc('ft_admin_stock_activation',{p_id:item.id});sale.disabled=false;if(error){say('Kod oluşturulamadı: '+error.message,true);return}const message='FTMotion kart aktivasyonu\\nKart: '+item.code+'\\nAktivasyon kodu: '+data+'\\nÜyelik: https://ftmotion.com/giris.html\\nAktivasyon: https://ftmotion.com/kartim.html';const panel=el('div');panel.style.cssText='padding:12px;border:1px solid #ff7900;border-radius:10px;margin:8px 0';panel.append(el('strong','Aktivasyon kodu (yalnızca şimdi gösterilir): '+data));const copy=el('button','Müşteriye Gönderilecek Metni Kopyala');copy.type='button';copy.onclick=async()=>{try{await navigator.clipboard.writeText(message);say('Aktivasyon bilgileri kopyalandı.')}catch(e){say('Kopyalanamadı: '+e.message,true)}};panel.append(copy);row.after(panel);say('Kod hazır. Kopyalayıp müşteriye iletin; tekrar görüntülenemez.')};const actions=el('div');actions.className='qr-actions';const view=el('button','QR Göster');view.type='button';view.onclick=()=>showQr(item);const copyLink=el('button','Linki Kopyala');copyLink.type='button';copyLink.onclick=()=>copyText(stockUrl(item.code));actions.append(view,copyLink);row.append(code,kind,state,targetSelect,saveTarget,sel,btn,del,sale,actions);if(item.note)row.append(el('small',item.note));host.append(row)}}
$('search').addEventListener('input',render);document.querySelectorAll('.stock-tab').forEach(button=>button.addEventListener('click',()=>{activeTarget=button.dataset.target;document.querySelectorAll('.stock-tab').forEach(tab=>{const selected=tab===button;tab.classList.toggle('active',selected);tab.setAttribute('aria-pressed',String(selected))});render()}));
$('add').onsubmit=async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button');btn.disabled=true;const {error}=await db.rpc('ft_admin_stock_add',{p_code:$('code').value.trim().toUpperCase(),p_type:$('type').value,p_note:$('note').value});btn.disabled=false;if(error){const duplicate=error.code==='23505'||/duplicate key|ft_qr_stock_code_key/i.test(error.message||'');say(duplicate?'Bu stok kodu zaten kayıtlı. Stok listesinden mevcut kartı bulun veya farklı bir kod girin.':'Eklenemedi: '+error.message,true);return}e.currentTarget.reset();$('search').value='';try{await refresh();say('Ürün stoka eklendi ve liste otomatik güncellendi.')}catch(err){say('Ürün eklendi ancak liste yenilenemedi: '+err.message,true)}};
try{db=await client();let user;try{user=await currentUser(db)}catch(e){if(!/jwt|expired|refresh.token|invalid.claims/i.test(e.message||''))throw e;const refreshed=await db.auth.refreshSession();if(refreshed.error)throw Error('Oturum süresi doldu. Yönetici panelinden yeniden giriş yapın.');user=await currentUser(db)}if(!user)throw Error('Oturum süresi dolmuş olabilir. Yönetici panelinden yeniden giriş yapın.');const {data,error}=await db.rpc('ft_admin_list_businesses');if(error)throw error;businesses=data||[];try{await refresh()}catch(e){if(!/jwt|expired|invalid.claims/i.test(e.message||''))throw e;const refreshed=await db.auth.refreshSession();if(refreshed.error)throw Error('Oturum süresi doldu. Yönetici panelinden yeniden giriş yapın.');await refresh()}say('Stok yönetimi hazır.')}catch(e){say(e.message,true);if(/jwt|expired|oturum|giriş/i.test(e.message||'')){const a=el('a',' Yönetici girişine dön →');a.href='yonetim.html';$('msg').append(a)}}
</script></body></html>
