<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sipariş | FTMotion</title><style>:root{--bg:#090e19;--panel:#152233;--line:#304257;--txt:#edf6ff;--accent:#58e0c4}*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);font:15px/1.65 system-ui;margin:0}header{padding:18px max(22px,calc((100vw - 1150px)/2));border-bottom:1px solid var(--line);background:#0e1825}a{color:var(--accent);text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:38px 22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:24px;margin:16px 0}.muted{color:#aabfd2}h1{font-size:clamp(30px,4vw,51px);line-height:1.13}h2{font-size:24px}button,.btn{background:var(--accent);color:#062527;border:0;border-radius:11px;padding:12px 20px;display:inline-block;font-weight:800;cursor:pointer;text-decoration:none}input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #435771;background:#0b1624;color:white;font:inherit;margin:5px 0 15px}label{display:block}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.media{width:100%;max-height:430px;object-fit:contain;border-radius:12px;background:#0a1420}.empty{min-height:210px;background:radial-gradient(circle,#234b56,#0d1b2a);border-radius:15px;display:grid;place-items:center;font-size:64px}.pill{color:var(--accent);font-weight:800;letter-spacing:1px;font-size:12px}.price{font-size:30px;font-weight:900}.small{font-size:12px}.line{border-top:1px solid #324658;padding:13px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}@media(max-width:740px){.cols{grid-template-columns:1fr}.wrap{padding:22px 16px}}</style></head><body><header><a href="index.html">← <b>FTMotion</b> · Ana sayfa</a></header><main class="wrap"><h1>Sipariş / Teklif Talebi</h1><p class="muted">Bu aşamada ödeme alınmaz; WhatsApp üzerinden teklif talebi hazırlanır.</p><form class="card" id="form"><label>İşletme / Ad Soyad<input id="name" required placeholder="İşletme adınız"></label><label>Telefon<input id="phone" required placeholder="05xx xxx xx xx"></label><label>İlgilendiğiniz hizmetler<textarea id="chosen" rows="3"></textarea></label><label>İl / İlçe<input id="city" placeholder="Örn. Çanakkale Merkez"></label><label>Ek açıklama<textarea id="note" rows="4"></textarea></label><button type="submit">WhatsApp Teklifi Hazırla →</button><p class="small muted" id="status"></p></form></main><script>let cfg;try{cfg=JSON.parse(localStorage.getItem('ftmotion_prices'))||{}}catch{cfg={}}const names={video:'Görselden Video',drone:'Sanal Drone',tour:'360 Mekan',qr:'QR NFC',menu:'Dijital Menü',web:'Web Sitesi'};chosen.value=(new URLSearchParams(location.search).get('hizmet')||'').split(',').map(s=>names[s]||s).filter(Boolean).join(', ')||'Genel teklif';form.onsubmit=e=>{e.preventDefault();const txt=`Merhaba, FTMotion teklif talebi
İşletme: ${document.getElementById("name").value}
Telefon: ${document.getElementById("phone").value}
Hizmetler: ${chosen.value}
Konum: ${document.getElementById("city").value}
Not: ${document.getElementById("note").value}`;const number=(cfg.phone||'').replace(/\D/g,'');if(!/^90\d{10}$/.test(number)){status.textContent='WhatsApp numarası henüz tanımlanmamış. Teklif metnini kopyalayın.';navigator.clipboard?.writeText(txt).catch(()=>{});alert(txt);return}window.open('https://wa.me/'+number+'?text='+encodeURIComponent(txt),'_blank','noopener')};</script></body></html>
