<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sipariş | FTMotion</title><style>:root{--bg:#090e19;--panel:#152233;--line:#304257;--txt:#edf6ff;--accent:#58e0c4}*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);font:15px/1.65 system-ui;margin:0}header{padding:18px max(22px,calc((100vw - 1150px)/2));border-bottom:1px solid var(--line);background:#0e1825}a{color:var(--accent);text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:38px 22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:24px;margin:16px 0}.muted{color:#aabfd2}h1{font-size:clamp(30px,4vw,51px);line-height:1.13}h2{font-size:24px}button,.btn{background:var(--accent);color:#062527;border:0;border-radius:11px;padding:12px 20px;display:inline-block;font-weight:800;cursor:pointer;text-decoration:none}input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #435771;background:#0b1624;color:white;font:inherit;margin:5px 0 15px}label{display:block}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.media{width:100%;max-height:430px;object-fit:contain;border-radius:12px;background:#0a1420}.empty{min-height:210px;background:radial-gradient(circle,#234b56,#0d1b2a);border-radius:15px;display:grid;place-items:center;font-size:64px}.pill{color:var(--accent);font-weight:800;letter-spacing:1px;font-size:12px}.price{font-size:30px;font-weight:900}.small{font-size:12px}.line{border-top:1px solid #324658;padding:13px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}@media(max-width:740px){.cols{grid-template-columns:1fr}.wrap{padding:22px 16px}}.serviceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 24px}.serviceChoice{display:flex;gap:12px;align-items:flex-start;border:1px solid #494949;background:#222;border-radius:13px;padding:15px;cursor:pointer}.serviceChoice:has(input:checked){border-color:#ff7900;background:#332218}.serviceChoice input{width:18px;height:18px;margin:4px 0;accent-color:#ff7900}.serviceChoice b{display:block}.serviceChoice small{display:block;color:#bcbcbc}.orderGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.serviceChoice input{flex:none}@media(max-width:650px){.serviceGrid,.orderGrid{grid-template-columns:1fr}}#copyRequest{margin-left:8px;background:#292929;color:white;border:1px solid #555}body.order-embed{background:#171717}body.order-embed header{display:none!important}body.order-embed main.wrap{max-width:none!important;padding:0!important;margin:0!important}body.order-embed h1{display:none}body.order-embed .card{margin:0;border:0;padding:15px 10px;background:#171717}body.order-embed .wrap>p{padding:0 10px}body.order-embed{margin-left:0!important;padding-left:0!important}@media(max-width:650px){body.order-embed .card{padding:10px 4px}}</style><link rel="stylesheet" href="shared/admin-sidebar.css"><link rel="stylesheet" href="/shared/ftmotion-turuncu.css?v=2"></head><body><script>if(new URLSearchParams(location.search).has("embed"))document.body.classList.add("order-embed")</script><header style="display:flex;align-items:center;justify-content:space-between"><a href="/"><img src="/ftmotion-logo.webp" alt="FT Motion" style="width:58px;height:52px;object-fit:contain"></a><a href="/kartim.html">← QR Kartım</a></header><main class="wrap"><h1>Sipariş / Teklif Talebi</h1><p class="muted">Üye hizmet siparişinizi seçin. Bu aşamada ödeme alınmaz; talebiniz WhatsApp için hazırlanır.</p><form class="card" id="form"><h2>Hizmet seçimi</h2><div class="serviceGrid"><label class="serviceChoice"><input type="checkbox" name="service" value="QR Kart"><span><b>▦ QR Kart</b><small>QR / NFC dijital veya baskılı kart</small></span></label><label class="serviceChoice"><input type="checkbox" name="service" value="Google Yorum Kartı"><span><b>★ Google Yorum Kartı</b><small>Masaüstü veya elden verilecek kart</small></span></label><label class="serviceChoice"><input type="checkbox" name="service" value="İşletme İletişim Bilgileri Kartı"><span><b>☎ İşletme İletişim Bilgileri</b><small>Telefon, WhatsApp, konum ve sosyal medya</small></span></label><label class="serviceChoice"><input type="checkbox" name="service" value="Web Sitesi"><span><b>🌐 Web Sitesi</b><small>Kurumsal web tasarımı</small></span></label><label class="serviceChoice"><input type="checkbox" name="service" value="Görselden Video"><span><b>▶ Görselden Video</b><small>Fotoğraflardan tanıtım videosu</small></span></label></div><h2>Sipariş bilgileri</h2><label>İşletme / Ad Soyad<input id="name" required placeholder="İşletme adınız"></label><label>Telefon<input id="phone" required placeholder="05xx xxx xx xx"></label><label>Seçilen hizmetler<textarea id="chosen" rows="2" placeholder="Hizmet seçin veya buraya istediğiniz hizmeti yazın"></textarea></label><div class="orderGrid"><label>Adet / miktar<input id="quantity" type="number" min="1" max="10000" value="1" required></label><label id="formatField">Kart türü / teslimat<select id="format" style="width:100%;padding:13px;background:#222;color:white;border:1px solid #555;border-radius:10px;margin:5px 0 15px"><option>Belirtilmedi</option><option>8 × 5 cm</option><option>10 × 10 cm masaüstü</option><option>Her ikisi</option><option>Dijital hizmet</option></select></label></div><label>İl / İlçe<input id="city" placeholder="Örn. Çanakkale Merkez"></label><label>Ek açıklama<textarea id="note" rows="4"></textarea></label><button type="submit">WhatsApp Teklifi Hazırla →</button><button id="copyRequest" type="button">Talebi Kopyala</button><p class="small muted" id="status"></p></form></main><script>
let cfg;try{cfg=JSON.parse(localStorage.getItem('ftmotion_prices'))||{}}catch{cfg={}}
const $=id=>document.getElementById(id);
const names={video:'Görselden Video',drone:'Sanal Drone',tour:'360 Mekan',qr:'QR Kart',menu:'Dijital Menü',web:'Web Sitesi'};
const selectedFromUrl=(new URLSearchParams(location.search).get('hizmet')||'').split(',').map(x=>names[x]||x).filter(Boolean);
document.querySelectorAll('[name="service"]').forEach(box=>{if(selectedFromUrl.includes(box.value))box.checked=true;box.addEventListener('change',refresh)});
let manualServices='';$('chosen').addEventListener('input',()=>{manualServices=$('chosen').value;const card=/kart/i.test(manualServices);$('formatField').hidden=!card;if(!card)$('format').value='Dijital hizmet'});function refresh(){const selected=[...document.querySelectorAll('[name="service"]:checked')].map(x=>x.value);const all=[...new Set([...selected,...selectedFromUrl.filter(x=>!document.querySelector('[name="service"][value="'+CSS.escape(x)+'"]'))])];$('chosen').value=[all.join(', '),manualServices].filter(Boolean).join(', ');const card=/kart/i.test($('chosen').value);$('formatField').hidden=!card;if(!card)$('format').value='Dijital hizmet'}
refresh();
function requestText(){return ['Merhaba, FT Motion sipariş / teklif talebi','İşletme: '+$('name').value.trim(),'Telefon: '+$('phone').value.trim(),'Hizmetler: '+$('chosen').value,'Adet: '+$('quantity').value,'Kart türü: '+$('format').value,'Konum: '+$('city').value.trim(),'Not: '+$('note').value.trim()].join('\n')}
$('form').onsubmit=async e=>{e.preventDefault();if(!$('chosen').value.trim()){$('status').textContent='Lütfen en az bir hizmet seçin.';return}const button=$('form').querySelector('[type=submit]');button.disabled=true;$('status').textContent='Talebiniz kaydediliyor...';const txt=requestText();let saved=false;try{const {client}=await import('./shared/supabase-client.js');const db=await client();const payload={request_type:'quote',customer_name:$('name').value.trim(),customer_phone:$('phone').value.trim(),service_details:$('chosen').value.trim(),message:txt,status:'new'};const {error}=await db.from('contact_requests').insert(payload);if(error)throw error;saved=true;$('status').textContent='Talebiniz yönetim paneline kaydedildi. WhatsApp açılıyor.'}catch(err){console.error('Talep kaydedilemedi:',err);$('status').textContent='Talep veritabanına kaydedilemedi. WhatsApp üzerinden yine de gönderebilirsiniz.'}finally{button.disabled=false}const number='905347815105';const url='https://wa.me/'+number+'?text='+encodeURIComponent(txt);const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='WhatsApp mesajını aç';link.style.cssText='display:inline-block;color:#ff9a35;margin-top:7px;font-weight:bold';$('status').append(document.createElement('br'),link);window.open(url,'_blank','noopener')};
$('copyRequest').onclick=async()=>{if(!$('chosen').value.trim()){$('status').textContent='Önce hizmet seçin.';return}try{await navigator.clipboard.writeText(requestText());$('status').textContent='Sipariş talebi kopyalandı.'}catch{$('status').textContent='Kopyalanamadı. Tarayıcı izinlerini kontrol edin.'}};
</script><script type="module">if(!new URLSearchParams(location.search).has('embed'))import('./shared/admin-sidebar.js');</script></body></html>
