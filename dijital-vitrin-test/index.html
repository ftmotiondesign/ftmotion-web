<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMotion Test İşletmesi | Dijital Vitrin Yönetimi</title><style>:root{font:15px/1.5 system-ui,-apple-system,sans-serif;color:#25262a;background:#f5f5f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:18px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:900}.brand em{color:#ed7518;font-style:normal}.pill{background:#fff0df;color:#99500d;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}.panel{background:white;border:1px solid #e6e7ea;border-radius:18px;padding:20px;margin-top:18px}h1{font-size:25px;margin:0}h2{font-size:20px;margin:4px 0 12px}p{color:#68717d}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:thin}.tabs button{flex-shrink:0}button,.link{border:1px solid #dddfe5;border-radius:10px;background:#fff;color:#333;padding:10px 13px;font:inherit;cursor:pointer;text-decoration:none}button.active,.primary{background:#ed7518!important;border-color:#ed7518!important;color:white!important}input,textarea,select{display:block;width:100%;border:1px solid #d5d9df;border-radius:9px;padding:11px;font:inherit;margin:5px 0 13px;background:white}textarea{min-height:78px}label{display:block;font-weight:650}small,.muted{color:#68717d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{border:1px solid #e5e6e9;border-radius:12px;padding:14px}.item img{width:100%;height:130px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.notice{padding:14px;background:#fff5e8;color:#765016;border-radius:12px;margin-top:16px}.preview{background:#fcf5ec;border-radius:15px;padding:20px;margin-top:12px}.preview h2{font-family:Georgia,serif;font-size:28px}.preview .item{background:white}.hide{display:none!important}@media(max-width:620px){.grid{grid-template-columns:1fr}.panel{padding:15px}}</style></head><body><div class="wrap"><div class="header"><div class="brand">FT<em>Motion</em></div><span class="pill">TEST İŞLETMESİ</span></div><section class="panel"><h1>Dijital Vitrin Yönetimi</h1><p>Pastane Tanıtım V16 bölümlerine göre düzenlenmiş test paneli.</p><div class="tabs" id="tabs"></div><div id="editor"></div><div class="actions"><button class="primary" id="save">Değişiklikleri Kaydet</button><button id="showPreview">Müşteri Önizlemesi</button><button id="reset">Test Verilerini Sıfırla</button></div><div id="preview" class="preview hide"></div><div class="notice">Bu testte bilgiler yalnızca bu tarayıcıda saklanır. Gerçek işletme verileri, DNS, QR yönlendirmeleri ve canlı Kartım panelindeki kayıtlar değiştirilmez.</div></section></div><script>(()=>{'use strict';const KEY='ftmotion-vitrin-v16-management-test',sections=[['home','Ana Sayfa'],['products','Ürünler'],['orders','Özel Sipariş'],['catalog','Menü Katalog'],['offers','Fırsatlar'],['contact','İletişim'],['categories','Kategori Resimleri'],['domain','Alan Adı Testi']];const defaults={home:{business:'FTMotion Test İşletmesi',headline:'Lezzetin en güzel hali',subtitle:'Butik pastane • Günlük taze üretim',hero:'',welcome:'Pastalar, tatlılar ve taze lezzetler'},products:[{id:'p1',name:'Çikolatalı Pasta',category:'Pastalar',price:'450',description:'Özel günler için',photo:''},{id:'p2',name:'Sütlaç',category:'Tatlılar',price:'120',description:'Günlük hazırlanır',photo:''}],orders:{title:'Özel Pasta Talebi',description:'Doğum günü, nişan ve özel gün pastalarınız için bize ulaşın.',whatsapp:'',active:'yes'},catalog:{title:'Etkileşimli Menü Rehberi',description:'Kategorilerimizi keşfedin',cover:'',active:'yes'},offers:[{id:'o1',title:'Günün Vitrini',description:'Güncel fırsatlarımız',image:'',active:'yes'}],contact:{phone:'',whatsapp:'',address:'',map:'',instagram:'',hours:''},categories:[{id:'c1',name:'Pastalar',image:''},{id:'c2',name:'Tatlılar',image:''},{id:'c3',name:'Unlu Mamuller',image:''}],domain:{hostname:'',mode:'both'}};let data;try{data=JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(defaults));for(const k of Object.keys(defaults))if(data[k]===undefined)data[k]=JSON.parse(JSON.stringify(defaults[k]))}catch{data=JSON.parse(JSON.stringify(defaults))}let tab=new URLSearchParams(location.search).get('tab')==='domain'?'domain':'home',editing=null;const $=id=>document.getElementById(id),el=(tag,text)=>{let x=document.createElement(tag);if(text!==undefined)x.textContent=String(text);return x},fields={home:[['business','İşletme Adı'],['headline','Ana Başlık'],['subtitle','Üst Açıklama'],['hero','Ana Sayfa Kapak Görseli (HTTPS URL)'],['welcome','Karşılama Yazısı']],orders:[['title','Form Başlığı'],['description','Açıklama'],['whatsapp','Talep WhatsApp Numarası'],['active','Talep Formu Aktif mi?']],catalog:[['title','Katalog Başlığı'],['description','Katalog Açıklaması'],['cover','Katalog Kapak Görseli (HTTPS URL)'],['active','Katalog Aktif mi?']],contact:[['phone','Telefon'],['whatsapp','WhatsApp'],['address','Adres'],['map','Harita Bağlantısı'],['instagram','Instagram Bağlantısı'],['hours','Çalışma Saatleri']],domain:[['hostname','Özel Alan Adı (örnek: ornek.com)'],['mode','Açılacak Sayfa: card / showcase / both']]},itemFields={products:[['name','Ürün Adı'],['category','Kategori'],['price','Fiyat (TL)'],['description','Açıklama'],['photo','Ürün Fotoğrafı (HTTPS URL)']],offers:[['title','Fırsat Başlığı'],['description','Fırsat Açıklaması'],['image','Fırsat Görseli (HTTPS URL)'],['active','Aktif mi? (yes / no)']],categories:[['name','Kategori Adı'],['image','Kategori Resmi (HTTPS URL)']]};function safeUrl(s){return /^https:\/\//i.test(s||'')?s:''}function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{alert('Tarayıcı kaydetmeye izin vermedi.');return false}}function input(parent,key,label,value){const lab=el('label',label),inp=el(key==='description'||key==='welcome'?'textarea':'input');inp.id='f_'+key;inp.value=value??'';lab.append(inp);parent.append(lab)}function nav(){const box=$('tabs');box.replaceChildren();for(const [key,name]of sections){const b=el('button',name);b.className=key===tab?'active':'';b.onclick=()=>{tab=key;editing=null;$('preview').classList.add('hide');render()};box.append(b)}}function render(){nav();const ed=$('editor');ed.replaceChildren();ed.append(el('h2',sections.find(x=>x[0]===tab)[1]));if(fields[tab]){for(const [k,label]of fields[tab])input(ed,k,label,data[tab][k]);if(tab==='domain'){ed.append(el('p','DNS / SSL doğrulaması henüz bağlı değil. Bu alan sadece yönlendirme senaryosu içindir.'));const p=el('p','Örnek mevcut QR adresi: ftmotion.com/qr/ftmotion-test-isletmesi');ed.append(p)}}else{const list=data[tab];const box=el('div');box.className='grid';for(const it of list){const card=el('div');card.className='item';const url=safeUrl(it.photo||it.image);if(url){const img=el('img');img.src=url;img.alt=it.name||it.title;card.append(img)}card.append(el('strong',it.name||it.title),el('p',it.category||it.description||''));const a=el('div');a.className='actions';const edit=el('button','Düzenle');edit.onclick=()=>{editing=it.id;render();$('entry').scrollIntoView({behavior:'smooth'})};const del=el('button','Sil');del.onclick=()=>{if(confirm('Bu kayıt silinsin mi?')){data[tab]=data[tab].filter(x=>x.id!==it.id);persist();render()}};a.append(edit,del);card.append(a);box.append(card)}ed.append(box);const form=el('div');form.id='entry';form.className='panel';form.append(el('h2',editing?'Kaydı Düzenle':'Yeni Kayıt Ekle'));const existing=list.find(x=>x.id===editing)||{};for(const [k,label]of itemFields[tab])input(form,k,label,existing[k]);const add=el('button',editing?'Güncelle':'Listeye Ekle');add.className='primary';add.onclick=()=>{const obj={id:editing||('item'+Date.now())};for(const [k]of itemFields[tab])obj[k]=$('f_'+k).value.trim();if(!obj.name&&!obj.title){alert('Ad veya başlık gerekli.');return}const ix=list.findIndex(x=>x.id===obj.id);if(ix<0)list.push(obj);else list[ix]=obj;editing=null;persist();render()};form.append(add);ed.append(form)}}function save(){if(fields[tab]){for(const [k]of fields[tab])data[tab][k]=$('f_'+k).value.trim();persist()}else persist();alert('Test verileri bu tarayıcıda kaydedildi.')}function preview(){const box=$('preview');box.classList.remove('hide');box.replaceChildren();box.append(el('h2',data.home.business),el('h3',data.home.headline),el('p',data.home.welcome));const grid=el('div');grid.className='grid';if(data.home.hero&&safeUrl(data.home.hero)){const im=el('img');im.src=data.home.hero;im.style.maxWidth='100%';box.append(im)}for(const p of data.products){const card=el('div');card.className='item';if(safeUrl(p.photo)){const im=el('img');im.src=p.photo;im.style.width='100%';card.append(im)}card.append(el('strong',p.name),el('p',p.description),el('small',p.price?p.price+' TL':''));grid.append(card)}box.append(grid);box.append(el('h3',data.orders.title),el('p',data.orders.description),el('h3',data.catalog.title),el('p',data.catalog.description));for(const o of data.offers)if(o.active!=='no')box.append(el('h3',o.title),el('p',o.description));box.append(el('h3','İletişim'),el('p',data.contact.phone+' '+data.contact.address));box.scrollIntoView({behavior:'smooth'})}$('save').onclick=save;$('showPreview').onclick=()=>{if(fields[tab])for(const[k]of fields[tab])data[tab][k]=$('f_'+k).value.trim();persist();preview()};$('reset').onclick=()=>{if(confirm('Bu cihazdaki tüm test verileri silinsin mi?')){data=JSON.parse(JSON.stringify(defaults));editing=null;persist();render()}};render()})();</script></body></html>
