<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastane V16 • Yönetim</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#2c251e;background:#f7f4ef}*{box-sizing:border-box}body{margin:0;padding-bottom:80px}header{position:sticky;top:0;z-index:5;background:#fffaf3;border-bottom:1px solid #e4d6c6;padding:12px 16px;box-shadow:0 3px 12px #0001}header strong{font-size:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top a,.top button,.btn{border:1px solid #d7c7b7;border-radius:10px;background:white;color:#33251a;padding:10px 12px;text-decoration:none;font-weight:650;cursor:pointer}.primary{background:#a66c3d!important;color:white!important;border-color:#a66c3d!important}.tabs{display:flex;overflow:auto;gap:7px;padding-top:12px}.tabs button{border:1px solid #e1d6c9;background:white;border-radius:10px;padding:10px 12px;white-space:nowrap;font-weight:650}.tabs button.active{background:#493327;color:white}main{max-width:850px;margin:16px auto;padding:0 13px}.panel{background:white;border:1px solid #e7ddd2;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px #00000008}h1{font-size:23px;margin:0 0 6px}h2{font-size:19px;margin:0 0 12px}p{color:#75685d;line-height:1.5}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-weight:650;font-size:13px;margin:8px 0}input,textarea,select{display:block;width:100%;border:1px solid #d8cbbf;border-radius:10px;background:#fff;padding:12px;font:inherit;margin-top:6px}textarea{min-height:78px;resize:vertical}.check{display:flex;gap:10px;align-items:center}.check input{width:20px;height:20px;margin:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{border:1px solid #e9dfd4;border-radius:13px;padding:12px;margin:10px 0}.thumb{height:86px;width:120px;object-fit:cover;border-radius:10px;background:#eee;display:block;margin:6px 0}.muted{font-size:12px;color:#766c61}.status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#30241d;color:white;border-radius:11px;padding:11px 18px;display:none;z-index:20;max-width:90vw}.danger{color:#a22}.notice{background:#fff4df;padding:12px;border-radius:10px;font-size:13px}section[hidden]{display:none!important}@media(max-width:540px){.fields{grid-template-columns:1fr}.panel{padding:14px}}
 .product-head{justify-content:space-between;gap:10px}.product-expand{border:0;background:transparent;padding:8px 0;display:flex;gap:9px;align-items:center;text-align:left;flex:1;min-width:0;cursor:pointer;font-size:15px}.product-expand strong{overflow-wrap:anywhere}.product-expand[aria-expanded=true] .arrow{transform:rotate(90deg)}.arrow{transition:transform .15s}.featured-head{margin:0;white-space:nowrap;background:#fff5e8;padding:8px;border-radius:10px}.product-details[hidden]{display:none!important}.product-details{border-top:1px solid #eee2d6;margin-top:12px;padding-top:12px} </style></head><body>
<header><div class="top"><strong>🍰 Pastane V16 · Yönetim</strong><div class="row"><a href="./">← Vitrin Yönetimi</a><a class="primary btn" href="./pastane-v16.html?view=customer" target="_blank" rel="noopener">👁 Müşteri Görünümü</a></div></div><nav class="tabs" id="tabs"></nav></header>
<main><div class="panel"><h1 id="heading">Ana Sayfa</h1><p id="intro"></p><div class="notice">Test sürümü: Değişiklikler yalnızca bu tarayıcıda saklanır. Görseller sıkıştırılarak kaydedilir. Video dosyaları için küçük dosya kullanın; kalıcı çok cihazlı yayın için sunucu depolaması gereklidir.</div></div><div id="content"></div></main><div class="status" id="status" role="status"></div>
<script>
const SKEY='ftmotion-vitrin-v16-management-test',PKEY='ftmotion-pastane-v16-data';
const defs=[['home','Ana Sayfa','Kapak görselleri ve karşılama alanı'],['categories','Kategoriler','Kategori ekle, görsel değiştir, düzenle ve sil'],['products','Ürünlerimiz','Ürün ekleme, düzenleme ve vitrine çıkarma'],['catalog','Menü Rehberi','Ürün detayları, fiyatlar ve menü ayarları'],['offers','Fırsatlar','Görsel veya video içeren kampanyalar'],['contact','İletişim','Telefon, adres ve çalışma saatleri']];
const get=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch{return {}}};let settings=get(SKEY),data=get(PKEY),products=Array.isArray(data.products)&&data.products.length?data.products:[{name:'Çikolatalı Pasta',cat:'Pasta',img:'photo-1578985545062-69928b1d9587',desc:'Kutlamalar için butik pasta',ingredients:'Kakao, süt kreması, un, yumurta'},{name:'Çilekli Tatlı',cat:'Tatlı',img:'photo-1488477181946-6428a0291777',desc:'Hafif ve meyveli lezzet',ingredients:'Çilek, süt kreması, un'},{name:'Ev Yapımı Kurabiye',cat:'Kurabiye',img:'photo-1499636136210-6f4ee915583e',desc:'Çayın yanına nefis eşlikçi',ingredients:'Un, tereyağı, şeker'},{name:'Taze Kruvasan',cat:'Fırın',img:'photo-1509440159596-0249088772ff',desc:'Günlük fırın ürünleri',ingredients:'Un, tereyağı, süt'},{name:'Özel Gün Pastası',cat:'Pasta',img:'photo-1535141192574-5d4897c12636',desc:'İsteğinize özel tasarım',ingredients:'İçerik tercihe göre değişir'}],tab='home',selected=-1;
let categories=Array.isArray(settings.productCategories)&&settings.productCategories.length?settings.productCategories:['Pasta','Tatlı','Kurabiye','Fırın'];products.forEach(p=>{if(p.cat&&!categories.includes(p.cat))categories.push(p.cat)});
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const el=$('status');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2700)};
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(settings));localStorage.setItem(PKEY,JSON.stringify({...data,products}));toast('Kaydedildi. Müşteri görünümünü yenileyin.');return true}catch(e){toast('Depolama dolu. Daha küçük görsel veya video kullanın.');return false}}
function field(name,label,value='',kind='text'){return '<label>'+esc(label)+(kind==='textarea'?'<textarea data-field="'+esc(name)+'">'+esc(value)+'</textarea>':'<input data-field="'+esc(name)+'" type="'+kind+'" value="'+esc(value)+'">')+'</label>'}
function checkbox(name,label,checked){return '<label class="check"><input data-field="'+esc(name)+'" type="checkbox" '+(checked?'checked':'')+'>'+esc(label)+'</label>'}
function fileField(name,label){return '<label>'+esc(label)+'<input type="file" data-upload="'+esc(name)+'" accept="image/*"></label><img class="thumb" data-preview="'+esc(name)+'" hidden alt="Önizleme">'}
function fields(el){const obj={};el.querySelectorAll('[data-field]').forEach(x=>obj[x.dataset.field]=x.type==='checkbox'?x.checked:x.value.trim());return obj}
function btn(text,action,cls=''){return '<button class="btn '+cls+'" type="button" data-action="'+action+'">'+text+'</button>'}
async function upload(input){const name=input.dataset.upload;const file=input.files?.[0];if(!file)return;if(file.type.startsWith('video/')){if(file.size>1.5*1024*1024){toast('Video 1,5 MB altında olmalı. Büyük videolar için URL kullanın.');input.value='';return}const url=await readData(file);const f=input.closest('.item,.panel');const target=f.querySelector('[data-field="'+name+'"]');if(target)target.value=url;toast('Video seçildi; Kaydet ile saklayın.');return}if(!file.type.startsWith('image/'))return;const url=await resizeImage(file);const f=input.closest('.item,.panel');const target=f.querySelector('[data-field="'+name+'"]');if(target)target.value=url;const img=f.querySelector('[data-preview="'+name+'"]');if(img){img.src=url;img.hidden=false}toast('Görsel hazır. Kaydet butonuna basın.')}
function readData(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)})}
function resizeImage(file){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1100/img.width,1100/img.height);const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.7))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Görsel açılamadı'))};img.src=url})}
function render(){const def=defs.find(x=>x[0]===tab);$('heading').textContent=def[1];$('intro').textContent=def[2];$('tabs').innerHTML=defs.map(d=>'<button class="'+(tab===d[0]?'active':'')+'" data-tab="'+d[0]+'">'+d[1]+'</button>').join('');let html='';
if(tab==='home'){const d=settings.home||{};html='<div class="panel"><h2>İşletme ve Kapak</h2>'+field('business','İşletme adı',d.business||'Maison Pâtisserie')+field('subtitle','Alt başlık',d.subtitle||'BUTİK PASTANE · DEMO')+field('welcome','Karşılama açıklaması',d.welcome||'')+'<div class="fields">'+[1,2,3].map(i=>'<div class="item"><strong>Slider '+i+'</strong>'+field(i===1?'hero':'hero'+i,'Görsel URL',d[i===1?'hero':'hero'+i]||'')+fileField(i===1?'hero':'hero'+i,'📁 Dosya Seç')+'</div>').join('')+'</div>'+btn('Ana Sayfayı Kaydet','save-home','primary')+'</div>'}
if(tab==='categories'){html='<div class="panel"><div class="row"><h2>Kategori Yönetimi</h2>'+btn('+ Yeni Kategori Ekle','new-category','primary')+'</div><p>Kategori ekleyip ürün bağladığınızda menü rehberinde otomatik sayfası oluşur.</p></div>'+categoryRows()}
if(tab==='products'||tab==='catalog'){html='<div class="panel"><div class="row"><h2>'+ (tab==='catalog'?'Menü Ürünleri ve Fiyatlar':'Ürün Listesi')+'</h2>'+btn('+ Kategori Ekle','new-category')+btn('+ Yeni Ürün','new-product','primary')+'</div><p>Ürünlerdeki <b>Ana Vitrinde Göster</b> seçeneği işaretli olanlar ana sayfadaki “Vitrinden Seçtiklerimiz” alanına eklenir.</p><input id="search" placeholder="Ürün ara…" type="search"></div><div id="productList">'+products.map((p,i)=>productRow(p,i)).join('')+'</div>'}
if(tab==='offers'){const offers=settings.offers||[];html='<div class="panel"><div class="row"><h2>Fırsatlar ve Kampanyalar</h2>'+btn('+ Kampanya Ekle','new-offer','primary')+'</div><p>Her kampanyaya görsel veya video ekleyebilirsiniz.</p></div>'+offers.map((p,i)=>offerRow(p,i)).join('')}
if(tab==='contact'){const d=settings.contact||{};html='<div class="panel"><h2>İletişim Bilgileri</h2>'+['phone|Telefon','whatsapp|WhatsApp','address|Adres','map|Harita bağlantısı','instagram|Instagram bağlantısı','hours|Çalışma saatleri'].map(v=>{const [k,l]=v.split('|');return field(k,l,d[k]||'')}).join('')+btn('İletişimi Kaydet','save-contact','primary')+'</div>'}
$('content').innerHTML=html;document.querySelectorAll('[data-preview]').forEach(img=>{const input=img.closest('.item,.panel')?.querySelector('[data-field="'+img.dataset.preview+'"]');if(input&&input.value.startsWith('data:image/')){img.src=input.value;img.hidden=false}})}
function categoryRows(){return '<div class="panel"><h2>Kategoriler</h2><p>Kategori adı ve görselini düzenleyin. Kategori silinirse ürünleri silinmez; kategori atamalarını güncelleyin.</p>'+categories.map((name,i)=>'<div class="item" data-category="'+i+'">'+field('name','Kategori adı',name)+field('image','Kategori görsel URL',(settings.categoryImages||{})[name]||'')+fileField('image','📁 Kategori Görseli Seç')+'<div class="row">'+btn('Kategoriyi Kaydet','save-category','primary')+btn('Kategoriyi Sil','delete-category','danger')+'</div></div>').join('')+'</div>'}
function productRow(p,i){const options=categories.map(c=>'<option value="'+esc(c)+'" '+(c===p.cat?'selected':'')+'>'+esc(c)+'</option>').join('');return '<div class="panel item" data-product="'+i+'"><div class="row product-head"><button type="button" class="product-expand" data-action="toggle-product" aria-expanded="false"><span class="arrow">▸</span> <strong>'+esc(p.name||'Yeni ürün')+'</strong></button><label class="check featured-head"><input type="checkbox" data-featured-quick="'+i+'" '+(p.featured===true?'checked':'')+'> ⭐ Vitrin</label></div><div class="product-details" hidden><div class="row" style="justify-content:flex-end">'+btn('Sil','delete-product','danger')+'</div><div class="fields">'+field('name','Ürün adı',p.name||'')+'<label>Kategori<select data-field="cat">'+options+'</select></label>'+field('price','Fiyat',p.price||'')+field('portion','Porsiyon / Ölçü',p.portion||'')+'</div>'+field('desc','Kısa açıklama',p.desc||'','textarea')+field('ingredients','İçindekiler',p.ingredients||'','textarea')+field('allergens','Alerjenler',p.allergens||'')+field('photoUrl','Ürün görsel URL',p.photoUrl||'')+fileField('photoUrl','📁 Ürün Görseli Seç')+field('gallery','Ek görsel URL’leri (satır satır)',(p.gallery||[]).join('\\n'),'textarea')+checkbox('available','Ürün müşterilere görünsün',p.available!==false)+btn('Ürünü Kaydet','save-product','primary')+'</div></div>'}
function offerRow(p,i){return '<div class="panel item" data-offer="'+i+'"><div class="row"><strong>Kampanya '+(i+1)+'</strong>'+btn('Sil','delete-offer','danger')+'</div>'+field('title','Kampanya başlığı',p.title||'')+field('description','Açıklama',p.description||'','textarea')+field('image','Görsel URL',p.image||'')+fileField('image','📁 Kampanya Görseli Seç')+field('video','Video URL (https veya küçük dosya)',p.video||'')+'<label>📁 Video Dosyası Seç<input type="file" data-upload="video" accept="video/*"></label>'+checkbox('active','Kampanya yayında',p.active!=='no')+btn('Kampanyayı Kaydet','save-offer','primary')+'</div>'}
function handle(action,box){if(action==='save-home'){settings.home={...(settings.home||{}),...fields(box)};persist()}if(action==='save-contact'){settings.contact={...(settings.contact||{}),...fields(box)};persist()}if(action==='save-category'||action==='delete-category'){const i=Number(box.dataset.category),old=categories[i];if(action==='delete-category'){if(products.some(p=>p.cat===old)){toast('Bu kategoriye bağlı ürünler var. Önce ürünlerin kategorisini değiştirin.');return}if(!confirm('Kategori silinsin mi?'))return;categories.splice(i,1);if(settings.categoryImages)delete settings.categoryImages[old]}else{const d=fields(box),name=d.name.trim();if(!name){toast('Kategori adı boş olamaz');return}if(categories.some((v,j)=>j!==i&&v.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'))){toast('Kategori zaten var');return}categories[i]=name;products.forEach(p=>{if(p.cat===old)p.cat=name});settings.categoryImages=settings.categoryImages||{};if(old!==name)delete settings.categoryImages[old];settings.categoryImages[name]=d.image}settings.productCategories=categories;persist();render();return}if(action==='new-category'){const name=prompt('Yeni kategori adı:');if(name===null)return;const clean=name.trim();if(!clean){toast('Kategori adı boş olamaz');return}if(categories.some(c=>c.toLocaleLowerCase('tr')===clean.toLocaleLowerCase('tr'))){toast('Bu kategori zaten var');return}categories.push(clean);settings.productCategories=categories;persist();render();toast('Kategori eklendi');return}if(action==='toggle-product'){const details=box.querySelector('.product-details');const trigger=box.querySelector('.product-expand');details.hidden=!details.hidden;trigger.setAttribute('aria-expanded',String(!details.hidden));return}if(action==='new-product'){products.unshift({name:'Yeni Ürün',cat:categories[0]||'Pasta',available:false,featured:false});persist();render();const first=document.querySelector('[data-product]');if(first){first.querySelector('.product-details').hidden=false;first.querySelector('.product-expand').setAttribute('aria-expanded','true');first.scrollIntoView({behavior:'smooth',block:'center'})}}if(action==='new-offer'){settings.offers=settings.offers||[];settings.offers.unshift({title:'Yeni Kampanya',active:'no'});persist();render()}if(action==='save-product'||action==='delete-product'){const i=Number(box.dataset.product);if(action==='delete-product'){if(!confirm('Ürün silinsin mi?'))return;products.splice(i,1)}else{const d=fields(box);products[i]={...products[i],...d,gallery:d.gallery.split('\n').map(v=>v.trim()).filter(Boolean)}}persist();render()}if(action==='save-offer'||action==='delete-offer'){const i=Number(box.dataset.offer);if(action==='delete-offer'){if(!confirm('Kampanya silinsin mi?'))return;settings.offers.splice(i,1)}else{const d=fields(box);settings.offers[i]={...settings.offers[i],...d,active:d.active?'yes':'no'}}persist();render()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}const b=e.target.closest('[data-action]');if(b)handle(b.dataset.action,b.closest('[data-product],[data-offer],.panel'))});
document.addEventListener('change',e=>{if(e.target.matches('[data-featured-quick]')){const i=Number(e.target.dataset.featuredQuick);if(products[i]){products[i].featured=e.target.checked;persist()}return}if(e.target.matches('[data-upload]'))upload(e.target).catch(()=>toast('Dosya okunamadı'))});
document.addEventListener('input',e=>{if(e.target.id==='search'){const q=e.target.value.toLocaleLowerCase('tr');document.querySelectorAll('[data-product]').forEach(el=>el.hidden=!el.textContent.toLocaleLowerCase('tr').includes(q))}});
render();
</script></body></html>
