<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usta Hakediş | FTMotion</title><style>*{box-sizing:border-box}body{margin:0;background:#0c111a;color:white;font:15px system-ui}main{max-width:520px;margin:25px auto;padding:18px}section{background:#1c2734;border:1px solid #3d4d61;border-radius:17px;padding:22px}input,textarea{display:block;width:100%;margin:8px 0 16px;padding:12px;background:#101b28;border:1px solid #53677c;border-radius:8px;color:white;font:inherit}button{background:#ff8c2e;border:0;border-radius:9px;padding:12px 18px;font-weight:800}.muted{color:#bdcad8}</style><main><h1>Usta Hakediş</h1><section><p id="state">Yetki kontrol ediliyor...</p><form id="form" hidden><label>Yapılan İş<input name="job" minlength="3" maxlength="500" required></label><label>Hakediş (TL)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Açıklama<textarea name="notes" maxlength="1500"></textarea></label><button id="send">Hakedişi Gönder</button></form></section><p class="muted">Bu ekran herkese açık işletme kartında listelenmez. Erişim, yetkili usta hesabı gerektirir.</p></main><script type="module">import {client,currentUser} from '../shared/supabase-client.js';const bid='5cb58978-f52a-4bb4-b942-832f19a2a083',state=document.getElementById('state'),form=document.getElementById('form');try{const db=await client(),user=await currentUser(db);if(!user){state.textContent='Devam etmek için yetkili usta hesabınızla giriş yapın.'}else{const [{data:membership,error:me},{data:module,error:mo}]=await Promise.all([db.from('ft_worker_memberships').select('active').eq('business_id',bid).eq('worker_id',user.id).maybeSingle(),db.from('ft_work_modules').select('enabled').eq('business_id',bid).eq('module_key','worker_claim').maybeSingle()]);if(me||mo)throw me||mo;if(!membership?.active||!module?.enabled){state.textContent='Bu hesap için hakediş yetkisi henüz aktif değil.'}else{state.textContent='Yetkili usta hesabı doğrulandı.';form.hidden=false;form.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('send');btn.disabled=true;const v=Object.fromEntries(new FormData(form));const {error}=await db.from('ft_work_claims').insert({business_id:bid,worker_id:user.id,job_description:v.job,amount_try:Number(v.amount),notes:v.notes||null});if(error){state.textContent='Gönderilemedi: '+error.message;btn.disabled=false}else{form.reset();btn.disabled=false;state.textContent='Hakediş işletme yönetimine gönderildi.'}}}}}catch(e){state.textContent='İşlem başarısız: '+e.message}</script></html>
