<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İş Yönetimi | FTMotion</title><style>*{box-sizing:border-box}body{background:#0d1017;color:#f4f6fa;margin:0;font:15px/1.5 system-ui}main{max-width:850px;margin:auto;padding:22px 15px}section{background:#1b2431;border:1px solid #364455;border-radius:16px;padding:18px;margin:16px 0}h1{font-size:25px}h2{font-size:19px}button{padding:9px 13px;border:0;border-radius:9px;background:#ff8b32;font-weight:700;cursor:pointer}button:disabled{opacity:.45}select{background:#111a27;color:white;padding:9px;border-radius:8px;border:1px solid #5b6a7e}.item{padding:14px 0;border-bottom:1px solid #3b495a}.muted{color:#bac7d5}a{color:#ffc18a}small{display:block;color:#b8c4d3}#error{color:#ffb6a5}</style><main><a href="/qr-yonetimi.html">← İşletme Yönetimine Dön</a><h1>İş Yönetimi</h1><p class="muted">Başol Yapı pilotu · Bu sayfa yalnızca işletmenin oturum açmış yetkili yöneticisine veri gösterir.</p><p id="state">Oturum kontrol ediliyor...</p><p id="error" role="alert"></p><div id="workspace" hidden><section><h2>Müşteri Talepleri</h2><div id="requests"></div></section><section><h2>Usta Hakedişleri</h2><div id="claims"></div></section><button id="reload">Yenile</button></div></main><script type="module">
import {client,currentUser} from '../shared/supabase-client.js';
const $=id=>document.getElementById(id), db=client, businessId='5cb58978-f52a-4bb4-b942-832f19a2a083';
const reqStates={new:'Yeni',in_progress:'İşlemde',completed:'Tamamlandı',cancelled:'İptal'},claimStates={pending:'Bekliyor',approved:'Onaylandı',paid:'Ödendi',rejected:'Reddedildi'};
function text(tag,value,parent){const e=document.createElement(tag);e.textContent=value??'';parent.append(e);return e}
function fail(message){$('error').textContent=message}
async function load(){fail('');const user=await currentUser();if(!user){$('state').textContent='Lütfen işletme hesabınızla giriş yapın.';return}const {data:business,error:be}=await db.from('businesses').select('id,name').eq('id',businessId).eq('owner_id',user.id).maybeSingle();if(be||!business){$('state').textContent='Bu işletmenin yönetim yetkisi hesabınızda bulunamadı.';return}const {data:modules,error:me}=await db.from('ft_work_modules').select('module_key,enabled').eq('business_id',businessId);if(me){fail(me.message);return}const active=new Set((modules||[]).filter(x=>x.enabled).map(x=>x.module_key));$('workspace').hidden=false;$('state').textContent=business.name+' · Yönetici oturumu doğrulandı';await Promise.all([fill('requests','ft_customer_requests',reqStates,active.has('customer_request')),fill('claims','ft_work_claims',claimStates,active.has('worker_claim'))])}
async function fill(id,table,states,enabled){const root=$(id);root.replaceChildren();if(!enabled){text('p','Bu modül henüz FTMotion tarafından etkinleştirilmedi.',root);return}const {data,error}=await db.from(table).select('*').eq('business_id',businessId).order('created_at',{ascending:false}).limit(100);if(error){text('p',error.message,root);return}if(!data?.length){text('p','Henüz kayıt yok.',root);return}for(const row of data){const item=text('div','',root);item.className='item';text('strong',id==='requests'?row.customer_name+' · '+row.request_type:row.job_description+' · '+row.amount_try+' TL',item);text('small',new Date(row.created_at).toLocaleString('tr-TR'),item);if(id==='requests')text('p','Telefon: '+row.phone,item);text('p',row.description||row.notes||'',item);const select=document.createElement('select');for(const [key,label] of Object.entries(states)){const opt=document.createElement('option');opt.value=key;opt.textContent=label;select.append(opt)}select.value=row.status;item.append(select);const save=text('button','Kaydet',item);save.onclick=async()=>{save.disabled=true;const {error:e}=await db.from(table).update({status:select.value}).eq('id',row.id).eq('business_id',businessId);save.disabled=false;if(e)fail(e.message);else{fail('');await load()}}}}
$('reload').onclick=load;load();
</script></html>
