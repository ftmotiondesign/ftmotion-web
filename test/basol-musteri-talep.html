<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Başol Yapı · Servis Talebi</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#202b3a;font:15px system-ui}main{max-width:520px;margin:0 auto;padding:18px}section{padding:20px;border:1px solid #e4e9f0;border-radius:18px;background:#fff;box-shadow:0 8px 28px #15253a12}input,textarea,select{display:block;width:100%;padding:12px;margin:7px 0 16px;background:#fff;color:#1b2736;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{background:#ff8a2c;border:0;padding:13px 18px;border-radius:10px;font-weight:800}a{color:#db6a17}.muted{color:#64748b}h1{font-size:21px;margin:4px 0 14px}h2{font-size:18px;margin:0 0 12px}button{width:100%;cursor:pointer}</style><main><h1>Başol Yapı</h1><section><h2>Servis / Talep Oluştur</h2><p id="state" class="muted">Özellik kontrol ediliyor...</p><form id="form" hidden><label>Ad Soyad<input name="name" maxlength="100" required minlength="2"></label><label>Telefon<input name="phone" type="tel" minlength="10" maxlength="20" required></label><label>Talep Türü<select name="type"><option>Servis / Arıza</option><option>Fiyat Teklifi</option><option>Montaj / Bakım</option><option>Diğer</option></select></label><label>Talebiniz<textarea name="description" minlength="5" maxlength="1500" required></textarea></label><button id="send">WhatsApp ile Gönder</button></form></section></main><script type="module">import {client} from '../shared/supabase-client.js';const bid='5cb58978-f52a-4bb4-b942-832f19a2a083',state=document.getElementById('state'),form=document.getElementById('form');try{const db=await client();const {data,error}=await db.from('ft_work_modules').select('enabled').eq('business_id',bid).eq('module_key','customer_request').maybeSingle();if(error)throw error;if(!data?.enabled){state.textContent='Bu işletme için talep özelliği henüz aktif değil.'}else{state.textContent='Talebiniz doğrudan işletmeye iletilecektir.';form.hidden=false;form.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('send');btn.disabled=true;const v=Object.fromEntries(new FormData(form));const {data:biz,error:bizError}=await db.from('businesses').select('whatsapp').eq('id',bid).maybeSingle();let wa=String(biz?.whatsapp||'').replace(/[^0-9]/g,'');if(wa.startsWith('0'))wa='90'+wa.slice(1);else if(wa.length===10)wa='90'+wa;if(bizError||wa.length<11){state.textContent='İşletmenin WhatsApp numarası bulunamadı.';btn.disabled=false;return}const msg=['Yeni Müşteri Talebi - Başol Yapı','Ad Soyad: '+v.name,'Telefon: '+v.phone,'Talep: '+v.type,'Açıklama: '+v.description].join(String.fromCharCode(10));const {error:err}=await db.rpc('ft_submit_customer_request',{p_business_id:bid,p_name:v.name,p_phone:v.phone,p_type:v.type,p_description:v.description});if(err){state.textContent='Gönderilemedi: '+err.message;btn.disabled=false}else{form.hidden=true;state.textContent='Talebiniz kaydedildi. WhatsApp üzerinden mesajı gönderin.';window.top.location.assign('https://wa.me/'+wa+'?text='+encodeURIComponent(msg))}}}}catch(e){state.textContent='Bağlantı hatası: '+e.message}</script></html>
