<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Başol Yapı · Servis Talebi</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1118;color:#fff;font:15px system-ui}main{max-width:520px;margin:24px auto;padding:20px}section{padding:22px;border:1px solid #354154;border-radius:18px;background:#1b2531}input,textarea,select{display:block;width:100%;padding:12px;margin:7px 0 16px;background:#101923;color:white;border:1px solid #586879;border-radius:9px;font:inherit}button{background:#ff8a2c;border:0;padding:13px 18px;border-radius:10px;font-weight:800}a{color:#ffbd8c}.muted{color:#c2ccd7}</style><main><a href="/qr/basol-yapi">← İşletme Kartına Dön</a><h1>Başol Yapı</h1><section><h2>Servis / Talep Oluştur</h2><p id="state" class="muted">Özellik kontrol ediliyor...</p><form id="form" hidden><label>Ad Soyad<input name="name" maxlength="100" required minlength="2"></label><label>Telefon<input name="phone" type="tel" minlength="10" maxlength="20" required></label><label>Talep Türü<select name="type"><option>Servis / Arıza</option><option>Fiyat Teklifi</option><option>Montaj / Bakım</option><option>Diğer</option></select></label><label>Talebiniz<textarea name="description" minlength="5" maxlength="1500" required></textarea></label><button id="send">Talebi Gönder</button></form></section></main><script type="module">import {client} from '../shared/supabase-client.js';const bid='5cb58978-f52a-4bb4-b942-832f19a2a083',state=document.getElementById('state'),form=document.getElementById('form');try{const db=await client();const {data,error}=await db.from('ft_work_modules').select('enabled').eq('business_id',bid).eq('module_key','customer_request').maybeSingle();if(error)throw error;if(!data?.enabled){state.textContent='Bu işletme için talep özelliği henüz aktif değil.'}else{state.textContent='Talebiniz doğrudan işletmeye iletilecektir.';form.hidden=false;form.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('send');btn.disabled=true;const v=Object.fromEntries(new FormData(form));const {error:err}=await db.rpc('ft_submit_customer_request',{p_business_id:bid,p_name:v.name,p_phone:v.phone,p_type:v.type,p_description:v.description});if(err){state.textContent='Gönderilemedi: '+err.message;btn.disabled=false}else{form.hidden=true;state.textContent='Talebiniz işletmeye iletildi. Teşekkür ederiz.'}}}}catch(e){state.textContent='Bağlantı hatası: '+e.message}</script></html>
