<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMotion · İş Modülleri</title><style>*{box-sizing:border-box}body{margin:0;background:#0c111a;color:#f6f7fa;font:15px system-ui}main{max-width:620px;margin:25px auto;padding:18px}section{background:#1c2734;border:1px solid #3d4d61;border-radius:16px;padding:20px;margin:16px 0}button{background:#ff8c2e;border:0;border-radius:9px;padding:12px 18px;font-weight:800;margin:6px;cursor:pointer}button:disabled{opacity:.5}.muted{color:#bac8d8}</style><main><h1>Başol Yapı · Modül Aktivasyonu</h1><p class="muted">Yalnızca FTMotion ana yöneticisi işlem yapabilir.</p><p id="status">Oturum kontrol ediliyor...</p><section id="panel" hidden><h2>Müşteri Talep</h2><p id="customer"></p><button data-module="customer_request" data-enabled="true">Etkinleştir</button><button data-module="customer_request" data-enabled="false">Kapat</button><h2>Usta Hakediş</h2><p id="worker"></p><button data-module="worker_claim" data-enabled="true">Etkinleştir</button><button data-module="worker_claim" data-enabled="false">Kapat</button></section></main><script type="module">import {client,currentUser} from '../shared/supabase-client.js';const bid='5cb58978-f52a-4bb4-b942-832f19a2a083',status=document.getElementById('status'),panel=document.getElementById('panel');try{const db=await client(),user=await currentUser(db);if(!user){status.textContent='Yönetici hesabınızla giriş yapın.'}else{const {data:admin,error:ae}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(ae||!admin){status.textContent='FTMotion ana yönetici yetkisi bulunamadı.'}else{panel.hidden=false;status.textContent='Yönetici doğrulandı.';async function refresh(){const {data,error}=await db.from('ft_work_modules').select('module_key,enabled').eq('business_id',bid);if(error){status.textContent=error.message;return}for(const [id,key] of [['customer','customer_request'],['worker','worker_claim']])document.getElementById(id).textContent=data?.find(x=>x.module_key===key)?.enabled?'Durum: Aktif':'Durum: Pasif'}for(const btn of panel.querySelectorAll('button'))btn.onclick=async()=>{if(!confirm('Bu modülün durumunu değiştirmek istiyor musunuz?'))return;btn.disabled=true;const {error}=await db.rpc('ft_admin_set_work_module',{p_business_id:bid,p_module_key:btn.dataset.module,p_enabled:btn.dataset.enabled==='true'});btn.disabled=false;status.textContent=error?'Hata: '+error.message:'Modül durumu kaydedildi.';if(!error)await refresh()};await refresh()}}}catch(e){status.textContent=e.message}</script></html>
