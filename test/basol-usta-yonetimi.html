<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Başol Yapı · Usta Yetkilendirme</title><style>body{background:#0e121b;color:white;font:15px system-ui;margin:0}main{max-width:650px;margin:25px auto;padding:18px}section{background:#1d2938;padding:22px;border-radius:16px}input{width:95%;padding:12px;background:#111b27;color:white;border:1px solid #59687b;border-radius:8px}button{padding:11px 15px;background:#ff902f;border:0;border-radius:8px;font-weight:bold;margin:10px 5px 10px 0}.item{border-top:1px solid #46566b;padding:12px 0}a{color:#ffc18d}</style><main><a href="basol-is-panel.html">← İş Yönetimi</a><h1>Yetkili Ustalar</h1><section><p id="status">Hesap doğrulanıyor...</p><div id="workspace" hidden><p>Ustanın kayıtlı FTMotion kullanıcı kimliğini girin.</p><input id="worker" placeholder="Usta kullanıcı kimliği (UUID)"><button id="add">Ustayı Ekle</button><h2>Yetkilendirilmiş Ustalar</h2><div id="list"></div></div></section></main><script type="module">
import {client,currentUser} from '../shared/supabase-client.js';
const bid='5cb58978-f52a-4bb4-b942-832f19a2a083', $=id=>document.getElementById(id);let db;
function node(tag,label,parent){const el=document.createElement(tag);el.textContent=label;parent.append(el);return el}
async function list(){const box=$('list');box.replaceChildren();const {data,error}=await db.from('ft_worker_memberships').select('worker_id,active').eq('business_id',bid);if(error){$('status').textContent=error.message;return}for(const item of data||[]){const row=node('div',item.worker_id+' · '+(item.active?'Aktif':'Pasif'),box);row.className='item';const btn=node('button',item.active?'Yetkiyi Kaldır':'Yetkilendir',row);btn.onclick=async()=>{btn.disabled=true;const {error:e}=await db.from('ft_worker_memberships').update({active:!item.active}).eq('business_id',bid).eq('worker_id',item.worker_id);if(e)$('status').textContent=e.message;else await list();btn.disabled=false}}}
try{db=await client();const user=await currentUser(db);if(!user)throw Error('İşletme hesabınızla giriş yapın.');const {data,error}=await db.from('businesses').select('id').eq('id',bid).eq('owner_id',user.id).maybeSingle();if(error||!data)throw Error('Bu işletmenin sahibi değilsiniz.');$('workspace').hidden=false;$('status').textContent='İşletme sahibi doğrulandı.';$('add').onclick=async()=>{const id=$('worker').value.trim();if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){$('status').textContent='Geçerli kullanıcı kimliği girin.';return}const {error:e}=await db.from('ft_worker_memberships').upsert({business_id:bid,worker_id:id,active:true},{onConflict:'business_id,worker_id'});if(e)$('status').textContent=e.message;else{$('worker').value='';$('status').textContent='Usta yetkilendirildi.';await list()}};await list()}catch(e){$('status').textContent=e.message}
</script></html>
