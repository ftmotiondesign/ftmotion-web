<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>FTMotion · QR Kart</title><style>body{font:16px system-ui;background:#f3f4f6;color:#26313e;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:28px;max-width:450px;margin:18px;text-align:center}a{color:#c45b00}</style></head><body><div class="card"><h1>FTMotion</h1><p id="state">Kart bağlantısı kontrol ediliyor...</p><a href="/">Ana sayfaya dön</a></div><script type="module">import {client} from '../shared/supabase-client.js';const p=new URLSearchParams(location.search);const code=p.get('code')||'';const state=document.getElementById('state');if(!/^[a-z0-9-]{2,40}$/i.test(code)){state.textContent='Geçersiz kart kodu.'}else{try{const db=await client();const {data,error}=await db.rpc('ft_public_stock_destination',{p_code:code});if(error)throw error;if(data && ((/^\/qr\/\?slug=[a-z0-9-]+$/i.test(data)) || (function(){try{const u=new URL(data);return u.protocol==='https:' && (u.hostname==='g.page'||u.hostname==='goo.gl'||u.hostname==='maps.app.goo.gl'||u.hostname==='google.com'||u.hostname.endsWith('.google.com')||/^google\.[a-z.]+$/.test(u.hostname)||/\.google\.[a-z.]+$/.test(u.hostname))}catch(_){return false}})())){location.replace(data)}else{state.textContent='Bu QR kart henüz bir işletmeye tanımlanmamış veya işletme yayında değil.'}}catch(e){state.textContent='Kart bilgisi şu anda yüklenemiyor. Lütfen daha sonra tekrar deneyin.'}}</script></body></html>
