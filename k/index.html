<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>QR Yönlendirme</title><style>html,body{margin:0;min-height:100%;background:#fff;font:15px system-ui,Arial;color:#243044}.card{display:none;max-width:420px;margin:24vh auto 0;padding:24px;border:1px solid #e5e7eb;border-radius:14px;text-align:center}a{color:#bf5700}.card.visible{display:block}</style></head>
<body><main class="card" id="card"><h2>QR bağlantısı</h2><p id="state"></p><a href="/">Ana sayfa</a></main>
<script>
(async()=>{
const state=document.getElementById('state'),card=document.getElementById('card');
const fail=m=>{state.textContent=m;card.classList.add('visible')};
const code=new URLSearchParams(location.search).get('code')||'';
if(!/^[A-Z0-9-]{2,40}$/i.test(code)){fail('Geçersiz kart kodu.');return}
try{
const cfgResponse=await fetch('/supabase-config.json',{cache:'no-store'});
if(!cfgResponse.ok)throw Error('configuration');
const cfg=await cfgResponse.json();
const api=new URL('/rest/v1/rpc/ft_public_stock_destination',cfg.url);
const response=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.anonKey,'Authorization':'Bearer '+cfg.anonKey},body:JSON.stringify({p_code:code})});
if(!response.ok)throw Error('destination');
const destination=await response.json();
if(typeof destination!=='string'||!destination){fail('Bu QR kart henüz kullanıma hazır değil. İşletme atamasını ve hedef bağlantısını kontrol edin.');return}
if(/^\/qr\/\?slug=[a-z0-9-]+$/i.test(destination)){
const slug=new URLSearchParams(destination.slice(destination.indexOf('?'))).get('slug');
location.replace('/qr/'+encodeURIComponent(slug));return
}
const url=new URL(destination);
const h=url.hostname.toLowerCase();
if(url.protocol==='https:'&&(h==='g.page'||h==='goo.gl'||h==='maps.app.goo.gl'||h==='google.com'||h.endsWith('.google.com')||/^google\.[a-z.]+$/.test(h)||/\.google\.[a-z.]+$/.test(h))){location.replace(url.href);return}
fail('Kart yönlendirmesi geçersiz.');
}catch(e){fail('QR bağlantısı şu anda açılamıyor. Lütfen tekrar deneyin.')}
})();
</script></body></html>
