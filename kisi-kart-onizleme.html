<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kişisel Kart Önizleme | FTMotion</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font:15px system-ui,Arial}main{max-width:540px;margin:auto;min-height:100vh;background:#0d0e12;padding-bottom:25px}.cover{height:230px;background:linear-gradient(135deg,#1a2940,#0c0d11);background-size:cover;background-position:center}.profile{text-align:center;margin:-46px 16px 25px;position:relative}.avatar{width:96px;height:96px;border:4px solid white;border-radius:50%;object-fit:cover;background:#1e293b;display:grid;place-items:center;margin:auto;font-size:36px}.profile h1{margin:12px 0 3px;font-size:27px}.muted{color:#b9bac1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px}.btn{display:flex;align-items:center;justify-content:center;min-height:65px;border:1px solid #34363c;border-radius:16px;background:#17181d;color:#fff;text-decoration:none;font-weight:700;text-align:center;padding:12px}.firm{display:block;margin:10px 15px;padding:16px;border:1px solid #383a42;border-radius:14px;background:#191a1f;color:#fff;text-decoration:none;font-weight:700}.section{margin:30px 15px 8px;font-size:18px}.actions{display:flex;gap:10px;margin:25px 15px}.actions a,.actions button{flex:1;border:0;border-radius:13px;background:#ff8700;color:#151515;font-weight:800;padding:15px;text-align:center;text-decoration:none;font:inherit;cursor:pointer}.error{padding:25px;text-align:center}</style></head><body><main id="app"><p class="error">Kişisel kart yükleniyor…</p></main><script type="module">import {client} from './shared/supabase-client.js';const app=document.getElementById('app'),params=new URLSearchParams(location.search),slug=params.get('id');const valid=['burak-basol','yusuf-basol'];const safe=(v)=>String(v||'');function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}function link(text,url,cls){const a=node('a',cls,text);a.href=url;return a}try{if(!valid.includes(slug))throw Error('Geçersiz kişi kartı.');const db=await client();const {data:company,error:be}=await db.from('qr_short_links').select('business_id').eq('short_slug','basol-yapi').eq('is_active',true).single();if(be||!company)throw Error('İşletme bağlantısı bulunamadı.');const {data:p,error}=await db.from('corporate_employees').select('full_name,job_title,phone,whatsapp,email,photo_url,cover_url,firms,is_active').eq('business_id',company.business_id).eq('slug',slug).eq('is_active',true).single();if(error||!p)throw Error('Kişisel kart bulunamadı.');app.replaceChildren();const cover=node('div','cover');if(/^https:\/\//.test(p.cover_url||''))cover.style.backgroundImage='url("'+encodeURI(p.cover_url).replace(/"/g,'%22')+'")';app.append(cover);const profile=node('div','profile'),avatar=node('div','avatar');if(/^https:\/\//.test(p.photo_url||'')){const img=node('img','avatar');img.src=p.photo_url;img.alt=p.full_name;avatar.replaceWith(img);profile.append(img)}else{avatar.textContent='👤';profile.append(avatar)}profile.append(node('h1','',p.full_name),node('div','muted',p.job_title||'Kişisel Dijital Kart'));app.append(profile);const grid=node('div','grid');const add=(label,url)=>grid.append(link(label,url,'btn'));if(p.phone)add('📱 Cep Telefonu','tel:'+p.phone);if(p.whatsapp)add('🟢 WhatsApp','https://wa.me/'+p.whatsapp.replace(/\D/g,''));if(p.email)add('✉️ E-posta','mailto:'+p.email);app.append(grid);app.append(node('h2','section','Bağlı Olduğum Firmalar'));app.append(link('🏢 BAŞOL YAPI','/qr/basol-yapi','firm'));for(const f of Array.isArray(p.firms)?p.firms:[]){if(f&&typeof f.name==='string'&&/^https:\/\//.test(f.url||''))app.append(link('🏢 '+f.name,f.url,'firm'))}const actions=node('div','actions');const share=node('button','','Paylaş');share.onclick=()=>navigator.share?navigator.share({title:p.full_name,url:location.href}):navigator.clipboard.writeText(location.href);actions.append(share);app.append(actions);document.title=p.full_name+' | FTMotion'}catch(e){app.replaceChildren(node('p','error',e.message))}</script></body></html>
