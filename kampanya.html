<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kampanya | FTMotion</title><style>:root{--bg:#090e19;--panel:#152233;--line:#304257;--txt:#edf6ff;--accent:#58e0c4}*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);font:15px/1.65 system-ui;margin:0}header{padding:18px max(22px,calc((100vw - 1150px)/2));border-bottom:1px solid var(--line);background:#0e1825}a{color:var(--accent);text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:38px 22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:24px;margin:16px 0}.muted{color:#aabfd2}h1{font-size:clamp(30px,4vw,51px);line-height:1.13}h2{font-size:24px}button,.btn{background:var(--accent);color:#062527;border:0;border-radius:11px;padding:12px 20px;display:inline-block;font-weight:800;cursor:pointer;text-decoration:none}input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #435771;background:#0b1624;color:white;font:inherit;margin:5px 0 15px}label{display:block}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.media{width:100%;max-height:430px;object-fit:contain;border-radius:12px;background:#0a1420}.empty{min-height:210px;background:radial-gradient(circle,#234b56,#0d1b2a);border-radius:15px;display:grid;place-items:center;font-size:64px}.pill{color:var(--accent);font-weight:800;letter-spacing:1px;font-size:12px}.price{font-size:30px;font-weight:900}.small{font-size:12px}.line{border-top:1px solid #324658;padding:13px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}@media(max-width:740px){.cols{grid-template-columns:1fr}.wrap{padding:22px 16px}}</style></head><body><header><a href="index.html">← <b>FTMotion</b> · Ana sayfa</a></header><main class="wrap"><div class="pill">ÖZEL PAKET</div><h1>6 hizmet, tek kampanya</h1><p class="muted">Hizmetleri seçin, normal toplam ve tam paket indirimini görün.</p><div class="cols"><div class="card" id="items"></div><div class="card"><h2>Sipariş özeti</h2><div class="line">Normal fiyat: <b id="normal"></b></div><div class="line">Kampanya avantajı: <b id="discount"></b></div><div class="price" id="total"></div><p class="muted small">Tam paket fiyatı yalnızca altı hizmetin tamamı seçilirse uygulanır.</p><a class="btn" id="go" href="siparis.html">Sipariş / Teklif Oluştur →</a></div></div></main><script>const arr=[["video", "🎬", "Görselden Video Oluşturma", "Görsellerinizi sosyal medya için kısa tanıtım videolarına dönüştürün."], ["drone", "🌍", "Sanal Drone Konum Videosu", "Harita üzerinden işletmenize sinematik ulaşım ve konum anlatımı."], ["tour", "🏛️", "360° Mekân Çekimi", "Ziyaretçiler işletmenizi sanal tur ile gezsin."], ["qr", "📱", "QR / NFC Kart Çözümleri", "Kalıcı QR ve NFC ile işletme iletişim bilgileri."], ["menu", "🍽️", "QR Menü Uygulaması", "Fotoğraflı, kategorili ürün menüsü ve düzenleme paneli."], ["web", "💻", "Web Sitesi Hazırlama", "Mobil uyumlu profesyonel işletme tanıtım sitesi."]];let s;try{s=JSON.parse(localStorage.getItem('ftmotion_prices'))||{}}catch{s={}}const prices={video:1500,drone:2000,tour:3500,qr:1500,menu:2500,web:4500},selected=new Set(arr.map(x=>x[0]));const m=v=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(v);items.innerHTML=arr.map(x=>`<label class="line" style="display:flex;gap:10px;align-items:center"><input type="checkbox" checked data-id="${x[0]}" style="width:auto;margin:0"><span style="flex:1">${x[2]}</span><b>${m(s.prices?.[x[0]]??prices[x[0]])}</b></label>`).join('');items.querySelectorAll('input').forEach(e=>e.onchange=()=>{e.checked?selected.add(e.dataset.id):selected.delete(e.dataset.id);calc()});function calc(){let v=arr.filter(x=>selected.has(x[0])).reduce((a,x)=>a+(s.prices?.[x[0]]??prices[x[0]]),0),final=selected.size===6?Math.min(v,s.bundle??11900):v;normal.textContent=m(v);discount.textContent=m(v-final);total.textContent=m(final);go.href='siparis.html?hizmet='+encodeURIComponent([...selected].join(','));go.style.pointerEvents=selected.size?'auto':'none';}calc()</script></body></html>
