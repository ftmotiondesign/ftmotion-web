<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hizmet Detayı | FT Dijital</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17243b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#175c88;color:white;padding:17px max(18px,calc((100vw - 1060px)/2));display:flex;justify-content:space-between;align-items:center}a{color:inherit;text-decoration:none}.wrap{max-width:1060px;margin:25px auto;padding:0 16px}.card{background:white;border:1px solid #e3eaf3;border-radius:16px;padding:23px;margin-bottom:18px;box-shadow:0 5px 20px #17243b08}.muted{color:#697789}.tag{display:inline-block;background:#e9f4ff;color:#17618f;border-radius:99px;padding:7px 12px;font-size:13px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center}.hero h1{font-size:clamp(26px,4vw,38px);margin:14px 0}.price{font-size:27px;font-weight:800;color:#17618f}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.btn{border:0;border-radius:10px;background:#17618f;color:white;padding:13px 18px;font-weight:700;cursor:pointer;display:inline-block}.btn.secondary{background:#e8f2fa;color:#175c88}.btn.wa{background:#16885b}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:12px;cursor:pointer;background:#eef2f7}.video{width:100%;max-height:420px;border-radius:12px;aspect-ratio:16/9;border:0;background:#101b2b}.field{width:100%;border:1px solid #ccd6e4;border-radius:10px;padding:13px;font:inherit}.stack{display:grid;gap:12px;max-width:620px}.hidden{display:none}.note{background:#fff7e8;padding:12px;border-radius:10px;color:#755515;font-size:13px}dialog{border:0;border-radius:14px;max-width:min(92vw,900px);padding:10px}dialog img{max-width:100%;max-height:80vh}dialog button{float:right}@media(max-width:680px){.hero{grid-template-columns:1fr}.card{padding:17px}.actions .btn{flex:1;text-align:center}.gallery{grid-template-columns:repeat(2,1fr)}.gallery img{height:135px}} .form-actions{display:flex;gap:10px;flex-wrap:wrap}.form-actions .btn{flex:1;min-width:180px}@media(max-width:560px){.form-actions{flex-direction:column}.form-actions .btn{width:100%}}</style></head><body><header><strong>✦ FT Dijital</strong><a href="index.html">← Ana sayfa</a></header><main class="wrap"><div id="content"></div></main><dialog id="lightbox"><button class="btn secondary" onclick="document.getElementById('lightbox').close()">Kapat ✕</button><img id="large" alt="Örnek çalışma"></dialog><script src="cloud-config.js"></script><script src="cloud-orders.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);let cats=[],orders=[];try{cats=JSON.parse(localStorage.getItem('ft_categories_v1')||'[]');orders=JSON.parse(localStorage.getItem('ft_orders_v1')||'[]')}catch{}const c=cats.find(x=>x.id===params.get('cat')),s=c?.subs?.find(x=>x.id===params.get('sub'));const safeImg=u=>/^(https:\/\/|data:image\/(png|jpeg|webp);base64,)/i.test(u||'')?u:'';const videoUrl=u=>{try{const x=new URL(u);if(x.protocol!=='https:')return null;if(['youtube.com','www.youtube.com','m.youtube.com'].includes(x.hostname)){const id=x.searchParams.get('v');return id&&/^[\w-]{11}$/.test(id)?'https://www.youtube-nocookie.com/embed/'+id:null}if(x.hostname==='youtu.be'&&/^[\w-]{11}$/.test(x.pathname.slice(1)))return 'https://www.youtube-nocookie.com/embed/'+x.pathname.slice(1);return null}catch{return null}};
if(!c||!s||!c.active||!s.active){$('content').innerHTML='<div class="card"><h2>Hizmet bulunamadı</h2><p>Hizmet kaldırılmış veya pasif olabilir. Ana sayfadan yeniden seçim yapın.</p><a class="btn" href="index.html">Ana sayfaya dön</a></div>'}else{document.title=s.name+' | FT Dijital';const images=[s.image,...(Array.isArray(s.gallery)?s.gallery:[])].filter(safeImg),vid=s.video||s.sample||'',embed=videoUrl(vid);$('content').innerHTML=`<div class="card hero"><div><span class="tag">${esc(c.name)}</span><h1>${esc(s.name)}</h1><p>${esc(s.description||'Bu hizmet hakkında detaylı bilgi alabilir, örnek çalışmaları inceleyebilir ve sipariş talebi oluşturabilirsiniz.')}</p><div class="price">${s.price?esc(s.price)+' TL':'Fiyat için teklif alın'}</div><div class="actions"><button class="btn" id="orderBtn">🛒 Sipariş Ver</button><button class="btn secondary" id="supportBtn">🎧 Destek Al</button><a class="btn wa" id="waBtn" href="#support">WhatsApp</a></div></div><div>${images[0]?`<img style="width:100%;max-height:280px;object-fit:cover;border-radius:13px" src="${esc(images[0])}" alt="Hizmet görseli">`:'<div style="background:#eaf2fa;border-radius:13px;padding:65px 10px;text-align:center;font-size:56px">🎬</div>'}</div></div><div class="card"><h2>Örnek Fotoğraflar</h2>${images.length?`<div class="gallery">${images.map((im,i)=>`<img src="${esc(im)}" data-photo="${i}" alt="Örnek çalışma ${i+1}">`).join('')}</div>`:'<p class="muted">Bu hizmete henüz örnek görsel eklenmedi.</p>'}</div><div class="card"><h2>Örnek Video</h2>${embed?`<iframe class="video" src="${esc(embed)}" title="Örnek video" allowfullscreen loading="lazy"></iframe>`:/^https:\/\//i.test(vid)?/\.(mp4|webm)(\?|$)/i.test(vid)?`<video class="video" controls src="${esc(vid)}"></video>`:`<a class="btn secondary" href="${esc(vid)}" target="_blank" rel="noopener noreferrer">Örnek videoyu aç ↗</a>`:'<p class="muted">Bu hizmete henüz örnek video eklenmedi.</p>'}</div><div class="card" id="order"><h2>Sipariş Ver</h2><p class="muted">${esc(s.name)} için sipariş talebinizi iletin.</p><form id="orderForm" class="stack"><input class="field" name="name" placeholder="Adınız / Firma adı" required maxlength="100"><input class="field" name="phone" type="tel" inputmode="tel" placeholder="Telefon numarası" required minlength="10" maxlength="20"><input class="field" name="email" type="email" placeholder="E-posta (isteğe bağlı)"><textarea class="field" name="note" rows="4" placeholder="İstediğiniz hizmetin detaylarını yazın..."></textarea><div class="form-actions"><button class="btn" type="submit">Talebi kaydet</button><button class="btn wa" type="button" id="orderWhatsApp">WhatsApp ile Sipariş Ver ↗</button></div></form><p class="note">Test sürümü: Talepler yalnızca bu tarayıcıya kaydedilir. Gerçek sipariş veya ödeme sistemi henüz bağlı değildir.</p><p id="result"></p></div><div class="card" id="support"><h2>Destek Al / WhatsApp</h2><p class="muted">Sorularınız için destek talebi bırakabilir veya WhatsApp üzerinden iletişime geçebilirsiniz.</p><form id="supportForm" class="stack"><input class="field" name="name" placeholder="Adınız" required><input class="field" name="phone" placeholder="Telefon" required minlength="10"><textarea class="field" name="note" placeholder="Sorunuz" required rows="3"></textarea><div class="form-actions"><button class="btn secondary" type="submit">Destek talebini kaydet</button><button class="btn wa" type="button" id="supportWhatsApp">WhatsApp ile Destek Al ↗</button></div></form><p id="supportResult"></p><p class="note">WhatsApp üzerinden göndermek için önce ad ve telefon alanlarını doldurun. WhatsApp uygulamasında Gönder seçilene kadar mesaj iletilmez.</p></div>`;document.querySelectorAll('[data-photo]').forEach(n=>n.onclick=()=>{$('large').src=images[Number(n.dataset.photo)];$('lightbox').showModal()});$('orderBtn').onclick=()=>$('order').scrollIntoView({behavior:'smooth'});$('supportBtn').onclick=()=>$('support').scrollIntoView({behavior:'smooth'});const whatsappNumber=localStorage.getItem('ft_business_whatsapp_v1')||'';if(/^90\d{10}$/.test(whatsappNumber)){const msg='Merhaba, '+s.name+' hizmeti hakkında bilgi almak istiyorum.';$('waBtn').href='https://wa.me/'+whatsappNumber+'?text='+encodeURIComponent(msg);$('waBtn').target='_blank';$('waBtn').rel='noopener noreferrer';const note=$('support').querySelector('.note');if(note)note.textContent='WhatsApp butonları işletmenin kayıtlı numarasına yönlendirir. Mesajı göndermek için WhatsApp içinde onaylayın.'}else{$('waBtn').onclick=e=>{e.preventDefault();$('support').scrollIntoView({behavior:'smooth'});alert('WhatsApp numarası henüz tanımlanmadı. Destek formunu kullanabilirsiniz.')}};const sendWhatsApp=(form,type)=>{const data=new FormData(form);const name=String(data.get('name')||'').trim(),phone=String(data.get('phone')||'').replace(/\D/g,''),note=String(data.get('note')||'').trim();if(!name){alert('Lütfen adınızı veya firma adını girin.');form.elements.name.focus();return}if(phone.length<10||phone.length>15){alert('Geçerli telefon numarası girin.');form.elements.phone.focus();return}const number=localStorage.getItem('ft_business_whatsapp_v1')||'';if(!/^90\d{10}$/.test(number)){alert('WhatsApp numarası henüz yönetim panelinden tanımlanmadı. Talebi kaydet seçeneğini kullanabilirsiniz.');return}const msg=['Merhaba, '+s.name+' hizmeti için '+(type==='Sipariş'?'sipariş vermek':'destek almak')+' istiyorum.','Hizmet: '+s.name,'Kategori: '+c.name,'Ad / Firma: '+name,'Telefon: '+String(data.get('phone')||''),...(data.get('email')?['E-posta: '+data.get('email')]:[]),...(note?['Açıklama: '+note]:[])].join('\n');const url='https://wa.me/'+number+'?text='+encodeURIComponent(msg);const win=window.open(url,'_blank','noopener,noreferrer');if(!win)location.href=url};$('orderWhatsApp').onclick=()=>sendWhatsApp($('orderForm'),'Sipariş');$('supportWhatsApp').onclick=()=>sendWhatsApp($('supportForm'),'Destek');const submit=(form,type,result)=>{form.onsubmit=async e=>{e.preventDefault();const data=new FormData(form),phone=String(data.get('phone')||'').replace(/\D/g,'');if(phone.length<10||phone.length>15){alert('Geçerli telefon numarası girin.');return}const item={id:String(Date.now())+Math.random().toString(36).slice(2,6),date:new Date().toLocaleString('tr-TR'),category:c.name,service:s.name+(type==='Destek'?' (Destek)':''),name:String(data.get('name')||''),phone:String(data.get('phone')||''),email:String(data.get('email')||''),note:String(data.get('note')||''),status:'Yeni'};if(window.FTOrders?.ready()){
 try{await FTOrders.submit({...item,kind:type});$(result).textContent='Talebiniz alındı ve merkezi sisteme kaydedildi.';form.reset()}
 catch(err){$(result).textContent='Talep gönderilemedi: '+err.message+'. Lütfen WhatsApp ile iletişime geçin.'}
}else{try{orders.unshift(item);localStorage.setItem('ft_orders_v1',JSON.stringify(orders));$(result).textContent='Demo: Talebiniz yalnızca bu tarayıcıya kaydedildi. Canlı sisteme gönderilmedi.';form.reset()}catch{$(result).textContent='Kayıt yapılamadı; tarayıcı depolama alanını kontrol edin.'}}}};submit($('orderForm'),'Sipariş','result');submit($('supportForm'),'Destek','supportResult')}
</script></body></html>
