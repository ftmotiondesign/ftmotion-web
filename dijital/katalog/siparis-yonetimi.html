<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FT Dijital | Bulut Sipariş Yönetimi</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17263a;font:15px system-ui}header{background:#155b88;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:18px}.card{background:white;padding:20px;border-radius:14px;margin:14px 0;border:1px solid #e0e7ef}input,select,button{padding:12px;border:1px solid #d4deea;border-radius:9px;font:inherit}button{background:#156b9e;color:white;cursor:pointer}input{max-width:100%;width:280px}label{display:block;margin:12px 0}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e7ebef;vertical-align:top}th{background:#f4f8fc}.scroll{overflow-x:auto}.muted{color:#697b8e}#dashboard{display:none}#message{white-space:pre-wrap}</style></head><body><header><strong>FT Dijital · Merkezi Sipariş Yönetimi</strong></header><main><p><a href="index.html">← Ana sayfa</a></p><div id="message" class="muted" role="status"></div><section class="card" id="login"><h2>Yönetici Girişi</h2><p class="muted">Supabase Authentication üzerinden giriş yapılır. Yalnızca yetkilendirilmiş yöneticiler siparişleri okuyabilir.</p><form id="form"><label>E-posta<br><input id="email" type="email" autocomplete="username" required></label><label>Şifre<br><input id="password" type="password" autocomplete="current-password" required></label><button>Giriş yap</button></form></section><section id="dashboard" class="card"><h2>Gelen Sipariş ve Destek Talepleri</h2><p><button id="refresh">Yenile</button> <button id="logout">Çıkış</button></p><label>Arama <input id="search" placeholder="Müşteri, hizmet, telefon..."></label><div class="scroll"><table><thead><tr><th>Tarih</th><th>Tür / Hizmet</th><th>Müşteri</th><th>Not</th><th>Durum</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="cloud-config.js"></script><script src="cloud-orders.js"></script><script>
let token='',orders=[];const $=id=>document.getElementById(id);const msg=s=>$('message').textContent=s;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!FTOrders.ready())msg('Bulut bağlantısı henüz yapılandırılmadı. cloud-config.js dosyasına Supabase proje URL ve publishable/anon anahtarını ekleyin.');
$('form').onsubmit=async e=>{e.preventDefault();if(!FTOrders.ready())return;try{const r=await FTOrders.login($('email').value,$('password').value);token=r.access_token;$('password').value='';await load();$('login').style.display='none';$('dashboard').style.display='block';msg('Yönetici oturumu açıldı.')}catch(err){token='';msg('Giriş veya yetki hatası: '+err.message)}};
async function load(){orders=await FTOrders.list(token);draw()}
function draw(){const q=$('search').value.toLocaleLowerCase('tr');const list=orders.filter(o=>[o.customer_name,o.phone,o.service,o.category,o.note].join(' ').toLocaleLowerCase('tr').includes(q));$('rows').innerHTML=list.map(o=>`<tr><td>${esc(new Date(o.created_at).toLocaleString('tr-TR'))}</td><td><b>${esc(o.kind)}</b><br>${esc(o.category)} / ${esc(o.service)}</td><td>${esc(o.customer_name)}<br>${esc(o.phone)}<br>${esc(o.email)}</td><td>${esc(o.note)}</td><td><select data-id="${esc(o.id)}">${['Yeni','İşlemde','Tamamlandı','İptal'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="5">Kayıt bulunamadı.</td></tr>';document.querySelectorAll('select[data-id]').forEach(sel=>sel.onchange=async()=>{try{await FTOrders.status(token,sel.dataset.id,sel.value);msg('Durum kaydedildi.')}catch(e){msg('Durum kaydedilemedi: '+e.message);await load()}})}
$('refresh').onclick=async()=>{try{await load();msg('Liste güncellendi.')}catch(e){msg('Yenileme başarısız: '+e.message)}};$('search').oninput=draw;$('logout').onclick=()=>{token='';orders=[];$('dashboard').style.display='none';$('login').style.display='block';msg('Çıkış yapıldı.')};// Token deliberately held only in memory.
</script></body></html>
