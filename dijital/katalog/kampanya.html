<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kampanya Detayı | FT Dijital</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172c42;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#155b88;color:#fff;padding:18px max(16px,calc((100vw - 1000px)/2));display:flex;justify-content:space-between;align-items:center}header a{color:white;text-decoration:none}main{max-width:1000px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #e1e8ef;border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:0 6px 22px #1232}.hero{background:linear-gradient(120deg,#123e70,#2387ad);color:white}.hero h1{font-size:clamp(25px,4vw,42px);margin:12px 0}.hero p{line-height:1.65}.hero img{max-width:100%;max-height:340px;object-fit:contain;border-radius:12px;margin-top:16px}.tag{font-size:12px;letter-spacing:1px;font-weight:800}.price{font-size:26px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{width:100%;padding:13px;border:1px solid #cbd6e2;border-radius:10px;font:inherit;margin-bottom:12px}button{background:#155b88;border:0;color:white;border-radius:10px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.muted{color:#65778a;font-size:13px}.detail{white-space:pre-wrap;line-height:1.75}.gallery{display:flex;gap:10px;overflow-x:auto;margin:12px 0}.gallery img{width:155px;height:110px;object-fit:cover;border-radius:10px;cursor:pointer}.gallery img:focus{outline:3px solid #155b88}.preview{width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:#e8eef4}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.package{padding-left:20px;line-height:1.9}#message{font-weight:700} @media(max-width:700px){.grid{grid-template-columns:1fr}.panel{padding:18px}main{margin-top:12px}}
.price-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}.old-price{color:#7c8796;text-decoration:line-through;font-size:17px}.discount{background:#dcfce7;color:#166534;border-radius:8px;padding:7px 10px;font-weight:800}</style></head><body><header><strong>✦ FT Dijital</strong><a href="index.html">← Ana sayfa</a></header><main><div id="content"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search),id=params.get('id');let campaigns=[];try{campaigns=JSON.parse(localStorage.getItem('ft_campaigns_v2')||'[]')}catch{}const today=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Istanbul'});const fallback={id:'default',active:true,tag:'BU AYA ÖZEL',title:'Dijital tanıtımda fırsatları keşfedin!',text:'Video, web tasarım ve QR çözümlerimiz için avantajlı paketleri inceleyin.',detail:'Kampanya içeriği ve özel fiyat bilgisi için sipariş talebi oluşturabilirsiniz.',package:'Sosyal medya video çözümleri\nWeb tasarım hizmetleri\nQR ve NFC çözümleri',gallery:[],image:'',price:'',start:'',end:''};const c=campaigns.find(x=>x.id===(id||'default')&&x.active&&(!x.start||x.start<=today)&&(!x.end||x.end>=today))||(!campaigns.length&&(!id||id==='default')?fallback:null);const root=document.getElementById('content');if(!c){root.innerHTML='<section class="panel"><h2>Kampanya bulunamadı veya yayında değil.</h2><a href="index.html">Kampanyalara dön</a></section>'}else{const img=/^(https:\/\/|data:image\/(png|jpeg|webp);base64,)/i.test(c.image||'')?c.image:'';const gallery=[img,...(Array.isArray(c.gallery)?c.gallery:[])].filter(x=>/^(https:\/\/|data:image\/(png|jpeg|webp);base64,)/i.test(x)).slice(0,6);const video=String(c.video||'');const yt=video.match(/^https:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);const embed=yt?'https://www.youtube-nocookie.com/embed/'+yt[1]:'';root.innerHTML=`<section class="panel hero"><div class="tag">${esc(c.tag||'KAMPANYA')}</div><h1>${esc(c.title)}</h1><p>${esc(c.text)}</p>${img?`<img src="${esc(img)}" alt="Kampanya görseli">`:''}</section><div class="grid"><section class="panel"><h2>Kampanya Detayları</h2>${gallery.length?`<img id="mainPreview" class="preview" src="${esc(gallery[0])}" alt="Kampanya örneği"><div class="gallery">${gallery.map((g,i)=>`<img tabindex="0" data-gallery="${i}" src="${esc(g)}" alt="Örnek görsel ${i+1}">`).join('')}</div>`:''}${embed?`<h3>Örnek video</h3><iframe class="video" src="${esc(embed)}" title="Kampanya örnek videosu" loading="lazy" allowfullscreen></iframe>`: /^https:\/\/[^?#]+\.(?:mp4|webm)(?:[?#].*)?$/i.test(video)?`<h3>Örnek video</h3><video class="video" controls playsinline preload="metadata" src="${esc(video)}"></video>`: /^https:\/\//i.test(video)?`<p><a href="${esc(video)}" target="_blank" rel="noopener noreferrer">Örnek videoyu aç ↗</a></p>`:''}${c.package?`<h3>Paket İçeriği</h3><ul class="package">${String(c.package).split('\n').filter(x=>x.trim()).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="detail">${esc(c.detail||c.text||'Kampanya hakkında detaylı bilgi için sipariş talebi gönderebilirsiniz.')}</div>${c.normalPrice&&c.salePrice?`<div class="price-box"><span class="old-price">${esc(Number(c.normalPrice).toLocaleString('tr-TR',{style:'currency',currency:'TRY'}))}</span><strong class="price">${esc(Number(c.salePrice).toLocaleString('tr-TR',{style:'currency',currency:'TRY'}))}</strong>${Number(c.normalPrice)>Number(c.salePrice)?`<span class="discount">%${Math.round((1-Number(c.salePrice)/Number(c.normalPrice))*100)} indirim</span>`:''}</div>`:c.price?`<p class="price">${esc(c.price)}</p>`:''}${c.end?`<p class="muted">Son geçerlilik tarihi: ${esc(c.end)}</p>`:''}<p class="muted">Sipariş formu teklif/talep oluşturur; ödeme alınmaz.</p></section><section class="panel"><h2>Sipariş Ver</h2><form id="orderForm"><input class="field" name="name" placeholder="Adınız / Firma adı" maxlength="100" required><input class="field" name="phone" placeholder="Telefon numarası" inputmode="tel" minlength="10" maxlength="20" required><input class="field" name="email" type="email" placeholder="E-posta (isteğe bağlı)"><textarea class="field" name="note" rows="4" maxlength="1000" placeholder="Sipariş notunuz"></textarea><button type="submit">Sipariş Talebi Gönder</button><p class="muted">Demo: Talep yalnızca bu tarayıcıda kaydedilir. Gerçek kişisel verilerle test etmeyin.</p><p id="message" role="status"></p></form></section></div>`;root.querySelectorAll('[data-gallery]').forEach(node=>{const show=()=>{document.getElementById('mainPreview').src=gallery[Number(node.dataset.gallery)]};node.onclick=show;node.onkeydown=e=>{if(e.key==='Enter')show()}});document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),phone=String(f.get('phone')).replace(/\D/g,'');if(phone.length<10||phone.length>15){document.getElementById('message').textContent='Geçerli bir telefon numarası girin.';return}let orders=[];try{orders=JSON.parse(localStorage.getItem('ft_orders_v1')||'[]')}catch{}orders.unshift({id:String(Date.now())+Math.random().toString(36).slice(2,7),date:new Date().toLocaleString('tr-TR'),service:c.title,category:'Kampanya',name:String(f.get('name')).trim(),phone:String(f.get('phone')).trim(),note:[String(f.get('email')||''),String(f.get('note')||'')].filter(Boolean).join(' | '),status:'Yeni',campaignId:c.id});try{localStorage.setItem('ft_orders_v1',JSON.stringify(orders));document.getElementById('message').textContent='Talebiniz bu cihazda kaydedildi (demo).';e.currentTarget.reset()}catch{document.getElementById('message').textContent='Kayıt başarısız. Tarayıcı depolama alanını kontrol edin.'}}}
</script></body></html>
