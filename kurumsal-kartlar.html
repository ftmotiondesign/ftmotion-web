<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurumsal Kartlar | FTMotion</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0c0e;color:#fff;font:15px system-ui}main{max-width:850px;margin:auto;padding:24px 16px}a{color:#ff903b}section{background:#19191c;border:1px solid #36363a;border-radius:18px;padding:20px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:10px}input{width:100%;background:#252529;color:white;border:1px solid #555}label{display:block;margin:12px 0}button{border:0;background:#ff7900;color:#111;font-weight:700;cursor:pointer}button.secondary{background:#343438;color:#fff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{border-top:1px solid #39393d;padding:14px 0}.muted{color:#aaa}small{color:#bbb}h1{margin-bottom:6px}h2{font-size:19px}#status{min-height:20px}</style></head><body><main><a href="/kartim.html">← İşletme paneline dön</a><h1>Kurumsal Kartlar</h1><p class="muted">Şirket yöneticisi tüm çalışan kartlarını buradan yönetir.</p><p id="status" role="status"></p><section><h2 id="formTitle">Çalışan ekle</h2><form id="form"><label>Ad Soyad<input name="full_name" maxlength="120" required></label><label>Görevi<input name="job_title" maxlength="100"></label><label>Telefon<input name="phone" type="tel" maxlength="35"></label><label>WhatsApp<input name="whatsapp" type="tel" maxlength="35"></label><label>E-posta<input name="email" type="email" maxlength="160"></label><label>Fotoğraf URL (isteğe bağlı)<input name="photo_url" type="url"></label><label><input name="is_active" type="checkbox" checked style="width:auto"> Kart aktif</label><div class="row"><button type="submit">Kaydet</button><button type="button" id="cancel" class="secondary">Yeni kayıt</button></div></form></section><section><h2>Çalışan kartları</h2><div id="list">Yükleniyor...</div></section></main><script type="module">
import {client} from '/shared/supabase-client.js';
const db=await client(),status=document.getElementById('status'),list=document.getElementById('list'),form=document.getElementById('form');let business,editing=null,employees=[];
const say=(s)=>status.textContent=s;const slugify=s=>s.toLocaleLowerCase('tr').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c').normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,75);
const field=k=>form.elements.namedItem(k);
function reset(){editing=null;form.reset();document.getElementById('formTitle').textContent='Çalışan ekle'}document.getElementById('cancel').onclick=reset;
async function load(){if(!business)return;const {data,error}=await db.from('corporate_employees').select('*').eq('business_id',business.id).order('created_at');if(error){say('Çalışanlar yüklenemedi. Önce SQL kurulumunu tamamlayın: '+error.message);return}employees=data||[];list.replaceChildren();if(!employees.length)list.textContent='Henüz çalışan eklenmedi.';for(const p of employees){const row=document.createElement('div');row.className='item';const title=document.createElement('strong');title.textContent=p.full_name+' · '+(p.job_title||'Görev belirtilmedi')+(p.is_active?'':' (Pasif)');row.append(title);const actions=document.createElement('div');actions.className='row';const link=document.createElement('a');link.href='/qr/'+encodeURIComponent(business.slug)+'/'+encodeURIComponent(p.slug);link.textContent='Kartı görüntüle';link.target='_blank';actions.append(link);const edit=document.createElement('button');edit.className='secondary';edit.textContent='Düzenle';edit.onclick=()=>{editing=p.id;for(const k of ['full_name','job_title','phone','whatsapp','email','photo_url'])field(k).value=p[k]||'';field('is_active').checked=p.is_active;document.getElementById('formTitle').textContent='Çalışanı düzenle';window.scrollTo({top:0,behavior:'smooth'})};actions.append(edit);row.append(actions);list.append(row)}}
form.onsubmit=async e=>{e.preventDefault();if(!business)return;const data={business_id:business.id};for(const k of ['full_name','job_title','phone','whatsapp','email','photo_url'])data[k]=field(k).value.trim();data.photo_url=data.photo_url||null;data.is_active=field('is_active').checked;if(!editing){const base=slugify(data.full_name)||'calisan';let slug=base,n=2;while(employees.some(p=>p.slug===slug))slug=base+'-'+n++;data.slug=slug}say('Kaydediliyor...');const q=editing?db.from('corporate_employees').update(data).eq('id',editing).eq('business_id',business.id):db.from('corporate_employees').insert(data);const {error}=await q;if(error){say('Kaydedilemedi: '+error.message);return}say('Kaydedildi.');reset();await load()};
try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Önce üye girişi yapın.');const r=await db.from('businesses').select('id,name,slug').eq('owner_id',user.id).limit(1).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('Hesabınıza bağlı işletme bulunamadı.');business=r.data;say(business.name+' çalışan kartları');await load()}catch(e){say(e.message)}
</script></body></html>
