name: Regenerate FTMotion PWA Icons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa-logo-icons.yml'
      - 'ftmotion-logo.webp'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Build branded icons from FTMotion logo
        shell: python
        run: |
          from PIL import Image, ImageOps, ImageDraw
          image = Image.open("ftmotion-logo.webp").convert("RGBA")
          for n in (192, 512):
              out = Image.new("RGBA",(n,n),(10,10,10,255))
              draw = ImageDraw.Draw(out)
              draw.rounded_rectangle((0,0,n-1,n-1),radius=int(n*.20),fill=(12,12,12,255))
              logo = image.copy()
              logo.thumbnail((int(n*.82),int(n*.82)),Image.Resampling.LANCZOS)
              out.alpha_composite(logo,((n-logo.width)//2,(n-logo.height)//2))
              out.convert("RGB").save(f"pwa-{n}.png",format="PNG",optimize=True)
      - name: Commit new icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa-192.png pwa-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Use original FTMotion logo for Android home screen icons"
            git push
          fi
