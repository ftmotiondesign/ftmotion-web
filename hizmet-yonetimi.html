<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dijital Hizmet Yönetimi | FT Motion</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font:15px/1.5 system-ui}main{max-width:920px;margin:auto;padding:26px 18px}a{color:#ff9b40}h1{margin-bottom:4px}.sub{color:#bbb}.card{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#181818;border:1px solid #373737;border-radius:13px;padding:16px;margin:10px 0}.card b{display:block}.card small{color:#aaa}.switch{padding:10px 15px;border:1px solid #555;background:#333;color:white;border-radius:9px;cursor:pointer;min-width:95px;font-weight:750}.switch.on{background:#ff7900;border-color:#ff7900;color:#111}.switch:disabled{opacity:.5}.status{padding:12px;border:1px solid #555;border-radius:9px;color:#ffcc9a;margin:18px 0}header{border-bottom:1px solid #333;padding:18px;background:#111}header a{margin-right:20px}@media(max-width:480px){.card{padding:13px}.switch{min-width:84px}}</style></head><body><header><a href="/yonetim.html">← Yönetim Merkezi</a><a href="/" target="_blank" rel="noopener">Siteyi Görüntüle ↗</a></header><main><h1>Dijital Hizmet Yönetimi</h1><p class="sub">Bir hizmeti pasif yaparsanız ana sayfadaki kartı gizlenir. İçeriği silinmez; tekrar aktif edebilirsiniz.</p><div id="status" class="status">Yönetici oturumu kontrol ediliyor…</div><div id="items"></div></main><script type="module">import {client,currentUser} from './shared/supabase-client.js';const names=['QR & NFC Çözümleri','QR Menü','360° Sanal Tur','Sosyal Medya & Video','Sanal Drone & Konum','Web Tasarım & Yazılım','Grafik Tasarım','Emlak & Otomotiv','Yapay Zekâ İçerik'];const status=document.getElementById('status'),root=document.getElementById('items');try{const db=await client();const user=await currentUser(db);if(!user){location.href='/giris.html';throw Error('Giriş gerekli')}const {data:admin,error:ae}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(ae||!admin)throw Error('Bu ekran yalnızca yöneticilere açıktır.');const {data,error}=await db.from('ft_service_visibility').select('service_id,active').order('service_id');if(error)throw Error('Önce FT-HIZMET-AKTIF-PASIF.sql dosyasını Supabase SQL Editor üzerinde çalıştırın. '+error.message);const map=new Map((data||[]).map(x=>[x.service_id,x.active]));names.forEach((name,i)=>{const card=document.createElement('div');card.className='card';const info=document.createElement('div');const title=document.createElement('b');title.textContent=name;const small=document.createElement('small');const btn=document.createElement('button');btn.type='button';btn.className='switch';let active=map.get(i)!==false;function refresh(){btn.textContent=active?'Aktif':'Pasif';btn.classList.toggle('on',active);small.textContent=active?'Ana sayfada görünüyor':'Ana sayfada gizli'}refresh();btn.addEventListener('click',async()=>{btn.disabled=true;status.textContent='Kaydediliyor…';const next=!active;const {error}=await db.from('ft_service_visibility').upsert({service_id:i,active:next},{onConflict:'service_id'});if(error)status.textContent='Kaydedilemedi: '+error.message;else{active=next;refresh();status.textContent=name+' '+(active?'aktif edildi.':'pasif yapıldı.')}btn.disabled=false});info.append(title,small);card.append(info,btn);root.append(card)});status.textContent='Hazır. Değişiklikler kaydedildiğinde ziyaretçi sayfasına yansır.'}catch(e){status.textContent=e.message||String(e)}</script></body></html>
