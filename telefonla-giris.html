<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telefonla Üyelik | FTMotion</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#20242a;font:15px/1.5 system-ui}.wrap{max-width:480px;margin:40px auto;padding:18px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:24px}input,select,button{width:100%;padding:12px;margin:6px 0 14px;border-radius:9px;border:1px solid #ccc;font:inherit}button{background:#f57900;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.muted{color:#616976}.hide{display:none}a{color:#a95100}#msg{white-space:pre-wrap}</style></head><body><main class="wrap"><a href="giris.html">← Giriş ekranına dön</a><h1>Telefonla devam et</h1><div class="card"><label>İşlem<select id="mode"><option value="signup">Telefonla üye ol</option><option value="signin">Telefonla giriş yap</option><option value="reset">Telefonla şifremi yenile</option></select></label><label>Cep telefonu<input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05XX XXX XX XX"></label><label id="passwordLabel">Şifre<input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="En az 6 karakter"></label><button id="start">Devam Et</button><section id="verify" class="hide"><p class="muted">Telefonunuza gelen 6 haneli SMS kodunu girin.</p><label>SMS doğrulama kodu<input id="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code"></label><button id="confirm">Kodu Doğrula</button></section><section id="newPassword" class="hide"><label>Yeni şifre<input id="fresh" type="password" minlength="6" autocomplete="new-password"></label><button id="savePassword">Şifremi Güncelle</button></section><p id="msg" class="muted" role="status" aria-live="polite"></p></div></main><script type="module">import {client} from './shared/supabase-client.js';const $=id=>document.getElementById(id);let db,number='',flow='';const say=s=>$('msg').textContent=s;function normalize(v){const digits=v.replace(/\D/g,'');if(/^05\d{9}$/.test(digits))return '+90'+digits.slice(1);if(/^5\d{9}$/.test(digits))return '+90'+digits;if(/^905\d{9}$/.test(digits))return '+'+digits;throw Error('Türkiye cep telefonu numarasını 05XX XXX XX XX şeklinde girin.')}function setMode(){const m=$('mode').value;$('passwordLabel').classList.toggle('hide',m==='reset');$('verify').classList.add('hide');$('newPassword').classList.add('hide');say('')} $('mode').onchange=setMode;$('start').onclick=async()=>{const b=$('start');b.disabled=true;try{db=await client();number=normalize($('phone').value);flow=$('mode').value;const password=$('password').value;if(flow!=='reset'&&password.length<6)throw Error('Şifre en az 6 karakter olmalı.');let result;if(flow==='signup')result=await db.auth.signUp({phone:number,password});else if(flow==='signin')result=await db.auth.signInWithPassword({phone:number,password});else result=await db.auth.signInWithOtp({phone:number,options:{shouldCreateUser:false}});if(result.error)throw result.error;if(flow==='signin'){location.replace('kartim.html');return}if(flow==='signup'&&result.data?.session){location.replace('kartim.html');return}$('verify').classList.remove('hide');say('SMS doğrulama kodunu girin. Kod ulaşmadıysa SMS servisinin etkin olduğunu kontrol edin.')}catch(e){say('İşlem tamamlanamadı: '+(e.message||e))}finally{b.disabled=false}};$('confirm').onclick=async()=>{const b=$('confirm');b.disabled=true;try{const token=$('otp').value.trim();if(!/^\d{6}$/.test(token))throw Error('6 haneli kodu girin.');const {error}=await db.auth.verifyOtp({phone:number,token,type:'sms'});if(error)throw error;if(flow==='reset'){$('verify').classList.add('hide');$('newPassword').classList.remove('hide');say('Telefon doğrulandı. Yeni şifrenizi belirleyin.')}else{say('Telefon doğrulandı. Yönlendiriliyorsunuz...');location.replace('kartim.html')}}catch(e){say('Doğrulanamadı: '+(e.message||e))}finally{b.disabled=false}};$('savePassword').onclick=async()=>{const b=$('savePassword');b.disabled=true;try{const pass=$('fresh').value;if(pass.length<6)throw Error('Şifre en az 6 karakter olmalı.');const {error}=await db.auth.updateUser({password:pass});if(error)throw error;say('Şifreniz güncellendi. Yönlendiriliyorsunuz...');location.replace('kartim.html')}catch(e){say(e.message||String(e))}finally{b.disabled=false}};</script></body></html>
