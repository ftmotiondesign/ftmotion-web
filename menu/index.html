<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMotion Dijital Menü · Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#edf6ff;font:15px system-ui}a{color:#65e0c5}header{padding:17px 5%;background:#142131}main{max-width:1150px;margin:32px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1.1fr;gap:22px}.box{background:#162536;border:1px solid #34485b;border-radius:18px;padding:22px}label{display:block;margin:12px 0 4px;color:#bdd0df;font-size:13px}input,select,textarea{width:100%;padding:11px;background:#0b1624;border:1px solid #52667b;border-radius:9px;color:white;font:inherit}button{border:0;background:#5de1c3;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin:8px 5px 8px 0}.secondary{background:#344f62;color:white}.row{display:flex;gap:8px;flex-wrap:wrap}.product{padding:13px;border:1px solid #405367;margin:9px 0;border-radius:10px;display:flex;justify-content:space-between;gap:10px}.product p{margin:4px 0;color:#b2c2cf}.price{color:#56e4c5;font-weight:bold}.preview{background:#f8fafb;color:#182e36;padding:15px;border-radius:15px}.preview h2{margin:5px 0}.preview .tabs{display:flex;gap:7px;flex-wrap:wrap}.preview .tabs button{background:#e0ebec;color:#263b43}.preview .tabs button.active{background:#175c57;color:#fff}.preview .product{border-color:#d5e1e3}.preview .product p{color:#647680}.small{font-size:12px;color:#a6bdcb}@media(max-width:800px){main{grid-template-columns:1fr}}</style></head><body><header><a href="../index.html">← FTMotion</a>　<strong>QR Menü Yönetim Paneli · Demo</strong></header><main><section class="box"><h2>Menü Yönetimi</h2><p class="small">Kategori/ürün ekleme, silme ve aktif/pasif yapma bu tarayıcıda çalışır. Gerçek kullanıcı girişi, fotoğraf yükleme ve sunucu kaydı sonraki aşamadır.</p><label>Yeni kategori adı</label><div class="row"><input id="newCategory" style="flex:1" placeholder="Örn. Tatlılar"><button onclick="addCategory()">Kategori Ekle</button></div><label>Ürün adı</label><input id="name" placeholder="Örn. Latte"><label>Kategori</label><select id="category"></select><label>Fiyat (₺)</label><input id="price" type="number" min="0" value="120"><label>Açıklama</label><textarea id="description" placeholder="Ürün içeriği"></textarea><button onclick="addProduct()">+ Ürün Ekle</button><h3>Mevcut ürünler</h3><div id="manageList"></div></section><section class="box"><h2>Müşteri Menü Önizleme</h2><div class="preview"><h2>☕ Örnek Kafe</h2><p>QR kodu okutan müşterinin göreceği menü</p><div class="tabs" id="tabs"></div><div id="previewList"></div></div></section></main><script>const initial={categories:['Kahveler','Soğuk İçecekler','Tatlılar'],products:[{id:1,name:'Latte',category:'Kahveler',price:120,description:'Espresso ve süt',active:true},{id:2,name:'Limonata',category:'Soğuk İçecekler',price:95,description:'Taze limon',active:true},{id:3,name:'Cheesecake',category:'Tatlılar',price:165,description:'Günlük tatlı',active:true}]};let state=JSON.parse(localStorage.getItem('ftmotion_menu_demo')||'null')||initial;let current=state.categories[0];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}const money=n=>Number(n).toLocaleString('tr-TR')+' ₺';function store(){localStorage.setItem('ftmotion_menu_demo',JSON.stringify(state));render()}function addCategory(){let v=newCategory.value.trim();if(!v||state.categories.includes(v))return alert('Farklı bir kategori adı yazın');state.categories.push(v);newCategory.value='';current=v;store()}function addProduct(){let n=name.value.trim(),p=Number(price.value);if(!n||!Number.isFinite(p)||p<0)return alert('Ürün adı ve geçerli fiyat girin');state.products.push({id:Date.now(),name:n,category:category.value,price:p,description:description.value.trim(),active:true});name.value='';description.value='';store()}function removeProduct(id){if(confirm('Ürün silinsin mi?')){state.products=state.products.filter(p=>p.id!==id);store()}}function toggle(id){let p=state.products.find(p=>p.id===id);if(p){p.active=!p.active;store()}}function editPrice(id){let p=state.products.find(p=>p.id===id);if(!p)return;let next=prompt('Yeni fiyat (₺)',p.price);if(next!==null&&next.trim()!==''&&Number(next)>=0){p.price=Number(next);store()}}function render(){category.innerHTML=state.categories.map(c=>`<option>${esc(c)}</option>`).join('');if(!state.categories.includes(current))current=state.categories[0];tabs.innerHTML=state.categories.map(c=>`<button class="${current===c?'active':''}" onclick="current=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">${esc(c)}</button>`).join('');manageList.innerHTML=state.products.map(p=>`<div class="product"><div><b>${esc(p.name)}</b><p>${esc(p.category)} · ${money(p.price)} · ${p.active?'Aktif':'Pasif'}</p></div><div><button class="secondary" onclick="editPrice(${p.id})">Fiyat</button><button class="secondary" onclick="toggle(${p.id})">${p.active?'Kapat':'Aç'}</button><button class="secondary" onclick="removeProduct(${p.id})">Sil</button></div></div>`).join('')||'<p>Henüz ürün yok</p>';previewList.innerHTML=state.products.filter(p=>p.category===current&&p.active).map(p=>`<div class="product"><div><b>${esc(p.name)}</b><p>${esc(p.description)}</p></div><span class="price">${money(p.price)}</span></div>`).join('')||'<p>Bu kategoride aktif ürün bulunmuyor.</p>'}render()</script></body></html>
