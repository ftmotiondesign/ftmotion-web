async function detail(id,push=false){const v=++detailVersion;activePlace=null;$('#placeBody').innerHTML='<div class="loading-state">Yer detayları yükleniyor…</div>';if(!$('#placeModal').open)$('#placeModal').showModal();if(push){if(!location.pathname.startsWith('/yer/'))returnPath=location.pathname+location.search;history.pushState({place:id},'', '/yer/'+encodeURIComponent(id));}try{const d=await api('place?id='+encodeURIComponent(id));if(v!==detailVersion)return;const p=d.place;activePlace=p;document.title=p.name+' · DijiRehber';const img=p.photos?.[0],map=p.locationVerified&&p.latitude!==null?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.latitude+','+p.longitude):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+' '+p.district+' '+p.city);

async function preparePhoto(file){const image=await createImageBitmap(file);try{const scale=Math.min(1,1800/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Fotoğraf hazırlanamadı.')),'image/jpeg',.86));}finally{image.close();}}

document.addEventListener('click',async e=>{const el=e.target.closest('button,a');if(!el)return;try{if(el.dataset.place){e.preventDefault();await detail(el.dataset.place,true);}if(el.dataset.routePlace){e.preventDefault();$('#writeModal').close();await detail(el.dataset.routePlace,true);}if(el.dataset.save){e.preventDefault();await toggleSave(el.dataset.save);}if(el.dataset.category!==undefined){category=el.dataset.category;if(home){location.href='/kesfet/'+city+'?kategori='+encodeURIComponent(category);return;}page=1;document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('active',b.dataset.category===category));updateURL();loadPlaces();}if(el.hasAttribute('data-more')&&!listBusy){page++;await loadPlaces(false,true);}if(el.hasAttribute('data-retry'))loadPlaces(home);if(el.hasAttribute('data-nearby'))nearby();if(el.hasAttribute('data-clear')){district='';category='';query='';near=null;page=1;updateURL();listPage();}if(el.dataset.sponsor)sponsorDetail(el.dataset.sponsor);if(el.dataset.route)await routeDetail(el.dataset.route);if(el.dataset.writeReview)editReview(el.dataset.writeReview);if(el.dataset.editReview){const r=me.reviews.find(r=>r.id===el.dataset.editReview);editReview(r.place_id,r);}if(el.dataset.removeReview){await api('review',{id:el.dataset.removeReview,remove:true});me=await api('me');accountPage();toast('Paylaşımın yayından kaldırıldı.');}if(el.dataset.removePhoto){await api('remove-photo',{id:el.dataset.removePhoto});me=await api('me');const r=me.reviews.find(r=>r.id===el.dataset.review);editReview(r.place_id,r);}if(el.dataset.report){if(!me){signIn();return;}write('Paylaşımı bildir','<form id="reportForm" class="write-form"><label for="reportReason">Bildirim nedeni</label><textarea id="reportReason" minlength="5" maxlength="500" required placeholder="Sorunu kısaca açıkla"></textarea><p class="error" role="alert" id="reportError"></p><button class="button">Bildirimi gönder</button></form>');$('#reportForm').onsubmit=async ev=>{ev.preventDefault();try{await api('report',{reviewId:el.dataset.report,reason:$('#reportReason').value});$('#writeModal').close();toast('Bildirimin yönetime iletildi.');}catch(err){$('#reportError').textContent=err.message;}};}if(el.dataset.gallery!==undefined&&activePlace){const p=activePlace.photos[Number(el.dataset.gallery)];$('#detailCover').src=p.url;$('#detailCredit').innerHTML=photoCredit(p);}if(el.hasAttribute('data-share')){const url=location.origin+'/yer/'+encodeURIComponent(activePlace.id);try{await navigator.clipboard.writeText(url);toast('Yer bağlantısı kopyalandı.');}catch{write('Yer bağlantısı','<input value="'+esc(url)+'" readonly aria-label="Yer bağlantısı">');}}}catch(err){toast(err.message);}});
(async()=>{try{[bootstrap,me]=await Promise.all([api('bootstrap'),api('me',undefined,true)]);if(!province())city='canakkale';const qs=new URL(location.href).searchParams;if(qs.has('lat')&&qs.has('lng'))near={lat:qs.get('lat'),lng:qs.get('lng')};document.querySelector('[data-mobile="'+(account?'account':savedPage?'saved':home?'home':'explore')+'"]').classList.add('active');if(account)accountPage();else if(savedPage)favorites();else if(hotelInfo)hotelPage();else if(home)homepage();else listPage();if(parts[0]==='yer'&&parts[1])await detail(decodeURIComponent(parts[1]));}catch(e){main.innerHTML='<div class="empty"><h1>Rehbere ulaşılamadı.</h1><p>'+esc(e.message)+'</p><button class="button" id="reloadApp">Yeniden dene</button></div>';$('#reloadApp').onclick=()=>location.reload();}finally{main.setAttribute('aria-busy','false');}})();
})();
