<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DijiRehber">
<title>DijiRehber | FTMotion</title><link rel="manifest" href="/dijirehber/manifest.webmanifest"><link rel="icon" href="/pwa-192.png"><link rel="apple-touch-icon" href="/pwa-192.png">
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui;background:#0b0b0b;color:#fff}iframe{border:0;width:100%;height:100%;display:block}#bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#181818;border:1px solid #555;border-radius:15px;padding:10px;z-index:3;box-shadow:0 4px 20px #0008;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px)}button,a{border:0;border-radius:10px;padding:11px 14px;background:#ff7900;color:#111;font-weight:700;cursor:pointer;text-decoration:none;font-size:13px;white-space:nowrap}#close{background:#333;color:white}#help{display:none;position:fixed;bottom:90px;left:15px;right:15px;background:#202020;border-radius:14px;padding:18px;z-index:4;line-height:1.5}#fallback{display:none;position:absolute;inset:0;place-content:center;text-align:center;padding:24px}iframe:not([src])+#fallback{display:grid}</style></head>
<body><iframe id="app" src="https://otelbuddy-kiyi-demo.sillypine8.chatgpt.site/" title="DijiRehber uygulaması" allow="geolocation; camera; clipboard-write"></iframe>
<div id="fallback"><h1>DijiRehber</h1><p>Uygulama yüklenemedi.</p><a href="https://otelbuddy-kiyi-demo.sillypine8.chatgpt.site/">Uygulamayı aç</a></div>
<div id="bar"><button id="install">Ana Ekrana Ekle</button><a href="https://otelbuddy-kiyi-demo.sillypine8.chatgpt.site/" target="_blank" rel="noopener">Yeni sekmede aç ↗</a><button id="close" aria-label="Kapat">×</button></div>
<div id="help" role="status"></div>
<script>
let deferred=null;const install=document.getElementById('install'),help=document.getElementById('help');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});
install.addEventListener('click',async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;return;}const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);help.textContent=ios?'Safari paylaş menüsüne dokunun, ardından “Ana Ekrana Ekle” seçeneğini seçin.':'Tarayıcı menüsünden “Ana ekrana ekle” veya “Uygulamayı yükle” seçeneğini seçin.';help.style.display='block';});
document.getElementById('close').onclick=()=>{document.getElementById('bar').style.display='none';help.style.display='none'};
window.addEventListener('appinstalled',()=>{document.getElementById('bar').style.display='none';help.style.display='none'});
</script></body></html>
