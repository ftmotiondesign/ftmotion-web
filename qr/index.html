<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMotion QR / NFC · Demo</title><style>body{margin:0;background:#0c1320;color:#e9f5ff;font:15px system-ui}*{box-sizing:border-box}header{background:#141e2c;padding:18px 5%;border-bottom:1px solid #34445a}a{color:#62dfc6}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1100px;margin:35px auto;padding:0 18px}.panel,.preview{background:#172436;border:1px solid #35465b;border-radius:18px;padding:24px}label{display:block;font-size:12px;color:#b3c7d7;margin-top:12px}input,textarea{display:block;width:100%;border:1px solid #506279;background:#0b1522;color:white;border-radius:10px;padding:12px;margin-top:6px;font:inherit}button{background:#63e3cb;color:#06252c;border:0;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:14px}.phone{background:white;color:#1a2734;border-radius:25px;margin:auto;max-width:330px;overflow:hidden;text-align:center;min-height:490px}.cover{height:116px;background:linear-gradient(125deg,#295e75,#49bea8)}.logo{font-size:36px;background:#e5faf6;border:4px solid white;border-radius:30px;padding:13px;display:inline-block;margin-top:-34px;position:relative}.phone p{color:#657b8e;padding:0 16px}.links{padding:10px 22px}.links a{display:block;background:#e3f6f3;padding:11px;border-radius:10px;margin:8px 0;color:#173c40;text-decoration:none}.tiny{font-size:12px;color:#aac1d0} @media(max-width:750px){main{grid-template-columns:1fr}}</style></head><body><header><a href="../index.html">← FTMotion</a> <strong style="margin-left:18px">QR/NFC İşletme Yönetim Paneli · Demo</strong></header><main><section class="panel"><h2>İşletme bilgileri</h2><p class="tiny">Değişiklikler sadece bu cihazın tarayıcısına kaydolur. Gerçek üyelik, QR yayınlama ve bulut fotoğraf yükleme henüz bağlı değildir.</p><div id="fields"></div><button onclick="save()">Kaydet ve Önizle</button> <button onclick="reset()" style="background:#516479;color:white">Sıfırla</button><p id="status" class="tiny"></p></section><section class="preview"><h2>QR Sayfası Önizleme</h2><div class="phone"><div class="cover"></div><div class="logo">🏢</div><h2 id="pname"></h2><p id="pdesc"></p><div class="links" id="links"></div><p style="font-size:11px">FTMotion QR · Demo</p></div></section></main><script>const schema=[['name','İşletme adı'],['desc','Kısa açıklama'],['phone','Telefon'],['whatsapp','WhatsApp numarası (905...)'],['address','Adres'],['maps','Google Haritalar bağlantısı'],['reviews','Google yorum bağlantısı'],['instagram','Instagram bağlantısı'],['website','Web sitesi bağlantısı']];const initial={name:'Örnek İşletme',desc:'Dijital iletişim kartımız',phone:'',whatsapp:'',address:'',maps:'',reviews:'',instagram:'',website:''};let data={...initial,...JSON.parse(localStorage.getItem('ftmotion_qr_demo')||'{}')};let esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));fields.innerHTML=schema.map(([k,v])=>`<label>${v}<input id="f_${k}" value="${esc(data[k])}"></label>`).join('');function safeUrl(u){try{let v=new URL(u);return /^https?:$/.test(v.protocol)?v.href:null}catch{return null}}function preview(){pname.textContent=data.name;pdesc.textContent=data.desc+'\n'+data.address;let items=[];if(data.phone)items.push(['📞 Ara','tel:'+data.phone.replace(/[^\d+]/g,'')]);if(/^90\d{10}$/.test(data.whatsapp))items.push(['💬 WhatsApp','https://wa.me/'+data.whatsapp]);for(const [key,label] of [['maps','📍 Yol Tarifi'],['reviews','⭐ Google Yorum'],['instagram','📸 Instagram'],['website','🌐 Web Sitesi']]){let u=safeUrl(data[key]);if(u)items.push([label,u])}links.innerHTML=items.length?items.map(([label,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`).join(''):'<p>Bağlantılarınızı ekleyin.</p>'}function save(){for(const [key] of schema)data[key]=document.getElementById('f_'+key).value;localStorage.setItem('ftmotion_qr_demo',JSON.stringify(data));preview();status.textContent='Bu tarayıcıya kaydedildi.'}function reset(){localStorage.removeItem('ftmotion_qr_demo');location.reload()}preview();</script></body></html>
