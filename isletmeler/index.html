<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FTMotion İşletme Rehberi · TEST</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#fff;font:16px system-ui}header{background:#191b20;padding:20px 5%;border-bottom:1px solid #383838}b{color:#ff8300}main{max-width:1050px;margin:auto;padding:30px 20px}h1{font-size:clamp(27px,5vw,44px)}p{color:#b9bbc3}input,select{padding:14px;background:#24262c;border:1px solid #45474d;border-radius:12px;color:white;width:100%}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:25px}.card{background:#1d1f25;border:1px solid #34363c;border-radius:18px;padding:22px}.card h2{margin:6px 0;font-size:21px}.tag{font-size:12px;color:#ffac59}.button{display:inline-block;background:#ff8300;color:#161616;text-decoration:none;padding:11px 15px;border-radius:10px;font-weight:750}.notice{background:#332716;border:1px solid #765126;padding:12px;border-radius:12px;color:#ffd49b}@media(max-width:650px){.filters{grid-template-columns:1fr}}</style></head><body><header><strong>FT<b>MOTION</b> / İşletmeleri Keşfet</strong></header><main><div class="notice">GELİŞTİRME SÜRÜMÜ · Gerçek müşteri verileri henüz bağlanmadı. Google indekslemesi kapalıdır.</div><h1>Aradığınız işletme <b>burada.</b></h1><p>FTMotion dijital kartvizit müşterilerini il, ilçe ve sektörlerine göre keşfedin.</p><div class="filters"><input id="q" placeholder="İşletme veya hizmet ara…" aria-label="İşletme ara"><select id="city"><option value="">Tüm iller</option><option>Çanakkale</option></select><select id="sector"><option value="">Tüm sektörler</option><option>Dijital Hizmetler</option></select></div><div class="cards" id="cards"></div><p id="empty" hidden>Aramanıza uygun işletme bulunamadı.</p></main><script>const data=[{name:"FT Motion Design",city:"Çanakkale",sector:"Dijital Hizmetler",url:"https://ftmotion.com/qr/ft-motion-design"}];const q=document.querySelector("#q"),city=document.querySelector("#city"),sector=document.querySelector("#sector"),cards=document.querySelector("#cards"),empty=document.querySelector("#empty");function render(){const items=data.filter(x=>(x.name+" "+x.sector).toLocaleLowerCase("tr").includes(q.value.toLocaleLowerCase("tr"))&&(!city.value||city.value===x.city)&&(!sector.value||sector.value===x.sector));cards.replaceChildren();items.forEach(x=>{const e=document.createElement("article");e.className="card";const t=document.createElement("div");t.className="tag";t.textContent=x.city+" · "+x.sector;const h=document.createElement("h2");h.textContent=x.name;const a=document.createElement("a");a.className="button";a.href=x.url;a.textContent="Dijital Kartviziti Aç";e.append(t,h,a);cards.append(e)});empty.hidden=items.length>0}q.addEventListener("input",render);city.addEventListener("change",render);sector.addEventListener("change",render);render();</script></body></html>
