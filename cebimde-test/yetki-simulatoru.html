<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadakat Yetki Testi</title><style>body{font:16px system-ui;background:#14191d;color:white;max-width:720px;margin:auto;padding:20px}section{background:#242d33;border-radius:16px;padding:18px;margin:16px 0}label{display:block;margin:12px 0}select,input,button{font:inherit;padding:10px;border-radius:8px}select{width:100%}button{background:#ff8700;border:0;font-weight:bold}pre{white-space:pre-wrap}</style><h1>Cebimde • Sadakat Yetki Testi</h1><p>BAĞIMSIZ DEMO — Canlı Supabase'e bağlanmaz. Gerçek müşteri bilgisi girmeyin.</p><section><label>Örnek işletme<select id="biz"><option value="nfc">NFC kart sahibi</option><option value="only">Yalnızca Sadakat</option><option value="old">Mevcut işletme</option></select></label><label><input type="checkbox" id="card"> Dijital Kartım</label><label><input type="checkbox" id="site"> Web Sitem</label><label><input type="checkbox" id="loyalty"> Sadakat Yönetimi</label><label><input type="checkbox" id="approved"> Yönetici onayı (simülasyon)</label><label>Paket<select id="plan"><option>NFC ilk yıl ücretsiz</option><option>Başlangıç — öneri 990 TL/yıl</option><option>Profesyonel — öneri 1.990 TL/yıl</option><option>Kurumsal — öneri 3.490 TL/yıl</option></select></label><label>Başlangıç tarihi <input type="date" id="start"></label><button id="save">Örnek kaydı kaydet</button> <button id="reset">Sıfırla</button></section><section><h2>Yetki sonucu</h2><pre id="result"></pre></section><p>Bu demo gerçek giriş, ödeme, QR veya veritabanı yetkilendirmesi sağlamaz. Veriler yalnızca tarayıcınızda saklanır.</p><script>
const $=id=>document.getElementById(id),key='ft-cebimde-entitlements-demo';let initial={nfc:{card:true,site:true,loyalty:true,approved:true,plan:0},only:{card:false,site:false,loyalty:true,approved:false,plan:1},old:{card:true,site:true,loyalty:false,approved:true,plan:1}};let db;try{db=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch{db=structuredClone(initial)}const today=new Date().toISOString().slice(0,10);for(const x of Object.values(db))x.start??=today;
function render(){let x=db[$('biz').value];for(const id of ['card','site','loyalty','approved'])$(id).checked=!!x[id];$('plan').selectedIndex=x.plan;$('start').value=x.start;preview()}
function preview(){let start=$('start').value,expiry='tarih yok',valid=false;if(start){let d=new Date(start+'T12:00:00');if(!isNaN(d)){d.setDate(d.getDate()+365);expiry=d.toISOString().slice(0,10);valid=today<expiry}}$('result').textContent=['Dijital Kartım: '+($('card').checked?'Açık':'Kapalı'),'Web Sitem: '+($('site').checked?'Açık':'Kapalı'),'Sadakat: '+($('loyalty').checked&&$('approved').checked&&valid?'Aktif (demo)':'Pasif / onay veya süre gerekli'),'365 günlük dönem bitişi: '+expiry,'Gerçek tahsilat: YOK'].join('\n')}
$('biz').onchange=render;for(const id of ['card','site','loyalty','approved','plan','start'])$(id).onchange=preview;
$('save').onclick=()=>{let x={};for(const id of ['card','site','loyalty','approved'])x[id]=$(id).checked;x.plan=$('plan').selectedIndex;x.start=$('start').value;db[$('biz').value]=x;localStorage.setItem(key,JSON.stringify(db));preview();alert('Örnek kayıt yalnızca bu cihazda saklandı.')};
$('reset').onclick=()=>{localStorage.removeItem(key);db=structuredClone(initial);for(const x of Object.values(db))x.start=today;render()};render();</script>
