<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMotion İşletme Yönetimi</title><style>body{margin:0;background:#090e19;color:#eaf4ff;font:15px/1.6 system-ui}*{box-sizing:border-box}a{color:#58e0c4}header{padding:20px 5%;background:#142031}main{max-width:1040px;margin:30px auto;padding:0 16px}.box{background:#172436;border:1px solid #374c60;border-radius:16px;padding:22px;margin:15px 0}input,textarea,select{width:100%;padding:11px;background:#0e1a29;border:1px solid #53677d;border-radius:9px;color:white;margin:5px 0 12px;font:inherit}button{background:#58e0c4;color:#09262a;padding:11px 18px;border:0;border-radius:9px;cursor:pointer;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#abc0d2}label{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="shared/admin-sidebar.css"></head><body><header><a href="index.html">FTMotion</a> · İşletme Yönetimi · <a href="yonetim.html">Yönetici</a></header><main><h1>İşletme paneli</h1><p id="status">Oturum kontrol ediliyor...</p><div id="ui" hidden><div class="box"><label>İşletme seç<select id="business"></select></label><button id="newBusiness">Yeni işletme oluştur</button></div><div class="box"><h2>QR/NFC işletme bilgileri</h2><div id="fields" class="grid"></div><button id="saveBusiness">Kaydet</button></div><div class="box"><h2>Dijital menü kategorileri</h2><label>Kategori adı<input id="categoryName" placeholder="İçecekler"></label><button id="addCategory">Kategori ekle</button><div id="categories"></div></div><div class="box"><h2>Dijital menü ürünleri</h2><div class="grid"><label>Ürün adı<input id="productName"></label><label>Kategori<select id="productCategory"></select></label><label>Fiyat (TL)<input type="number" id="productPrice" min="0"></label><label>Fotoğraf URL<input id="productImage" placeholder="https://..."></label></div><label>Açıklama<textarea id="productDesc"></textarea></label><button id="addProduct">Ürün ekle</button><div id="products"></div></div></div></main><script type="module">import {client,currentUser} from './shared/supabase-client.js';let db,user,businesses=[],current;const status=document.getElementById('status'),business=document.getElementById('business');const columns=['name','phone','whatsapp','address','instagram','website','maps_url','logo_url','cover_url'];const names=['İşletme adı','Telefon','WhatsApp','Adres','Instagram','Web sitesi','Harita bağlantısı','Logo URL','Kapak URL'];const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const {data,error}=await db.from('businesses').select('*').order('created_at',{ascending:false});if(error)throw error;businesses=data;business.innerHTML=data.map(x=>`<option value="${x.id}">${safe(x.name)}</option>`).join('');current=data[0];await render()}async function render(){if(!current){fields.innerHTML='Henüz işletme yok';categories.innerHTML='';products.innerHTML='';return}business.value=current.id;fields.innerHTML=columns.map((x,i)=>`<label>${names[i]}<input data-field="${x}" value="${safe(current[x])}"></label>`).join('');const [{data:cats,error:ce},{data:ps,error:pe}]=await Promise.all([db.from('menu_categories').select('*').eq('business_id',current.id).order('sort_order'),db.from('menu_products').select('*').eq('business_id',current.id).order('sort_order')]);if(ce||pe){status.textContent=(ce||pe).message;return}categories.textContent=cats.map(x=>x.name).join(' · ')||'Kategori yok';productCategory.innerHTML=cats.map(x=>`<option value="${x.id}">${safe(x.name)}</option>`).join('');products.textContent=ps.map(x=>`${x.name} — ${x.price} TL`).join(' · ')||'Henüz ürün yok'}function showErr(e){status.textContent=e?'Hata: '+e.message:'İşlem tamamlandı.'}try{db=await client();user=await currentUser(db);if(!user){location.replace('giris.html?next=isletme-yonetimi.html');throw Error('Giriş gerekli')}ui.hidden=false;status.textContent='Giriş: '+user.email;await load();business.onchange=async()=>{current=businesses.find(x=>x.id===business.value);await render()};newBusiness.onclick=async()=>{const {error}=await db.from('businesses').insert({owner_id:user.id,name:'Yeni işletme'});showErr(error);if(!error)await load()};saveBusiness.onclick=async()=>{if(!current)return;const info={};document.querySelectorAll('[data-field]').forEach(el=>info[el.dataset.field]=el.value.trim());const {error}=await db.from('businesses').update(info).eq('id',current.id);showErr(error);if(!error)await load()};addCategory.onclick=async()=>{if(!current||!categoryName.value.trim())return;let {error}=await db.from('menu_categories').insert({business_id:current.id,name:categoryName.value.trim()});showErr(error);if(!error){categoryName.value='';await render()}};addProduct.onclick=async()=>{if(!current||!productName.value.trim()||!productCategory.value)return;let {error}=await db.from('menu_products').insert({business_id:current.id,category_id:productCategory.value,name:productName.value.trim(),description:productDesc.value,price:Number(productPrice.value),image_url:productImage.value.trim()});showErr(error);if(!error){productName.value='';await render()}}}catch(e){status.textContent=e.message||String(e)}</script><script type="module" src="shared/admin-sidebar.js"></script></body></html>
